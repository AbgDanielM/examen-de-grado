responder solo hasta el valor de lo que garantizó.","La nulidad de la fianza, porque el acreedor debió demandar primero al deudor."],"e":"El beneficio de excusión debe oponerse en la oportunidad legal y el fiador debe señalar los bienes del deudor. No procede si el fiador se obligó como codeudor solidario o renunció al beneficio (art. 2358 CC)."},{"a":"C","u":"Familia","q":"Dos personas de 17 años quieren casarse con la autorización de sus padres. ¿Pueden hacerlo?","o":["No, porque desde la Ley 21.515 la edad mínima es de 18 años, sin excepción por asenso.","Sí, con el asenso de sus padres, otorgado ante el oficial del Registro Civil.","Sí, con autorización del juez de familia, si hay motivos graves que lo justifiquen."],"e":"La Ley 21.515 (2022) prohibió el matrimonio de menores de 18 años y derogó las normas sobre asenso (arts. 105 a 116 CC)."},{"a":"C","u":"Familia","q":"Una pareja del mismo sexo, casada en 2023 bajo sociedad conyugal, quiere saber si el régimen se aplica a su matrimonio.","o":["Se entienden separados totalmente de bienes, salvo que pacten participación en los gananciales.","Se les aplica la sociedad conyugal, igual que a cualquier otro matrimonio, salvo pacto en contrario.","No pueden tener régimen patrimonial alguno, y sus bienes se rigen por las reglas de la comunidad."],"e":"La Ley 21.400 (art. 135 inc. 3 CC) estableció que los cónyuges del mismo sexo se entienden separados totalmente de bienes, sin perjuicio de pactar participación en los gananciales."},{"a":"C","u":"Familia","q":"Un padre adeuda varias pensiones de alimentos decretadas judicialmente. Años después, ya anciano, demanda alimentos a su hijo. ¿Cómo se resuelve?","o":["Debe rechazarse, porque queda privado de pedir alimentos el padre que no pagó pensión judicialmente decretada.","Debe acogerse, porque los hijos siempre deben alimentos a sus padres, cualquiera sea su conducta anterior.","Debe acogerse solo por la mitad, compensando lo adeudado por el padre con lo que le deba el hijo."],"e":"Art. 324 inc. final CC."},{"a":"C","u":"Sucesorio","q":"Carlos muere sin testamento. Le sobreviven su cónyuge y dos hijos. La herencia es de $90 millones. ¿Cuánto recibe cada uno?","o":["Cónyuge $45 millones y cada hijo $22,5 millones.","Cónyuge $30 millones y cada hijo $30 millones.","Cónyuge $22,5 millones y cada hijo $33,75 millones."],"e":"Art. 988 CC: el cónyuge lleva el doble de la porción de cada hijo. Con dos hijos: 2x + x + x = 90, x = 22,5. La porción del cónyuge no puede bajar de la cuarta parte de la herencia."},{"a":"C","u":"Sucesorio","q":"Andrea muere sin testamento. Su hijo Pedro había muerto antes que ella, dejando dos hijos. Andrea deja además otra hija viva. ¿Cómo se reparte?","o":["La hija lleva la mitad; los dos nietos, la otra mitad por representación, por partes iguales.","La hija lleva toda la herencia, porque los nietos son excluidos por el pariente de grado más próximo.","La herencia se divide en tres partes iguales entre la hija y los dos nietos, por cabezas."],"e":"Arts. 984 y 985 CC: los nietos representan a su padre premuerto y heredan por estirpes, llevando entre todos lo que habría correspondido a Pedro."},{"a":"C","u":"Sucesorio","q":"Un hombre muere sin testamento y sin hijos. Le sobreviven su conviviente civil, con quien tenía un acuerdo de unión civil vigente, y sus padres. ¿Hereda la conviviente?","o":["Sí: el conviviente civil hereda como el cónyuge, y lleva dos tercios frente a los ascendientes.","No: el conviviente civil solo hereda si no hay ascendientes ni descendientes del causante.","No: el conviviente civil solo puede recibir bienes si el causante otorgó testamento a su favor."],"e":"En el segundo orden de sucesión concurren los ascendientes y el cónyuge (o conviviente civil): la herencia se divide en tres partes, dos para el cónyuge (o conviviente civil) y una para los ascendientes (art. 989 CC)."},{"a":"C","u":"Sucesorio","q":"Un heredero mató al causante para heredarlo y fue condenado por homicidio. Los demás herederos quieren excluirlo. ¿Qué deben hacer?","o":["Demandar que se le declare judicialmente indigno de suceder.","Nada, porque queda excluido automáticamente por la sentencia penal.","Pedir la nulidad absoluta de la aceptación de la herencia."],"e":"La indignidad debe ser declarada judicialmente a instancia de cualquiera de los interesados (art. 974 CC) y se purga en cinco años de posesión (art. 975 CC)."},{"a":"P","u":"Procesal Orgánico","q":"Un demandante presenta en Santiago una demanda civil contra un demandado domiciliado en Iquique. El demandado contesta la demanda sin alegar nada sobre la competencia. ¿Puede después reclamar la incompetencia?","o":["No, porque prorrogó tácitamente la competencia al hacer una gestión distinta de reclamarla.","Sí, en cualquier momento del juicio, porque la incompetencia puede alegarse siempre.","Sí, porque la competencia en razón del territorio es de orden público e irrenunciable."],"e":"La competencia relativa (territorial) es prorrogable en asuntos civiles contenciosos de primera instancia entre tribunales ordinarios de igual jerarquía (art. 182 COT)."},{"a":"P","u":"Procesal Orgánico","q":"Las partes de un contrato pactan que cualquier conflicto sobre alimentos debidos a un hijo será resuelto por un árbitro. ¿Es válida la cláusula?","o":["No, porque los alimentos son materia de arbitraje prohibido.","Sí, por la autonomía de la voluntad de las partes contratantes.","Sí, siempre que el árbitro designado sea abogado."],"e":"Art. 229 COT: no pueden ser sometidas a la resolución de árbitros las cuestiones que versen sobre alimentos o sobre el derecho de pedir separación de bienes entre marido y mujer."},{"a":"P","u":"Procesal Orgánico","q":"El juez de una causa civil es hermano de la parte demandante, y no lo declara. ¿Qué puede hacer la demandada?","o":["Alegar la implicancia, porque el juez es pariente colateral en segundo grado de una de las partes.","Alegar la recusación, porque el parentesco con las partes solo constituye causal de recusación.","Nada, porque las causales de inhabilidad deben alegarse antes de contestar la demanda."],"e":"Los hermanos son colaterales en segundo grado. Si fuera primo hermano (cuarto grado), sería causal de recusación (art. 196 N° 1 COT). Las implicancias son irrenunciables y el juez debe declararlas de oficio."},{"a":"P","u":"Normas Comunes","q":"El receptor busca al demandado en su domicilio dos días distintos y no lo encuentra. Los vecinos le informan que vive ahí y se encuentra en el lugar del juicio. ¿Cómo debe proceder?","o":["Notificar por el art. 44 en la misma diligencia, sin necesidad de nueva orden del tribunal.","Pedir previamente al tribunal que autorice la notificación del art. 44 por resolución.","Solicitar la notificación por avisos, porque el demandado no fue habido personalmente."],"e":"La Ley 21.394 suprimió la necesidad de una resolución que autorice la notificación subsidiaria. Luego el receptor envía carta certificada al notificado dentro de dos días (art. 46 CPC)."},{"a":"P","u":"Normas Comunes","q":"Una sentencia definitiva se notifica a las partes el lunes 2. El demandado quiere apelar. ¿Hasta cuándo puede hacerlo, si no hay feriados?","o":["Dentro de diez días hábiles desde su notificación.","Dentro de cinco días corridos desde su notificación.","Dentro de quince días hábiles desde su notificación."],"e":"Art. 189 CPC: cinco días, aumentado a diez tratándose de sentencias definitivas. Los plazos del CPC son de días hábiles (art. 66) y fatales (art. 64)."},{"a":"P","u":"Normas Comunes","q":"Un abogado no designa medio de notificación electrónico en su primera presentación. ¿Qué consecuencia tiene?","o":["Se le notifican por el estado diario todas las resoluciones posteriores.","Su escrito se tiene por no presentado para todos los efectos legales.","Se le aplica una multa y se le notifica por cédula en su domicilio."],"e":"Art. 49 CPC, modificado por la Ley 21.394."},{"a":"P","u":"Procedimiento Incidental","q":"El demandado, tras contestar la demanda, alega que la notificación de la demanda fue nula porque se dejó la copia en un domicilio equivocado. ¿Qué ocurre con su alegación?","o":["Debe rechazarse, porque al contestar la demanda se notificó tácitamente y se convalidó el vicio.","Debe acogerse, porque la falta de emplazamiento válido anula siempre todo lo obrado en el juicio.","Debe reservarse para la sentencia definitiva, que resolverá también sobre la nulidad."],"e":"La gestión de contestar supone conocimiento de la demanda; además el incidente debió promoverse antes de cualquier otra gestión (art. 84 CPC)."},{"a":"P","u":"Procedimiento Incidental","q":"En un juicio ordinario civil, la última resolución útil se dictó hace siete meses y ninguna parte ha hecho gestiones. El demandado pide que se declare el abandono. ¿Procede?","o":["Sí, porque las partes cesaron en la prosecución del juicio por más de seis meses.","No, porque para el abandono deben transcurrir a lo menos doce meses sin gestiones.","No, porque el abandono del procedimiento solo procede en el juicio ejecutivo."],"e":"El demandado puede alegarlo durante todo el juicio y hasta que se haya dictado sentencia ejecutoriada (art. 153 CPC). Si hace cualquier gestión que no tenga por objeto alegar el abandono, se entiende renunciado (art. 155 CPC)."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"Antes de presentar su demanda de cobro, un acreedor obtiene como medida prejudicial la retención de dineros del deudor. Han pasado veinte días y no ha demandado ni pedido ampliación del plazo. ¿Qué ocurre?","o":["La medida queda sin efecto y responde de los perjuicios, presumiéndose dolosa su conducta.","La medida se mantiene vigente hasta que el acreedor presente su demanda, sin plazo alguno.","No ocurre nada, porque el plazo para presentar la demanda es de sesenta días hábiles."],"e":"Art. 280 CPC: la demanda debe presentarse en diez días, ampliables hasta treinta por motivos fundados."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"El demandado, al contestar, alega que el actor le debe una suma y pide que se le condene a pagarla en el mismo juicio. ¿Qué figura procesal utiliza?","o":["La reconvención.","Una excepción dilatoria.","Una medida prejudicial."],"e":"La reconvención se deduce en el escrito de contestación y se tramita conjuntamente con la demanda principal."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"En un juicio ordinario de cobro de $50 millones, el demandado opone en la contestación la excepción de prescripción. ¿Es la oportunidad correcta, y podría haberla opuesto después?","o":["Sí, y además podría oponerla después, por escrito, hasta antes de la citación para oír sentencia.","Sí, pero solo en la contestación; después de ella precluye definitivamente su derecho a oponerla.","No, porque la prescripción solo puede oponerse como excepción dilatoria."],"e":"La prescripción es una de las excepciones anómalas del art. 310 CPC."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"Un imputado es condenado en juicio oral. La sentencia se le notifica y su defensa quiere recurrir de nulidad. El juicio duró tres días. ¿Qué plazo tiene?","o":["Quince días desde la notificación de la sentencia definitiva.","Diez días desde la notificación de la sentencia definitiva.","Cinco días desde la lectura del veredicto en la audiencia."],"e":"La Ley 21.694 amplió el plazo de diez a quince días. El aumento de un día por cada dos de exceso solo opera si el juicio duró más de cinco días."},{"a":"P","u":"Juicio Ejecutivo","q":"Un acreedor demanda ejecutivamente con un pagaré cuya firma fue autorizada ante notario. El deudor fue requerido de pago hace doce días dentro del territorio del tribunal y no ha opuesto excepciones. ¿Qué ocurre?","o":["El mandamiento de ejecución basta para seguir adelante con la ejecución, sin sentencia.","El tribunal debe citar a las partes a conciliación antes de seguir con la ejecución.","El deudor aún puede oponer excepciones hasta antes de que se dicte la sentencia definitiva."],"e":"Art. 472 CPC: si no se oponen excepciones dentro de plazo (ocho días, art. 459), se omite la sentencia y basta el mandamiento de ejecución para que el acreedor pueda perseguir la realización de los bienes embargados."},{"a":"P","u":"Juicio Ejecutivo","q":"En un juicio ejecutivo se embarga un auto que, en realidad, pertenece a un tercero ajeno a la deuda. ¿Qué puede hacer el tercero?","o":["Deducir una tercería de dominio en el mismo juicio ejecutivo.","Oponer la excepción de falsedad del título en el cuaderno ejecutivo.","Pedir el abandono del procedimiento por no ser parte del juicio ejecutivo."],"e":"Arts. 518 N° 1 y 521 CPC."},{"a":"P","u":"Juicio Sumario","q":"Un abogado demanda el cobro de sus honorarios a un cliente que no le pagó. ¿Qué procedimiento corresponde, por regla general?","o":["El juicio sumario.","El juicio ordinario de mayor cuantía.","El juicio ejecutivo."],"e":"Art. 680 N° 3 CPC, salvo el caso del art. 697 CPC (honorarios regulados en el mismo juicio)."},{"a":"P","u":"Recursos","q":"Un juez de letras dicta sentencia definitiva y la parte vencida estima que el fallo omitió resolver una de las acciones deducidas. ¿Qué recurso le permite invalidarlo por ese vicio?","o":["El recurso de casación en la forma, por no estar extendida en la forma legal.","El recurso de reposición, dentro de cinco días ante el mismo juez.","El recurso de casación en el fondo, por infracción de ley sustantiva."],"e":"Art. 768 N° 5 en relación con el art. 170 N° 6 CPC. Generalmente se interpone conjuntamente con la apelación."},{"a":"P","u":"Recursos","q":"Un juez de letras rechaza en primera instancia una demanda civil. El demandante quiere que la Corte revise el fondo del asunto. ¿Qué recurso debe interponer y en qué plazo?","o":["Apelación, dentro de diez días desde la notificación de la sentencia.","Casación en el fondo, dentro de quince días desde la notificación.","Reposición, dentro de cinco días desde la notificación."],"e":"Arts. 187 y 189 CPC. La casación en el fondo solo procede contra sentencias de las Cortes de Apelaciones o árbitros de segunda instancia (art. 767 CPC)."},{"a":"P","u":"Procesal Penal","q":"Carabineros detiene a una persona que acaba de robar una cartera, mientras huye del lugar. ¿Cuánto tiempo máximo puede pasar antes de que sea puesta a disposición del juez?","o":["Veinticuatro horas desde la detención.","Cuarenta y ocho horas desde la detención.","Cinco días desde la detención."],"e":"Arts. 130 y 131 CPP: se trata de un caso de flagrancia. La policía debe informar al fiscal dentro de doce horas."},{"a":"P","u":"Procesal Penal","q":"Un imputado sin antecedentes penales está formalizado por un delito cuya pena probable no excede de tres años. El fiscal y el imputado acuerdan que cumpla ciertas condiciones durante un año. ¿Qué salida es?","o":["La suspensión condicional del procedimiento.","Un acuerdo reparatorio con la víctima del delito.","La aplicación del principio de oportunidad."],"e":"Art. 237 CPP: requiere acuerdo del fiscal y el imputado y aprobación del juez de garantía."},{"a":"P","u":"Procesal Penal","q":"Dos años después de formalizar la investigación, el fiscal no la ha cerrado. ¿Qué puede hacer el imputado?","o":["Pedir al juez que aperciba al fiscal para que la cierre.","Pedir la nulidad de todo lo obrado en la investigación.","Pedir directamente que se dicte sentencia absolutoria."],"e":"Art. 247 CPP: si el fiscal no la cierra, el juez puede apercibirlo, y si no lo hace en el plazo, decretar el sobreseimiento definitivo."}]};

/* ---------- motor de preguntas ---------- */
// item: {area,unit,q,opts:[...],ok:idx,e,art,isDef}
function mkMCQ(m){const o=shuffle(m.o.map((t,i)=>({t,c:i===0})));return {area:m.a,unit:m.u,q:m.q,opts:o.map(x=>x.t),ok:o.findIndex(x=>x.c),e:m.e}}
function unitTag(it){return `<span class="topic${it.area==='P'?' p':''}">${it.area==='C'?'Civil':'Procesal'} · ${esc(it.unit)}</span>`}

function runQuiz(items,cfg){
  // cfg: {title, exam(bool), minutes, onEnd(results)}
  let i=0; const ans=new Array(items.length).fill(null); let t0=Date.now();
  inExam=!!cfg.exam;
  if(cfg.exam){
    const end=Date.now()+cfg.minutes*60000;
    timer=setInterval(()=>{const left=Math.max(0,end-Date.now());const el=$('#tm');if(el){el.textContent=fmt(left);el.classList.toggle('calm',left>5*60000)}if(left<=0){stopTimer();finish(true)}},500);
  }
  function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function show(){
    const it=items[i]; const a=ans[i]; const answered=a!==null && !cfg.exam;
    setTitle(cfg.title);
    app.innerHTML=`<div class="page"><div class="wrap"><div class="card">
      <div class="qhead"><span class="pill">${i+1} / ${items.length}</span>${cfg.exam?`<span class="tm" id="tm">${fmt(cfg.minutes*60000-(Date.now()-t0))}</span>`:`<span class="tm calm">${ST_ok()} correctas</span>`}</div>
      <div class="prog"><i style="width:${(i/items.length)*100}%"></i></div>
      ${unitTag(it)}
      <p class="q${it.isDef?' def':''}">${esc(it.q)}</p>
      ${it.opts.map((o,k)=>{let c='';if(answered){if(k===it.ok)c='ok';else if(k===a)c='bad'}else if(a===k)c='sel';return `<button class="opt ${c}" data-k="${k}" ${answered?'disabled':''}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`}).join('')}
      ${answered?`<div class="fb ${a===it.ok?'ok':'bad'}"><b>${a===it.ok?'Correcto':'Incorrecto. La respuesta correcta es la '+L[it.ok]}</b>${esc(it.e)}${it.art?`<span class="art">${esc(it.art)}</span>`:''}</div>`:''}
    </div></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(!cfg.exam && ans[i]!==null) return;
      ans[i]=+b.dataset.k;
      if(!cfg.exam){rec(it.unit,ans[i]===it.ok)}
      show();
    });
    const last=i===items.length-1;
    if(cfg.exam){
      dock(`${i>0?'<button class="btn sec" id="prev">Anterior</button>':''}<button class="btn" id="next">${last?'Terminar examen':'Siguiente'}</button>`);
      if($('#prev'))$('#prev').onclick=()=>{i--;show();window.scrollTo(0,0)};
      $('#next').onclick=()=>{if(last){confirmEnd()}else{i++;show();window.scrollTo(0,0)}};
    }else{
      dock(answered?`<button class="btn sec" id="quit">Terminar</button><button class="btn" id="next">${last?'Ver resultado':'Siguiente'}</button>`:`<button class="btn sec" id="quit">Terminar</button><button class="btn" disabled>Elige una alternativa</button>`);
      $('#quit').onclick=()=>finish(false);
      if($('#next'))$('#next').onclick=()=>{if(last)finish(false);else{i++;show();window.scrollTo(0,0)}};
    }
  }
  function ST_ok(){return ans.reduce((n,a,k)=>n+(a!==null&&a===items[k].ok?1:0),0)}
  function confirmEnd(){
    const blank=ans.filter(a=>a===null).length;
    $('#overlay').innerHTML=`<div class="dim"><div class="modal"><h3>Terminar el examen</h3><p class="muted">${blank?`Tienes ${blank} pregunta${blank>1?'s':''} sin responder.`:'Respondiste todas las preguntas.'} ¿Quieres entregar?</p><div class="row"><button class="btn light" id="mNo">Revisar</button><button class="btn navy" id="mYes">Entregar</button></div></div></div>`;
    $('#mNo').onclick=()=>$('#overlay').innerHTML='';
    $('#mYes').onclick=()=>{$('#overlay').innerHTML='';finish(false)};
  }
  function finish(timeout){
    stopTimer(); inExam=false; dock(null);
    if(cfg.exam){items.forEach((it,k)=>{if(ans[k]!==null)rec(it.unit,ans[k]===it.ok)})}
    cfg.onEnd({items,ans,timeout,secs:Math.round((Date.now()-t0)/1000)});
  }
  show();
}

function resultView(r,title,again){
  const {items,ans}=r; const n=items.length;
  const done=ans.filter(a=>a!==null).length;
  const ok=items.reduce((s,it,k)=>s+(ans[k]===it.ok?1:0),0);
  const pct=n?Math.round(ok*100/n):0;
  const nota=grade(ok,n);
  const by={};items.forEach((it,k)=>{const b=by[it.unit]||(by[it.unit]={n:0,ok:0,a:it.area});b.n++;if(ans[k]===it.ok)b.ok++});
  const rows=Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([u,b])=>`<tr><td>${esc(u)}<div class="bar"><i style="width:${b.ok*100/b.n}%"></i></div></td><td class="num">${b.ok} / ${b.n}</td></tr>`).join('');
  const wrong=items.map((it,k)=>({it,a:ans[k],k})).filter(x=>x.a!==x.it.ok);
  setTitle(title);
  app.innerHTML=`<div class="page"><div class="wrap">
   <div class="card" style="text-align:center">${r.timeout?'<p class="muted small">Se acabó el tiempo.</p>':''}<div class="score">${ok}/${n}</div><p class="muted">${pct}% de respuestas correctas${done<n?` · ${n-done} sin responder`:''}</p>
   <span class="grade ${nota>=4?'ok':'bad'}">Nota ${nota.toFixed(1).replace('.',',')} (exigencia 60%)</span>
   <div class="grid2"><div class="stat"><b>${ok}</b><span>correctas</span></div><div class="stat"><b>${done-ok}</b><span>incorrectas</span></div>${r.secs?`<div class="stat"><b>${Math.floor(r.secs/60)}:${String(r.secs%60).padStart(2,'0')}</b><span>tiempo usado</span></div><div class="stat"><b>${n-done}</b><span>sin responder</span></div>`:''}</div></div>
   <div class="card"><h2>Resultado por unidad</h2><p class="small muted">Ordenado de la más débil a la más fuerte.</p><table>${rows}</table></div>
   ${wrong.length?`<div class="card"><h2>Revisa tus errores</h2>${wrong.map(x=>`<div class="rev">${unitTag(x.it)}<p class="q${x.it.isDef?' def':''}">${esc(x.it.q)}</p>${x.a!==null?`<p class="ans bad">Tu respuesta: ${esc(x.it.opts[x.a])}</p>`:'<p class="ans bad">Sin responder</p>'}<p class="ans ok">Correcta: ${esc(x.it.opts[x.it.ok])}</p><p class="ex">${esc(x.it.e)}</p></div>`).join('')}</div>`:'<div class="card"><h2>Sin errores</h2><p class="muted">Respondiste todo correctamente.</p></div>'}
  </div></div>`;
  dock(`<button class="btn sec" id="hm">Inicio</button><button class="btn" id="ag">Otro intento</button>`);
  $('#hm').onclick=()=>go(home); $('#ag').onclick=()=>go(again);
  return {ok,n,pct,nota};
}
function grade(ok,n){if(!n)return 1;const p=ok/n;return p>=.6?4+3*(p-.6)/.4:1+3*p/.6}

/* ---------- 3. definiciones ---------- */
let DS={area:'',dir:'c2d'};
function defsPool(){return DATA.defs.filter(d=>!DS.area||d.a===DS.area)}
function defsSetup(){
  setTitle('Definiciones legales');
  app.innerHTML=`<div class="page"><div class="wrap"><div class="card"><h2>Definiciones legales</h2><p class="muted small">10 preguntas. Después de cada una verás la definición textual y su artículo.</p>
   <div class="lbl">Código</div><div class="chips" id="ar">${[['','Todas'],['C','Código Civil'],['P','COT y CPC']].map(([a,t])=>`<button class="chip ${DS.area===a?'on':''}" data-a="${a}">${t}</button>`).join('')}</div>
   <div class="lbl">Modalidad</div><div class="chips" id="dr"><button class="chip ${DS.dir==='c2d'?'on':''}" data-d="c2d">Concepto → definición</button><button class="chip ${DS.dir==='d2c'?'on':''}" data-d="d2c">Definición → concepto</button></div>
   <p class="small muted" style="margin-top:14px">Definiciones disponibles: <b>${defsPool().length}</b></p></div>
   <div class="card"><h2>Lista para estudiar</h2><p class="small muted">Toca una para ver su texto.</p><div id="lst">${defsPool().map((d,k)=>`<div class="rev" style="cursor:pointer" data-k="${k}"><b style="color:var(--navy)">${esc(d.c)}</b> <span class="small muted">${esc(d.r)}</span><p class="ex hidden">${esc(d.d)}</p></div>`).join('')}</div></div></div></div>`;
  document.querySelectorAll('#ar .chip').forEach(b=>b.onclick=()=>{DS.area=b.dataset.a;defsSetup()});
  document.querySelectorAll('#dr .chip').forEach(b=>b.onclick=()=>{DS.dir=b.dataset.d;defsSetup()});
  document.querySelectorAll('#lst .rev').forEach(r=>r.onclick=()=>r.querySelector('.ex').classList.toggle('hidden'));
  dock(`<button class="btn" id="go">Comenzar</button>`);
  $('#go').onclick=()=>{dock(null);startDefs()};
}
function startDefs(){
  const pool=defsPool(); const pick=shuffle(pool).slice(0,10);
  const items=pick.map(d=>{
    const others=shuffle(DATA.defs.filter(x=>x!==d&&x.c!==d.c&&(x.a===d.a))).slice(0,3);
    const set=shuffle([d].concat(others));
    if(DS.dir==='c2d') return {area:d.a,unit:d.u,q:'¿Cuál es la definición legal de: '+d.c+'?',opts:set.map(x=>x.m),ok:set.indexOf(d),e:d.d,art:d.r};
    return {area:d.a,unit:d.u,isDef:true,q:d.m,opts:set.map(x=>x.c),ok:set.indexOf(d),e:d.d,art:d.r};
  });
  runQuiz(items,{title:'Definiciones',onEnd:r=>resultView(r,'Resultado',defsSetup)});
}

/* ---------- 4. unir conceptos ---------- */
let MS={area:'',round:0,errs:0,total:0};
function matchStart(){MS={area:MS.area,round:0,errs:0,total:0};matchRound()}
function matchRound(){
  setTitle('Unir conceptos');
  const pool=DATA.defs.filter(d=>!MS.area||d.a===MS.area);
  // 5 conceptos con nombres distintos
  const pick=[];for(const d of shuffle(pool)){if(!pick.some(p=>p.c===d.c||p.r===d.r&&p.m===d.m))pick.push(d);if(pick.length===5)break}
  const left=shuffle(pick), right=shuffle(pick);
  let sel=null, done=0, errs=0;
  MS.round++;
  app.innerHTML=`<div class="page"><div class="wrap"><div class="card">
   <div class="qhead"><span class="pill">Ronda ${MS.round}</span><span class="tm calm" id="mst">0 / 5 unidos</span></div>
   <div class="chips" id="ar" style="margin-bottom:12px">${[['','Todo'],['C','Civil'],['P','Procesal']].map(([a,t])=>`<button class="chip ${MS.area===a?'on':''}" data-a="${a}">${t}</button>`).join('')}</div>
   <p class="hint">Toca un concepto y luego su definición (o al revés).</p>
   <div class="mcols"><div>${left.map((d,k)=>`<button class="mi c" data-s="L" data-k="${pick.indexOf(d)}">${esc(d.c)}</button>`).join('')}</div>
   <div>${right.map(d=>`<button class="mi" data-s="R" data-k="${pick.indexOf(d)}">${esc(d.m)}</button>`).join('')}</div></div>
   <div id="mfb"></div></div></div></div>`;
  document.querySelectorAll('#ar .chip').forEach(b=>b.onclick=()=>{MS.area=b.dataset.a;matchStart()});
  dock(`<button class="btn sec" id="hm">Inicio</button><button class="btn" id="nx">Nueva ronda</button>`);
  $('#hm').onclick=()=>go(home); $('#nx').onclick=()=>{dock(null);window.scrollTo(0,0);matchRound()};
  document.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(!sel||sel.dataset.s===b.dataset.s){document.querySelectorAll('.mi.sel').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');return}
    const a=sel,c=b; sel=null; a.classList.remove('sel');
    if(a.dataset.k===c.dataset.k){
      done++; const d=pick[+a.dataset.k];
      [a,c].forEach(x=>{x.classList.add('done')});
      c.innerHTML=`<span class="tag">${esc(d.r)}</span>${esc(d.d)}`;
      rec(d.u,true);
      $('#mst').textContent=done+' / 5 unidos';
      if(done===5){MS.total+=5;MS.errs+=errs;$('#mfb').innerHTML=`<div class="fb ${errs?'bad':'ok'}"><b>Ronda completada</b>${errs?`Tuviste ${errs} intento${errs>1?'s':''} fallido${errs>1?'s':''} en esta ronda.`:'Sin errores.'} Llevas ${MS.total} conceptos unidos con ${MS.errs} errores en total.</div>`}
    }else{
      errs++; [a,c].forEach(x=>{x.classList.add('err');setTimeout(()=>x.classList.remove('err'),450)});
      rec(pick[+(a.dataset.s==='L'?a:c).dataset.k].u,false);
    }
  });
}

/* ---------- 6. progreso ---------- */
function progress(){
  setTitle('Mi progreso');
  const row=u=>{const s=ST.u[u];if(!s)return `<tr><td>${esc(u)}</td><td class="num muted">sin datos</td></tr>`;const p=Math.round(s.ok*100/s.n);return `<tr><td>${esc(u)}<div class="bar"><i style="width:${p}%"></i></div></td><td class="num">${p}% <span class="muted small">(${s.ok}/${s.n})</span></td></tr>`};
  const weak=Object.entries(ST.u).filter(([u,s])=>s.n>=5).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).slice(0,3);
  app.innerHTML=`<div class="page"><div class="wrap">
   ${weak.length?`<div class="card"><h2>Para reforzar</h2><p class="muted small">Tus unidades con menor porcentaje de aciertos (mínimo 5 respuestas).</p>${weak.map(([u,s])=>`<p><b>${esc(u)}</b> · ${Math.round(s.ok*100/s.n)}%</p>`).join('')}</div>`:''}
   <div class="card"><h2>Civil</h2><table>${CIVIL_U.map(row).join('')}</table></div>
   <div class="card"><h2>Procesal</h2><table>${PROC_U.map(row).join('')}</table></div>
   <p class="notice">El progreso se guarda solo en este dispositivo.</p>
  </div></div>`;
  dock(`<button class="btn sec" id="rs">Borrar progreso</button><button class="btn" id="hm">Inicio</button>`);
  $('#hm').onclick=()=>go(home);
  $('#rs').onclick=()=>{$('#overlay').innerHTML=`<div class="dim"><div class="modal"><h3>Borrar progreso</h3><p class="muted">Se eliminarán tus estadísticas guardadas en este dispositivo.</p><div class="row"><button class="btn light" id="mNo">Cancelar</button><button class="btn navy" id="mYes">Borrar</button></div></div></div>`;$('#mNo').onclick=()=>$('#overlay').innerHTML='';$('#mYes').onclick=()=>{$('#overlay').innerHTML='';ST={u:{},sims:[]};save(ST);progress()}};
}

home();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
