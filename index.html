":"Art. 69 CPC. «Con conocimiento» permite llevarla a efecto sin esperar; «previa audiencia» exige tramitarla como incidente."},{"a":"P","u":"Normas Comunes","q":"¿Qué es el cumplimiento incidental de la sentencia?","o":["La ejecución ante el mismo tribunal que dictó la sentencia, dentro de un año.","La ejecución de una sentencia extranjera ante la Corte Suprema, previo exequátur.","La ejecución de una sentencia mediante un nuevo juicio ordinario de lato conocimiento.","La ejecución de las resoluciones dictadas en un incidente del juicio principal."],"e":"Art. 233 CPC: se ordena el cumplimiento con citación de la persona contra quien se pide."},{"a":"P","u":"Normas Comunes","q":"En el cumplimiento incidental, ¿qué excepciones puede oponer la parte vencida?","o":["Las taxativas del art. 234, como pago o novación.","Cualquier excepción, sea dilatoria o perentoria.","Solo la excepción de prescripción de la acción.","Solo la nulidad de la sentencia que se ejecuta."],"e":"Art. 234 CPC: las excepciones, salvo la de pago en ciertos casos, deben fundarse en antecedentes escritos y en hechos acaecidos con posterioridad a la sentencia."},{"a":"P","u":"Normas Comunes","q":"¿Cuáles son las fuentes del derecho procesal?","o":["La Constitución, las leyes procesales y los tratados; e indirectamente, autos acordados, jurisprudencia y doctrina.","Solo el Código de Procedimiento Civil y el Código Orgánico de Tribunales, con exclusión de toda otra norma.","La costumbre judicial, la equidad natural y la voluntad de las partes expresada en el contrato.","Los reglamentos dictados por el Presidente de la República y las circulares de la Corte Suprema."],"e":"Clasificación doctrinaria."},{"a":"P","u":"Normas Comunes","q":"¿Qué es el debido proceso?","o":["Las garantías que aseguran un procedimiento racional y justo ante un tribunal imparcial.","El procedimiento ordinario que se aplica supletoriamente a todos los juicios civiles.","La obligación del juez de dictar sentencia dentro del plazo que fija la ley.","El derecho del demandante a elegir libremente el procedimiento aplicable."],"e":"Art. 19 N° 3 inc. 6 CPR: toda sentencia debe fundarse en un proceso previo legalmente tramitado."},{"a":"P","u":"Normas Comunes","q":"¿Qué son los equivalentes jurisdiccionales?","o":["Actos que sin ser sentencias producen cosa juzgada, como la transacción y la conciliación.","Tribunales que ejercen jurisdicción sin pertenecer al Poder Judicial, como el Tribunal Constitucional.","Resoluciones administrativas que tienen la misma fuerza obligatoria que una sentencia judicial.","Procedimientos especiales que reemplazan al juicio ordinario en asuntos de menor cuantía."],"e":"También la sentencia extranjera con exequátur y el sobreseimiento definitivo."},{"a":"P","u":"Normas Comunes","q":"¿Qué es el imperio?","o":["La facultad de los tribunales de impartir órdenes a la fuerza pública para cumplir sus resoluciones.","La facultad de los tribunales de conocer de las causas civiles y criminales que la ley les asigna.","La facultad de la Corte Suprema de dictar autos acordados de carácter general y obligatorio.","La facultad del juez de condenar en costas a la parte que ha sido totalmente vencida."],"e":"Art. 76 inc. 3 CPR y art. 11 COT."},{"a":"P","u":"Normas Comunes","q":"¿Qué diferencia hay entre jurisdicción y competencia?","o":["La jurisdicción es el poder de resolver conflictos; la competencia, la medida de ese poder para cada tribunal.","La competencia es el género y la jurisdicción la especie, porque todo tribunal competente la tiene.","La jurisdicción la tienen solo los tribunales superiores; la competencia, solo los inferiores.","No hay diferencia alguna: ambos conceptos se usan como sinónimos en el COT."],"e":"Arts. 1 y 108 COT."},{"a":"P","u":"Normas Comunes","q":"¿Qué es el plazo fatal?","o":["Aquel cuyo vencimiento extingue, por el solo ministerio de la ley, la facultad que pudo ejercerse.","Aquel cuyo vencimiento requiere que la contraparte acuse rebeldía para que se extinga el derecho.","Aquel que solo puede ampliarse por acuerdo de ambas partes presentado antes de su vencimiento.","Aquel que se cuenta de día en día, incluyendo los domingos y los días feriados legales."],"e":"Art. 64 CPC: los plazos del CPC son fatales, salvo los establecidos para actuaciones propias del tribunal."},{"a":"P","u":"Normas Comunes","q":"¿Qué efecto produce la notificación válida de la demanda?","o":["Constituye la relación procesal y coloca al deudor en mora.","Pone término al juicio si el demandado no contesta en plazo.","Extingue la acción si no hay sentencia en el plazo de un año.","Produce cosa juzgada respecto de los hechos de la demanda."],"e":"Además interrumpe civilmente la prescripción (art. 2503 CC) y hace litigiosos los derechos."},{"a":"P","u":"Normas Comunes","q":"¿Cuáles son los sistemas de valoración de la prueba?","o":["Prueba legal o tasada, sana crítica y libre convicción.","Prueba directa, prueba indirecta y prueba circunstancial.","Prueba documental, prueba testimonial y prueba pericial.","Prueba plena, prueba semiplena y prueba meramente indiciaria."],"e":"En el juicio civil rige por regla general la prueba legal; en materia penal, laboral y de familia, la sana crítica."},{"a":"P","u":"Normas Comunes","q":"¿Cuáles son los elementos de la sana crítica?","o":["La lógica, las máximas de la experiencia y los conocimientos científicamente afianzados.","La convicción íntima del juez, la equidad natural y la costumbre del lugar del juicio.","Las presunciones legales, la confesión judicial y los instrumentos públicos acompañados.","La credibilidad de los testigos, la buena fe de las partes y el valor económico de lo disputado."],"e":"Art. 297 CPP y normas análogas en otras leyes."},{"a":"P","u":"Normas Comunes","q":"¿Cuáles son causales de impugnación de un instrumento público?","o":["La nulidad, la falta de autenticidad y la falsedad de las declaraciones.","La falta de firma de testigos, su antigüedad y el idioma en que está extendido.","La falta de protocolización, de timbre fiscal y de reconocimiento judicial.","La prescripción, la caducidad y la inoponibilidad respecto de los terceros."],"e":"Clasificación doctrinaria fundada en los arts. 1699 y siguientes CC y 342 y siguientes CPC."},{"a":"P","u":"Normas Comunes","q":"¿Cómo se clasifican los procedimientos según el art. 2 CPC?","o":["Ordinarios y extraordinarios.","Escritos y orales.","Civiles y penales.","Contenciosos y no contenciosos."],"e":"Art. 2 CPC: ordinario es el que se somete a la tramitación común; extraordinario, el que se rige por disposiciones especiales."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué es el embargo?","o":["La aprehensión judicial de bienes del deudor para pagar con ellos al acreedor.","La retención de bienes del deudor como medida precautoria en un juicio ordinario.","La entrega voluntaria de bienes del deudor al acreedor en pago de la deuda.","La inscripción de una hipoteca a favor del acreedor en el Conservador."],"e":"Se practica por un ministro de fe y debe inscribirse si recae sobre inmuebles para afectar a terceros (art. 453 CPC)."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuándo puede renovarse la acción ejecutiva rechazada?","o":["Si fue rechazada por incompetencia, incapacidad, ineptitud del libelo o falta de oportunidad.","Si fue rechazada por haberse acogido la excepción de pago, de novación o de compensación.","Si fue rechazada por haberse acogido la excepción de prescripción de la acción ejecutiva.","Nunca, porque la sentencia del juicio ejecutivo produce siempre cosa juzgada material."],"e":"Art. 477 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cómo se clasifica la sentencia condenatoria en el juicio ejecutivo?","o":["De pago o de remate.","Declarativa o constitutiva.","Definitiva o interlocutoria.","De primera o de segunda instancia."],"e":"Arts. 472 y siguientes CPC."},{"a":"C","u":"Teoría de la Ley","q":"¿Cuáles son las etapas de formación de la ley?","o":["Iniciativa, discusión, aprobación, sanción, promulgación y publicación.","Iniciativa, votación en sala, sanción presidencial y entrada en vigencia.","Discusión, control constitucional, publicación y derogación de la anterior.","Proposición, aprobación, inscripción en un registro y obligatoriedad."],"e":"Arts. 65 y siguientes CPR."},{"a":"C","u":"Persona","q":"¿Cómo termina la existencia de la persona natural?","o":["Por la muerte natural.","Por la declaración de interdicción.","Por la pérdida de la nacionalidad.","Por la muerte civil."],"e":"Art. 78 CC. La muerte civil fue derogada; la muerte presunta es una declaración judicial que produce efectos similares."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es la nulidad?","o":["La sanción por omitir los requisitos que la ley prescribe para el valor de un acto.","La sanción que deja sin efecto un contrato válido por incumplimiento de una parte.","La ineficacia de un acto válido respecto de los terceros que no intervinieron en él.","La extinción de los efectos de un acto por la llegada de un plazo extintivo."],"e":"Art. 1681 CC. Puede ser absoluta o relativa."},{"a":"C","u":"Acto Jurídico","q":"¿Quiénes pueden alegar la nulidad relativa?","o":["Aquellos en cuyo beneficio la establecieron las leyes, sus herederos o cesionarios.","Todo el que tenga interés en ello, y además el ministerio público judicial.","Solo el juez, de oficio, cuando el vicio aparece de manifiesto en el acto.","Cualquier tercero que resulte perjudicado por los efectos del acto."],"e":"Art. 1684 CC. No puede declararse de oficio ni pedirse por el ministerio público en el solo interés de la ley."},{"a":"C","u":"Acto Jurídico","q":"¿Cuáles son los actos necesarios para que se forme el consentimiento?","o":["La oferta y la aceptación.","La oferta y la tradición.","La promesa y el contrato definitivo.","La propuesta y la firma ante notario."],"e":"Arts. 97 a 108 CCom."},{"a":"C","u":"Bienes","q":"¿Qué ocurre si el tradente no es el verdadero dueño de la cosa?","o":["Es válida, pero solo transfiere los derechos transmisibles del tradente.","Es nula absolutamente, por falta de objeto y de causa en la tradición.","Transfiere igualmente el dominio si el adquirente está de buena fe.","Es inexistente, y el adquirente queda como mero tenedor de la cosa."],"e":"Art. 682 CC. El adquirente puede llegar a adquirir el dominio por prescripción (art. 683 CC)."},{"a":"C","u":"Bienes","q":"¿Cómo se adquiere la posesión de un inmueble inscrito?","o":["Solo por la inscripción en el Registro del Conservador.","Por la entrega material del inmueble.","Por el apoderamiento material con ánimo de dueño.","Por la sola celebración del contrato de compraventa."],"e":"Art. 724 CC."},{"a":"C","u":"Bienes","q":"¿Cómo cesa la posesión inscrita?","o":["Por la cancelación de la inscripción: por voluntad de las partes, nueva inscripción o decreto judicial.","Por el apoderamiento material del inmueble por un tercero durante un año completo y sin violencia.","Por el no uso del inmueble por su poseedor inscrito durante cinco años, sin interrupción.","Por el abandono material del inmueble por su poseedor, aunque la inscripción siga vigente."],"e":"Art. 728 CC. Mientras subsista la inscripción, quien se apodera de la cosa no adquiere su posesión ni pone fin a la existente."},{"a":"C","u":"Obligaciones","q":"¿Qué es el caso fortuito o fuerza mayor?","o":["El imprevisto a que no es posible resistir.","El hecho del deudor que impide el cumplimiento.","El retardo culpable del deudor.","El incumplimiento parcial de la obligación."],"e":"Art. 45 CC. Debe ser imprevisible, irresistible y exterior a la voluntad del deudor."},{"a":"C","u":"Obligaciones","q":"¿Cuál es uno de los casos de indivisibilidad de pago del art. 1526 CC?","o":["La acción hipotecaria o prendaria se dirige contra quien posee la cosa gravada.","La deuda de dinero entre varios codeudores se divide siempre por partes iguales.","La deuda solidaria se divide entre los herederos del deudor fallecido.","La deuda de una cosa fungible se divide entre todos los acreedores."],"e":"Art. 1526 N° 1 CC. La norma enumera otros casos, como la deuda de una especie o cuerpo cierto."},{"a":"C","u":"Obligaciones","q":"¿Cuáles son los requisitos generales del pago?","o":["Que lo haga quien puede pagar, a quien puede recibir, en tiempo y lugar debidos, e íntegramente.","Que lo haga el deudor personalmente, ante notario, en efectivo y en el domicilio del acreedor.","Que conste por escrito, se haga en dinero y se inscriba en el registro del Conservador.","Que el acreedor lo acepte por escrito y se haga dentro de los treinta días siguientes al vencimiento."],"e":"Arts. 1569 y siguientes CC. El acreedor no puede ser obligado a recibir otra cosa ni por partes (arts. 1569 y 1591 CC)."},{"a":"C","u":"Obligaciones","q":"¿Qué es una operación de crédito de dinero según la Ley 18.010?","o":["La que obliga a una parte a entregar dinero y a la otra a pagarlo en un momento distinto.","La que obliga a un banco a abrir una cuenta corriente a favor de un cliente determinado.","La que obliga a una persona a garantizar con dinero una deuda ajena ya vencida.","La que obliga a las partes a comprar y vender divisas extranjeras a un plazo determinado."],"e":"Art. 1 Ley 18.010. La Ley 20.715 modificó las reglas del interés máximo convencional y del prepago."},{"a":"C","u":"Contratos Parte General","q":"¿Cuál es una crítica a la definición legal de contrato del art. 1438 CC?","o":["Que confunde contrato con convención.","Que exige escritura pública para su validez.","Que limita el contrato a las obligaciones de dar.","Que no admite contratos con más de dos partes."],"e":"La doctrina también critica que define el contrato por su objeto (la obligación) y no por la prestación."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cómo se perfecciona el contrato de arrendamiento de cosas?","o":["Por el solo consentimiento, por ser consensual.","Por la entrega de la cosa, por ser contrato real.","Por escritura pública inscrita en el Conservador.","Por el pago de la primera renta de arrendamiento."],"e":"Art. 1915 CC. Existen excepciones, como el arrendamiento de predios rústicos (DL 993)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué relación existe entre mandato y representación?","o":["La representación no es de la esencia del mandato: el mandatario puede actuar a su propio nombre.","El mandato siempre implica representación, porque el mandatario actúa siempre a nombre del mandante.","La representación solo existe en el mandato judicial, y nunca en el mandato civil o comercial.","El mandato es nulo si el mandatario no actúa en representación expresa del mandante."],"e":"Art. 2151 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el beneficio de excusión?","o":["El derecho del fiador a que primero se persigan los bienes del deudor principal.","El derecho del cofiador a exigir que la deuda se divida entre todos los fiadores.","El derecho del heredero a responder solo hasta el valor de lo que ha heredado.","El derecho del deudor a no ser privado de lo indispensable para su subsistencia."],"e":"Art. 2357 CC."},{"a":"C","u":"Familia","q":"¿Cuáles son los requisitos de existencia del matrimonio, según la doctrina?","o":["Consentimiento y presencia de un oficial del Registro Civil.","Consentimiento, capacidad y cumplimiento de formalidades.","Diferencia de sexo, consentimiento y dos testigos hábiles.","Escritura pública, testigos y presencia de un notario."],"e":"Los requisitos de validez son la capacidad, el consentimiento libre y espontáneo y el cumplimiento de las solemnidades legales (art. 4 LMC)."},{"a":"C","u":"Familia","q":"¿Cuáles son causales de nulidad del matrimonio?","o":["Impedimento dirimente, falta de consentimiento libre o falta de testigos hábiles.","Ausencia de capitulaciones matrimoniales o de un acuerdo sobre los bienes.","Celebración fuera de la comuna del domicilio de alguno de los contrayentes.","Diferencia de nacionalidad o de religión entre los contrayentes."],"e":"Art. 44 LMC."},{"a":"C","u":"Familia","q":"¿Qué clases de divorcio existen en Chile?","o":["Por culpa y por cese de convivencia.","Vincular y no vincular, a elección.","Judicial y administrativo ante el Registro Civil.","Temporal y definitivo, según el caso."],"e":"Arts. 54 y 55 LMC."},{"a":"C","u":"Familia","q":"¿Qué efectos produce la separación judicial?","o":["Suspende la vida en común y disuelve la sociedad conyugal, pero subsiste el vínculo.","Pone término al matrimonio y permite a los cónyuges volver a casarse con otra persona.","Extingue la obligación de alimentos y el derecho a heredar entre los cónyuges en todo caso.","Produce la nulidad del matrimonio con efecto retroactivo desde la fecha de su celebración."],"e":"Arts. 32 a 37 LMC. El cónyuge que dio lugar a la separación por su culpa pierde ciertos derechos hereditarios (art. 994 CC)."},{"a":"C","u":"Familia","q":"¿Cuáles son las acciones de filiación?","o":["Las de reclamación, de impugnación y de desconocimiento de la filiación.","Las de alimentos, de cuidado personal y de relación directa y regular.","Las de nulidad, de divorcio y de separación judicial.","Las de reconocimiento, de adopción y de emancipación."],"e":"Arts. 195 y siguientes CC."},{"a":"C","u":"Familia","q":"¿Qué efecto produce la declaración de un bien como familiar?","o":["El cónyuge dueño no puede enajenarlo ni gravarlo sin autorización del otro.","El bien pasa a ser de propiedad común de ambos cónyuges, por mitades.","El bien queda fuera del comercio humano y no puede ser embargado nunca.","El bien pasa a ser administrado por el juez de familia que lo declaró."],"e":"Art. 142 CC. También se otorga al cónyuge no propietario el beneficio de excusión (art. 148 CC)."},{"a":"C","u":"Sucesorio","q":"¿Cuáles son los requisitos generales para suceder?","o":["Ser capaz, digno y tener vocación sucesoria.","Ser mayor de edad y pariente del causante.","Haber vivido con el causante sus últimos años.","Estar nombrado en un testamento solemne."],"e":"Arts. 961 y 962 CC: la regla general es la capacidad y la dignidad."},{"a":"C","u":"Sucesorio","q":"¿Qué diferencia hay entre incapacidad e indignidad para suceder?","o":["La incapacidad opera de pleno derecho; la indignidad debe declararse judicialmente.","La indignidad opera de pleno derecho; la incapacidad debe declararse judicialmente.","Ambas operan de pleno derecho y se purgan en diez años de posesión de la herencia.","Ambas deben declararse judicialmente y se purgan en cinco años de posesión."],"e":"Arts. 961 a 979 CC."},{"a":"C","u":"Sucesorio","q":"¿Quiénes no son hábiles para testar?","o":["El impúber, el interdicto por demencia, quien no está en su sano juicio y quien no puede expresar su voluntad.","El menor de dieciocho años, el disipador interdicto, el analfabeto y quien no sabe firmar su nombre.","El extranjero sin domicilio en Chile, el condenado por crimen, el menor de veintiún años y el fallido.","Quien tiene deudas impagas, el ciego, el sordo que sabe escribir y el que vive en el extranjero."],"e":"Art. 1005 CC."},{"a":"C","u":"Sucesorio","q":"¿Qué requisitos exige el desheredamiento para ser válido?","o":["Hacerse por testamento, expresar la causa y probarse judicialmente.","Hacerse por escritura pública ante notario y con dos testigos hábiles.","Declararse por el juez a petición de los demás herederos del causante.","Bastar que el testador lo manifieste en cualquier documento firmado."],"e":"Arts. 1207 a 1209 CC."},{"a":"C","u":"Sucesorio","q":"¿Cómo se clasifican los herederos?","o":["Universales o de cuota, testamentarios o abintestato, y forzosos o voluntarios.","Directos o indirectos, principales o accesorios, y presentes o futuros.","Legítimos o naturales, mayores o menores, y nacionales o extranjeros.","Ordinarios o extraordinarios, solemnes o privilegiados, y simples o calificados."],"e":"Arts. 1097 y siguientes CC."},{"a":"P","u":"Procesal Penal","q":"¿Quiénes son intervinientes en el proceso penal?","o":["El fiscal, el imputado, el defensor, la víctima y el querellante.","El juez, el fiscal, el imputado y la policía.","El fiscal, el defensor, los testigos y los peritos.","El imputado, la víctima, el juez de garantía y el tribunal oral."],"e":"Art. 12 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Desde qué momento se adquiere la calidad de imputado?","o":["Desde la primera actuación del procedimiento en su contra.","Desde la formalización de la investigación en su contra.","Desde que el fiscal presenta la acusación en su contra.","Desde que se dicta el auto de apertura del juicio oral."],"e":"Art. 7 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Quién es víctima según el CPP?","o":["El ofendido por el delito y, en ciertos casos, las personas que señala la ley.","Cualquier persona que haya presenciado el delito y declare como testigo.","Solo la persona que ha presentado querella ante el juez de garantía.","El Estado, representado por el Consejo de Defensa del Estado en todo caso."],"e":"Art. 108 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué efectos produce la formalización de la investigación?","o":["Suspende la prescripción, inicia el plazo de dos años y el fiscal pierde la facultad de archivar provisionalmente.","Interrumpe la prescripción, obliga al fiscal a acusar dentro de diez días y permite dictar sentencia de inmediato.","Pone término a la investigación desformalizada y da inicio a la etapa intermedia del procedimiento ordinario.","Obliga al imputado a prestar declaración y suspende el ejercicio de sus derechos procesales mientras dure."],"e":"Art. 233 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué es la acusación?","o":["El acto por el que el fiscal, cerrada la investigación, formula su pretensión punitiva contra el imputado.","El acto por el que el fiscal comunica al imputado que desarrolla una investigación en su contra.","El acto por el que la víctima pone en conocimiento de la policía la comisión de un delito.","El acto por el que el tribunal oral declara la culpabilidad del imputado al término del juicio."],"e":"Arts. 248 b) y 259 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué es la detención?","o":["Una medida cautelar que priva brevemente de libertad para poner a la persona ante el tribunal.","La pena privativa de libertad que se cumple en un recinto penitenciario tras la condena.","La medida cautelar que impide al imputado salir del país mientras dure el proceso.","La medida cautelar que prohíbe al imputado acercarse a la víctima o a su familia."],"e":"Arts. 125 y siguientes CPP."}],"defs":[{"c":"Ley","a":"C","u":"Teoría de la Ley","r":"Art. 1 CC","d":"La ley es una declaración de la voluntad soberana que, manifestada en la forma prescrita por la Constitución, manda, prohíbe o permite.","m":"[…] es una declaración de la voluntad soberana que, manifestada en la forma prescrita por la Constitución, manda, prohíbe o permite."},{"c":"Costumbre","a":"C","u":"Teoría de la Ley","r":"Art. 2 CC","d":"La costumbre no constituye derecho sino en los casos en que la ley se remite a ella.","m":"La […] no constituye derecho sino en los casos en que la ley se remite a ella."},{"c":"Derogación de las leyes","a":"C","u":"Teoría de la Ley","r":"Art. 52 CC","d":"La derogación de las leyes podrá ser expresa o tácita.","m":"[…] podrá ser expresa o tácita."},{"c":"Cómputo de los plazos","a":"C","u":"Teoría de la Ley","r":"Art. 48 CC","d":"Todos los plazos de días, meses o años de que se haga mención en las leyes o en los decretos del Presidente de la República, de los tribunales o juzgados, se entenderá que han de ser completos; y correrán además hasta la medianoche del último día del plazo.","m":"Todos los plazos de días, meses o años de que se haga mención en las leyes o en los decretos del Presidente de la República, de los tribunales o juzgados, se entenderá que han de ser completos; y correrán además hasta la medianoche del último día del plazo."},{"c":"Domicilio","a":"C","u":"Persona","r":"Art. 59 CC","d":"El domicilio consiste en la residencia, acompañada, real o presuntivamente, del ánimo de permanecer en ella.","m":"[…] consiste en la residencia, acompañada, real o presuntivamente, del ánimo de permanecer en ella."},{"c":"Persona natural","a":"C","u":"Persona","r":"Art. 55 CC","d":"Son personas todos los individuos de la especie humana, cualquiera que sea su edad, sexo, estirpe o condición.","m":"Son […] todos los individuos de la especie humana, cualquiera que sea su edad, sexo, estirpe o condición."},{"c":"Persona jurídica","a":"C","u":"Persona","r":"Art. 545 CC","d":"Se llama persona jurídica una persona ficticia, capaz de ejercer derechos y contraer obligaciones civiles, y de ser representada judicial y extrajudicialmente.","m":"Se llama […] una persona ficticia, capaz de ejercer derechos y contraer obligaciones civiles, y de ser representada judicial y extrajudicialmente."},{"c":"Parentesco por consanguinidad","a":"C","u":"Familia","r":"Art. 28 CC","d":"Parentesco por consanguinidad es aquel que existe entre dos personas que descienden una de la otra o de un mismo progenitor, en cualquiera de sus grados.","m":"[…] es aquel que existe entre dos personas que descienden una de la otra o de un mismo progenitor, en cualquiera de sus grados."},{"c":"Parentesco por afinidad","a":"C","u":"Familia","r":"Art. 31 CC","d":"Parentesco por afinidad es el que existe entre una persona que está o ha estado casada y los consanguíneos de su cónyuge.","m":"[…] es el que existe entre una persona que está o ha estado casada y los consanguíneos de su cónyuge."},{"c":"Fuerza mayor o caso fortuito","a":"C","u":"Obligaciones","r":"Art. 45 CC","d":"Se llama fuerza mayor o caso fortuito el imprevisto a que no es posible resistir, como un naufragio, un terremoto, el apresamiento de enemigos, los actos de autoridad ejercidos por un funcionario público, etc.","m":"Se llama […] el imprevisto a que no es posible resistir, como un naufragio, un terremoto, el apresamiento de enemigos, los actos de autoridad ejercidos por un funcionario público, etc."},{"c":"Dolo","a":"C","u":"Acto Jurídico","r":"Art. 44 CC","d":"El dolo consiste en la intención positiva de inferir injuria a la persona o propiedad de otro.","m":"[…] consiste en la intención positiva de inferir injuria a la persona o propiedad de otro."},{"c":"Culpa grave","a":"C","u":"Obligaciones","r":"Art. 44 CC","d":"Culpa grave, negligencia grave, culpa lata, es la que consiste en no manejar los negocios ajenos con aquel cuidado que aun las personas negligentes y de poca prudencia suelen emplear en sus negocios propios.","m":"[…] es la que consiste en no manejar los negocios ajenos con aquel cuidado que aun las personas negligentes y de poca prudencia suelen emplear en sus negocios propios."},{"c":"Culpa leve","a":"C","u":"Obligaciones","r":"Art. 44 CC","d":"Culpa leve, descuido leve, descuido ligero, es la falta de aquella diligencia y cuidado que los hombres emplean ordinariamente en sus negocios propios.","m":"[…] es la falta de aquella diligencia y cuidado que los hombres emplean ordinariamente en sus negocios propios."},{"c":"Culpa levísima","a":"C","u":"Obligaciones","r":"Art. 44 CC","d":"Culpa o descuido levísimo es la falta de aquella esmerada diligencia que un hombre juicioso emplea en la administración de sus negocios importantes.","m":"[…] es la falta de aquella esmerada diligencia que un hombre juicioso emplea en la administración de sus negocios importantes."},{"c":"Caución","a":"C","u":"Obligaciones","r":"Art. 46 CC","d":"Caución significa generalmente cualquiera obligación que se contrae para la seguridad de otra obligación propia o ajena.","m":"[…] significa generalmente cualquiera obligación que se contrae para la seguridad de otra obligación propia o ajena."},{"c":"Presunción","a":"C","u":"Teoría de la Ley","r":"Art. 47 CC","d":"Se dice presumirse el hecho que se deduce de ciertos antecedentes o circunstancias conocidas.","m":"Se dice […] el hecho que se deduce de ciertos antecedentes o circunstancias conocidas."},{"c":"Contrato o convención","a":"C","u":"Contratos Parte General","r":"Art. 1438 CC","d":"Contrato o convención es un acto por el cual una parte se obliga para con otra a dar, hacer o no hacer alguna cosa.","m":"[…] es un acto por el cual una parte se obliga para con otra a dar, hacer o no hacer alguna cosa."},{"c":"Contrato unilateral y bilateral","a":"C","u":"Contratos Parte General","r":"Art. 1439 CC","d":"El contrato es unilateral cuando una de las partes se obliga para con otra que no contrae obligación alguna; y bilateral, cuando las partes contratantes se obligan recíprocamente.","m":"[…] es unilateral cuando una de las partes se obliga para con otra que no contrae obligación alguna; y bilateral, cuando las partes contratantes se obligan recíprocamente."},{"c":"Contrato gratuito y oneroso","a":"C","u":"Contratos Parte General","r":"Art. 1440 CC","d":"El contrato es gratuito o de beneficencia cuando sólo tiene por objeto la utilidad de una de las partes, sufriendo la otra el gravamen; y oneroso, cuando tiene por objeto la utilidad de ambos contratantes, gravándose cada uno a beneficio del otro.","m":"[…] es gratuito o de beneficencia cuando sólo tiene por objeto la utilidad de una de las partes, sufriendo la otra el gravamen; y oneroso, cuando tiene por objeto la utilidad de ambos contratantes, gravándose cada uno a beneficio del otro."},{"c":"Contrato conmutativo","a":"C","u":"Contratos Parte General","r":"Art. 1441 CC","d":"El contrato oneroso es conmutativo, cuando cada una de las partes se obliga a dar o hacer una cosa que se mira como equivalente a lo que la otra parte debe dar o hacer a su vez; y si el equivalente consiste en una contingencia incierta de ganancia o pérdida, se llama aleatorio.","m":"[…] es conmutativo, cuando cada una de las partes se obliga a dar o hacer una cosa que se mira como equivalente a lo que la otra parte debe dar o hacer a su vez; y si el equivalente consiste en una contingencia incierta de ganancia o pérdida, se llama aleatorio."},{"c":"Contrato principal y accesorio","a":"C","u":"Contratos Parte General","r":"Art. 1442 CC","d":"El contrato es principal cuando subsiste por sí mismo sin necesidad de otra convención, y accesorio, cuando tiene por objeto asegurar el cumplimiento de una obligación principal, de manera que no pueda subsistir sin ella.","m":"[…] es principal cuando subsiste por sí mismo sin necesidad de otra convención, y accesorio, cuando tiene por objeto asegurar el cumplimiento de una obligación principal, de manera que no pueda subsistir sin ella."},{"c":"Contrato real, solemne y consensual","a":"C","u":"Contratos Parte General","r":"Art. 1443 CC","d":"El contrato es real cuando, para que sea perfecto, es necesaria la tradición de la cosa a que se refiere; es solemne cuando está sujeto a la observancia de ciertas formalidades especiales, de manera que sin ellas no produce ningún efecto civil; y es consensual cuando se perfecciona por el solo consentimiento.","m":"[…] es real cuando, para que sea perfecto, es necesaria la tradición de la cosa a que se refiere; es solemne cuando está sujeto a la observancia de ciertas formalidades especiales, de manera que sin ellas no produce ningún efecto civil; y es consensual cuando se perfecciona por el solo consentimiento."},{"c":"Causa","a":"C","u":"Acto Jurídico","r":"Art. 1467 CC","d":"Se entiende por causa el motivo que induce al acto o contrato; y por causa ilícita la prohibida por ley, o contraria a las buenas costumbres o al orden público.","m":"Se entiende por […] el motivo que induce al acto o contrato; y por […] la prohibida por ley, o contraria a las buenas costumbres o al orden público."},{"c":"Obligación natural","a":"C","u":"Obligaciones","r":"Art. 1470 CC","d":"Naturales las que no confieren derecho para exigir su cumplimiento, pero que cumplidas, autorizan para retener lo que se ha dado o pagado en razón de ellas.","m":"[…] las que no confieren derecho para exigir su cumplimiento, pero que cumplidas, autorizan para retener lo que se ha dado o pagado en razón de ellas."},{"c":"Obligación civil","a":"C","u":"Obligaciones","r":"Art. 1470 CC","d":"Civiles son aquellas que dan derecho para exigir su cumplimiento.","m":"[…] son aquellas que dan derecho para exigir su cumplimiento."},{"c":"Condición","a":"C","u":"Obligaciones","r":"Art. 1473 CC","d":"Es obligación condicional la que depende de una condición, esto es, de un acontecimiento futuro que puede suceder o no.","m":"Es […] la que depende de una […], esto es, de un acontecimiento futuro que puede suceder o no."},{"c":"Plazo","a":"C","u":"Obligaciones","r":"Art. 1494 CC","d":"El plazo es la época que se fija para el cumplimiento de la obligación, y puede ser expreso o tácito.","m":"[…] es la época que se fija para el cumplimiento de la obligación, y puede ser expreso o tácito."},{"c":"Obligación alternativa","a":"C","u":"Obligaciones","r":"Art. 1499 CC","d":"Obligación alternativa es aquella por la cual se deben varias cosas, de tal manera que la ejecución de una de ellas, exonera de la ejecución de las otras.","m":"[…] es aquella por la cual se deben varias cosas, de tal manera que la ejecución de una de ellas, exonera de la ejecución de las otras."},{"c":"Obligación facultativa","a":"C","u":"Obligaciones","r":"Art. 1505 CC","d":"Obligación facultativa es la que tiene por objeto una cosa determinada, pero concediéndose al deudor la facultad de pagar con esta cosa o con otra que se designa.","m":"[…] es la que tiene por objeto una cosa determinada, pero concediéndose al deudor la facultad de pagar con esta cosa o con otra que se designa."},{"c":"Solidaridad","a":"C","u":"Obligaciones","r":"Art. 1511 CC","d":"En virtud de la convención, del testamento o de la ley puede exigirse a cada uno de los deudores o por cada uno de los acreedores el total de la deuda, y entonces la obligación es solidaria o insólidum.","m":"En virtud de la convención, del testamento o de la ley puede exigirse a cada uno de los deudores o por cada uno de los acreedores el total de la deuda, y entonces la obligación es […]."},{"c":"Cláusula penal","a":"C","u":"Obligaciones","r":"Art. 1535 CC","d":"La cláusula penal es aquella en que una persona, para asegurar el cumplimiento de una obligación, se sujeta a una pena, que consiste en dar o hacer algo en caso de no ejecutar o de retardar la obligación principal.","m":"[…] es aquella en que una persona, para asegurar el cumplimiento de una obligación, se sujeta a una pena, que consiste en dar o hacer algo en caso de no ejecutar o de retardar la obligación principal."},{"c":"Pago efectivo","a":"C","u":"Obligaciones","r":"Art. 1568 CC","d":"El pago efectivo es la prestación de lo que se debe.","m":"[…] es la prestación de lo que se debe."},{"c":"Pago con subrogación","a":"C","u":"Obligaciones","r":"Art. 1608 CC","d":"La subrogación es la transmisión de los derechos del acreedor a un tercero, que le paga.","m":"[…] es la transmisión de los derechos del acreedor a un tercero, que le paga."},{"c":"Cesión de bienes","a":"C","u":"Obligaciones","r":"Art. 1614 CC","d":"La cesión de bienes es el abandono voluntario que el deudor hace de todos los suyos a su acreedor o acreedores, cuando, a consecuencia de accidentes inevitables, no se halla en estado de pagar sus deudas.","m":"[…] es el abandono voluntario que el deudor hace de todos los suyos a su acreedor o acreedores, cuando, a consecuencia de accidentes inevitables, no se halla en estado de pagar sus deudas."},{"c":"Novación","a":"C","u":"Obligaciones","r":"Art. 1628 CC","d":"La novación es la substitución de una nueva obligación a otra anterior, la cual queda por tanto extinguida.","m":"[…] es la substitución de una nueva obligación a otra anterior, la cual queda por tanto extinguida."},{"c":"Confusión","a":"C","u":"Obligaciones","r":"Art. 1665 CC","d":"Cuando concurren en una misma persona las calidades de acreedor y deudor se verifica de derecho una confusión que extingue la deuda y produce iguales efectos que el pago.","m":"Cuando concurren en una misma persona las calidades de acreedor y deudor se verifica de derecho una […] que extingue la deuda y produce iguales efectos que el pago."},{"c":"Compensación","a":"C","u":"Obligaciones","r":"Art. 1655 CC","d":"Cuando dos personas son deudoras una de otra, se opera entre ellas una compensación que extingue ambas deudas, del modo y en los casos que van a explicarse.","m":"Cuando dos personas son deudoras una de otra, se opera entre ellas una […] que extingue ambas deudas, del modo y en los casos que van a explicarse."},{"c":"Nulidad","a":"C","u":"Acto Jurídico","r":"Art. 1681 CC","d":"Es nulo todo acto o contrato a que falta alguno de los requisitos que la ley prescribe para el valor del mismo acto o contrato, según su especie y la calidad o estado de las partes.","m":"Es […] todo acto o contrato a que falta alguno de los requisitos que la ley prescribe para el valor del mismo acto o contrato, según su especie y la calidad o estado de las partes."},{"c":"Bienes corporales e incorporales","a":"C","u":"Bienes","r":"Art. 565 CC","d":"Los bienes consisten en cosas corporales o incorporales. Corporales son las que tienen un ser real y pueden ser percibidas por los sentidos, como una casa, un libro. Incorporales las que consisten en meros derechos, como los créditos, y las servidumbres activas.","m":"[…] consisten en cosas corporales o incorporales. Corporales son las que tienen un ser real y pueden ser percibidas por los sentidos, como una casa, un libro. Incorporales las que consisten en meros derechos, como los créditos, y las servidumbres activas."},{"c":"Muebles","a":"C","u":"Bienes","r":"Art. 567 CC","d":"Muebles son las que pueden transportarse de un lugar a otro, sea moviéndose ellas a sí mismas, como los animales (que por eso se llaman semovientes), sea que sólo se muevan por una fuerza externa, como las cosas inanimadas.","m":"[…] son las que pueden transportarse de un lugar a otro, sea moviéndose ellas a sí mismas, como los animales (que por eso se llaman semovientes), sea que sólo se muevan por una fuerza externa, como las cosas inanimadas."},{"c":"Inmuebles","a":"C","u":"Bienes","r":"Art. 568 CC","d":"Inmuebles o fincas o bienes raíces son las cosas que no pueden transportarse de un lugar a otro; como las tierras y minas, y las que adhieren permanentemente a ellas, como los edificios, los árboles.","m":"[…] son las cosas que no pueden transportarse de un lugar a otro; como las tierras y minas, y las que adhieren permanentemente a ellas, como los edificios, los árboles."},{"c":"Cosas fungibles","a":"C","u":"Bienes","r":"Art. 575 CC","d":"Las cosas muebles se dividen en fungibles y no fungibles. A las primeras pertenecen aquellas de que no puede hacerse el uso conveniente a su naturaleza sin que se destruyan.","m":"Las cosas muebles se dividen en […] y no […]. A las primeras pertenecen aquellas de que no puede hacerse el uso conveniente a su naturaleza sin que se destruyan."},{"c":"Derecho real","a":"C","u":"Bienes","r":"Art. 577 CC","d":"Derecho real es el que tenemos sobre una cosa sin respecto a determinada persona.","m":"[…] es el que tenemos sobre una cosa sin respecto a determinada persona."},{"c":"Derecho personal","a":"C","u":"Bienes","r":"Art. 578 CC","d":"Derechos personales o créditos son los que sólo pueden reclamarse de ciertas personas, que, por un hecho suyo o la sola disposición de la ley, han contraído las obligaciones correlativas; como el que tiene el prestamista contra su deudor por el dinero prestado, o el hijo contra el padre por alimentos.","m":"[…] son los que sólo pueden reclamarse de ciertas personas, que, por un hecho suyo o la sola disposición de la ley, han contraído las obligaciones correlativas; como el que tiene el prestamista contra su deudor por el dinero prestado, o el hijo contra el padre por alimentos."},{"c":"Dominio","a":"C","u":"Bienes","r":"Art. 582 CC","d":"El dominio (que se llama también propiedad) es el derecho real en una cosa corporal, para gozar y disponer de ella arbitrariamente; no siendo contra la ley o contra derecho ajeno.","m":"[…] es el derecho real en una cosa corporal, para gozar y disponer de ella arbitrariamente; no siendo contra la ley o contra derecho ajeno."},{"c":"Modos de adquirir el dominio","a":"C","u":"Bienes","r":"Art. 588 CC","d":"Los modos de adquirir el dominio son la ocupación, la accesión, la tradición, la sucesión por causa de muerte, y la prescripción.","m":"[…] son la ocupación, la accesión, la tradición, la sucesión por causa de muerte, y la prescripción."},{"c":"Ocupación","a":"C","u":"Bienes","r":"Art. 606 CC","d":"Por la ocupación se adquiere el dominio de las cosas que no pertenecen a nadie, y cuya adquisición no es prohibida por las leyes chilenas, o por el Derecho Internacional.","m":"Por la […] se adquiere el dominio de las cosas que no pertenecen a nadie, y cuya adquisición no es prohibida por las leyes chilenas, o por el Derecho Internacional."},{"c":"Accesión","a":"C","u":"Bienes","r":"Art. 643 CC","d":"La accesión es un modo de adquirir por el cual el dueño de una cosa pasa a serlo de lo que ella produce, o de lo que se junta a ella.","m":"[…] es un modo de adquirir por el cual el dueño de una cosa pasa a serlo de lo que ella produce, o de lo que se junta a ella."},{"c":"Tradición","a":"C","u":"Bienes","r":"Art. 670 CC","d":"La tradición es un modo de adquirir el dominio de las cosas y consiste en la entrega que el dueño hace de ellas a otro, habiendo por una parte la facultad e intención de transferir el dominio, y por otra la capacidad e intención de adquirirlo.","m":"[…] es un modo de adquirir el dominio de las cosas y consiste en la entrega que el dueño hace de ellas a otro, habiendo por una parte la facultad e intención de transferir el dominio, y por otra la capacidad e intención de adquirirlo."},{"c":"Posesión","a":"C","u":"Bienes","r":"Art. 700 CC","d":"La posesión es la tenencia de una cosa determinada con ánimo de señor o dueño, sea que el dueño o el que se da por tal tenga la cosa por sí mismo, o por otra persona que la tenga en lugar y a nombre de él.","m":"[…] es la tenencia de una cosa determinada con ánimo de señor o dueño, sea que el dueño o el que se da por tal tenga la cosa por sí mismo, o por otra persona que la tenga en lugar y a nombre de él."},{"c":"Títulos constitutivos de dominio","a":"C","u":"Bienes","r":"Art. 703 CC","d":"Son constitutivos de dominio la ocupación, la accesión y la prescripción.","m":"Son […] de dominio la ocupación, la accesión y la prescripción."},{"c":"Títulos translaticios de dominio","a":"C","u":"Bienes","r":"Art. 703 CC","d":"Son translaticios de dominio los que por su naturaleza sirven para transferirlo, como la venta, la permuta, la donación entre vivos.","m":"Son […] de dominio los que por su naturaleza sirven para transferirlo, como la venta, la permuta, la donación entre vivos."},{"c":"Buena fe en la posesión","a":"C","u":"Bienes","r":"Art. 706 CC","d":"La buena fe es la conciencia de haberse adquirido el dominio de la cosa por medios legítimos, exentos de fraude y de todo otro vicio.","m":"[…] es la conciencia de haberse adquirido el dominio de la cosa por medios legítimos, exentos de fraude y de todo otro vicio."},{"c":"Mera tenencia","a":"C","u":"Bienes","r":"Art. 714 CC","d":"Se llama mera tenencia la que se ejerce sobre una cosa, no como dueño, sino en lugar o a nombre del dueño.","m":"Se llama […] la que se ejerce sobre una cosa, no como dueño, sino en lugar o a nombre del dueño."},{"c":"Usufructo","a":"C","u":"Bienes","r":"Art. 764 CC","d":"El derecho de usufructo es un derecho real que consiste en la facultad de gozar de una cosa con cargo de conservar su forma y substancia, y de restituirla a su dueño, si la cosa no es fungible; o con cargo de volver igual cantidad y calidad del mismo género, o de pagar su valor, si la cosa es fungible.","m":"[…] es un derecho real que consiste en la facultad de gozar de una cosa con cargo de conservar su forma y substancia, y de restituirla a su dueño, si la cosa no es fungible; o con cargo de volver igual cantidad y calidad del mismo género, o de pagar su valor, si la cosa es fungible."},{"c":"Servidumbre predial","a":"C","u":"Bienes","r":"Art. 820 CC","d":"Servidumbre predial, o simplemente servidumbre, es un gravamen impuesto sobre un predio en utilidad de otro predio de distinto dueño.","m":"[…] es un gravamen impuesto sobre un predio en utilidad de otro predio de distinto dueño."},{"c":"Acción reivindicatoria","a":"C","u":"Bienes","r":"Art. 889 CC","d":"La reivindicación o acción de dominio es la que tiene el dueño de una cosa singular, de que no está en posesión, para que el poseedor de ella sea condenado a restituírsela.","m":"[…] es la que tiene el dueño de una cosa singular, de que no está en posesión, para que el poseedor de ella sea condenado a restituírsela."},{"c":"Propiedad fiduciaria","a":"C","u":"Bienes","r":"Art. 733 CC","d":"Se llama propiedad fiduciaria la que está sujeta al gravamen de pasar a otra persona, por el hecho de verificarse una condición.","m":"Se llama […] la que está sujeta al gravamen de pasar a otra persona, por el hecho de verificarse una condición."},{"c":"Prescripción","a":"C","u":"Bienes","r":"Art. 2492 CC","d":"La prescripción es un modo de adquirir las cosas ajenas, o de extinguir las acciones y derechos ajenos, por haberse poseído las cosas o no haberse ejercido dichas acciones y derechos durante cierto lapso de tiempo, y concurriendo los demás requisitos legales.","m":"[…] es un modo de adquirir las cosas ajenas, o de extinguir las acciones y derechos ajenos, por haberse poseído las cosas o no haberse ejercido dichas acciones y derechos durante cierto lapso de tiempo, y concurriendo los demás requisitos legales."},{"c":"Matrimonio","a":"C","u":"Familia","r":"Art. 102 CC","d":"El matrimonio es un contrato solemne por el cual dos personas se unen actual e indisolublemente, y por toda la vida, con el fin de vivir juntos, de procrear, y de auxiliarse mutuamente.","m":"[…] es un contrato solemne por el cual dos personas se unen actual e indisolublemente, y por toda la vida, con el fin de vivir juntos, de procrear, y de auxiliarse mutuamente."},{"c":"Esponsales","a":"C","u":"Familia","r":"Art. 98 CC","d":"Los esponsales o desposorio, o sea la promesa de matrimonio mutuamente aceptada, es un hecho privado, que las leyes someten enteramente al honor y conciencia del individuo, y que no produce obligación alguna ante la ley civil.","m":"[…] es un hecho privado, que las leyes someten enteramente al honor y conciencia del individuo, y que no produce obligación alguna ante la ley civil."},{"c":"Finalidad de los alimentos","a":"C","u":"Familia","r":"Art. 323 CC","d":"Los alimentos deben habilitar al alimentado para subsistir adecuadamente, resguardando el interés superior, la autonomía progresiva y el desarrollo integral del niño, niña y adolescente.","m":"Los alimentos deben habilitar al alimentado para subsistir adecuadamente, resguardando el interés superior, la autonomía progresiva y el desarrollo integral del niño, niña y adolescente."},{"c":"Patria potestad","a":"C","u":"Familia","r":"Art. 243 CC","d":"La patria potestad es el conjunto de derechos y deberes que corresponden al padre o a la madre sobre los bienes de sus hijos no emancipados.","m":"[…] es el conjunto de derechos y deberes que corresponden al padre o a la madre sobre los bienes de sus hijos no emancipados."},{"c":"Tutelas y curadurías","a":"C","u":"Familia","r":"Art. 338 CC","d":"Las tutelas y las curadurías o curatelas son cargos impuestos a ciertas personas a favor de aquellos que no pueden dirigirse a sí mismos o administrar competentemente sus negocios, y que no se hallan bajo potestad de padre o madre, que pueda darles la protección debida.","m":"[…] son cargos impuestos a ciertas personas a favor de aquellos que no pueden dirigirse a sí mismos o administrar competentemente sus negocios, y que no se hallan bajo potestad de padre o madre, que pueda darles la protección debida."},{"c":"Títulos de la sucesión por causa de muerte","a":"C","u":"Sucesorio","r":"Art. 951 CC","d":"Se sucede a una persona difunta a título universal o a título singular.","m":"Se sucede a una persona difunta a título universal o a título singular."},{"c":"Herencia y legado","a":"C","u":"Sucesorio","r":"Art. 954 CC","d":"Las asignaciones a título universal se llaman herencias, y las asignaciones a título singular, legados.","m":"Las asignaciones a título universal se llaman […], y las asignaciones a título singular, […]."},{"c":"Derecho de transmisión","a":"C","u":"Sucesorio","r":"Art. 957 CC","d":"Si el heredero o legatario cuyos derechos a la sucesión no han prescrito, fallece antes de haber aceptado o repudiado la herencia o legado que se le ha deferido, transmite a sus herederos el derecho de aceptar o repudiar dicha herencia o legado, aun cuando fallezca sin saber que se le ha deferido.","m":"Si el heredero o legatario cuyos derechos a la sucesión no han prescrito, fallece antes de haber aceptado o repudiado la herencia o legado que se le ha deferido, […] a sus herederos el derecho de aceptar o repudiar dicha herencia o legado, aun cuando fallezca sin saber que se le ha deferido."},{"c":"Testamento","a":"C","u":"Sucesorio","r":"Art. 999 CC","d":"El testamento es un acto más o menos solemne, en que una persona dispone del todo o de una parte de sus bienes para que tenga pleno efecto después de sus días, conservando la facultad de revocar las disposiciones contenidas en él, mientras viva.","m":"[…] es un acto más o menos solemne, en que una persona dispone del todo o de una parte de sus bienes para que tenga pleno efecto después de sus días, conservando la facultad de revocar las disposiciones contenidas en él, mientras viva."},{"c":"Legítima","a":"C","u":"Sucesorio","r":"Art. 1181 CC","d":"Legítima es aquella cuota de los bienes de un difunto que la ley asigna a ciertas personas llamadas legitimarios.","m":"[…] es aquella cuota de los bienes de un difunto que la ley asigna a ciertas personas llamadas legitimarios."},{"c":"Desheredamiento","a":"C","u":"Sucesorio","r":"Art. 1207 CC","d":"Desheredamiento es una disposición testamentaria en que se ordena que un legitimario sea privado del todo o parte de su legítima.","m":"[…] es una disposición testamentaria en que se ordena que un legitimario sea privado del todo o parte de su legítima."},{"c":"Donación entre vivos","a":"C","u":"Contratos Parte Especial","r":"Art. 1386 CC","d":"La donación entre vivos es un acto por el cual una persona transfiere gratuita e irrevocablemente una parte de sus bienes a otra persona, que la acepta.","m":"[…] es un acto por el cual una persona transfiere gratuita e irrevocablemente una parte de sus bienes a otra persona, que la acepta."},{"c":"Compraventa","a":"C","u":"Contratos Parte Especial","r":"Art. 1793 CC","d":"La compraventa es un contrato en que una de las partes se obliga a dar una cosa y la otra a pagarla en dinero.","m":"[…] es un contrato en que una de las partes se obliga a dar una cosa y la otra a pagarla en dinero."},{"c":"Permuta","a":"C","u":"Contratos Parte Especial","r":"Art. 1897 CC","d":"La permutación o cambio es un contrato en que las partes se obligan mutuamente a dar una especie o cuerpo cierto por otro.","m":"[…] es un contrato en que las partes se obligan mutuamente a dar una especie o cuerpo cierto por otro."},{"c":"Cesión de créditos","a":"C","u":"Contratos Parte Especial","r":"Art. 1901 CC","d":"La cesión de un crédito personal, a cualquier título que se haga, no tendrá efecto entre el cedente y el cesionario sino en virtud de la entrega del título.","m":"La […] de un crédito personal, a cualquier título que se haga, no tendrá efecto entre el cedente y el cesionario sino en virtud de la entrega del título."},{"c":"Arrendamiento","a":"C","u":"Contratos Parte Especial","r":"Art. 1915 CC","d":"El arrendamiento es un contrato en que las dos partes se obligan recíprocamente, la una a conceder el goce de una cosa, o a ejecutar una obra o prestar un servicio, y la otra a pagar por este goce, obra o servicio un precio determinado.","m":"[…] es un contrato en que las dos partes se obligan recíprocamente, la una a conceder el goce de una cosa, o a ejecutar una obra o prestar un servicio, y la otra a pagar por este goce, obra o servicio un precio determinado."},{"c":"Sociedad","a":"C","u":"Contratos Parte Especial","r":"Art. 2053 CC","d":"La sociedad o compañía es un contrato en que dos o más personas estipulan poner algo en común con la mira de repartir entre sí los beneficios que de ello provengan.","m":"[…] es un contrato en que dos o más personas estipulan poner algo en común con la mira de repartir entre sí los beneficios que de ello provengan."},{"c":"Mandato","a":"C","u":"Contratos Parte Especial","r":"Art. 2116 CC","d":"El mandato es un contrato en que una persona confía la gestión de uno o más negocios a otra, que se hace cargo de ellos por cuenta y riesgo de la primera.","m":"[…] es un contrato en que una persona confía la gestión de uno o más negocios a otra, que se hace cargo de ellos por cuenta y riesgo de la primera."},{"c":"Comodato","a":"C","u":"Contratos Parte Especial","r":"Art. 2174 CC","d":"El comodato o préstamo de uso es un contrato en que una de las partes entrega a la otra gratuitamente una especie, mueble o raíz, para que haga uso de ella, y con cargo de restituir la misma especie después de terminado el uso.","m":"[…] es un contrato en que una de las partes entrega a la otra gratuitamente una especie, mueble o raíz, para que haga uso de ella, y con cargo de restituir la misma especie después de terminado el uso."},{"c":"Mutuo","a":"C","u":"Contratos Parte Especial","r":"Art. 2196 CC","d":"El mutuo o préstamo de consumo es un contrato en que una de las partes entrega a la otra cierta cantidad de cosas fungibles con cargo de restituir otras tantas del mismo género y calidad.","m":"[…] es un contrato en que una de las partes entrega a la otra cierta cantidad de cosas fungibles con cargo de restituir otras tantas del mismo género y calidad."},{"c":"Depósito","a":"C","u":"Contratos Parte Especial","r":"Art. 2211 CC","d":"Llámase en general depósito el contrato en que se confía una cosa corporal a una persona que se encarga de guardarla y de restituirla en especie.","m":"Llámase en general […] el contrato en que se confía una cosa corporal a una persona que se encarga de guardarla y de restituirla en especie."},{"c":"Cuasicontrato","a":"C","u":"Obligaciones","r":"Art. 2284 CC","d":"Las obligaciones que se contraen sin convención, nacen o de la ley, o del hecho voluntario de una de las partes. Las que nacen de la ley se expresan en ella. Si el hecho de que nacen es lícito, constituye un cuasicontrato.","m":"Las obligaciones que se contraen sin convención, nacen o de la ley, o del hecho voluntario de una de las partes. Las que nacen de la ley se expresan en ella. Si el hecho de que nacen es lícito, constituye un […]."},{"c":"Delito civil y cuasidelito","a":"C","u":"Responsabilidad Extracontractual","r":"Art. 2284 CC","d":"Si el hecho es ilícito, y cometido con intención de dañar, constituye un delito. Si el hecho es culpable, pero cometido sin intención de dañar, constituye un cuasidelito.","m":"Si el hecho es ilícito, y cometido con intención de dañar, constituye un […]. Si el hecho es culpable, pero cometido sin intención de dañar, constituye un […]."},{"c":"Agencia oficiosa","a":"C","u":"Contratos Parte Especial","r":"Art. 2286 CC","d":"La agencia oficiosa o gestión de negocios ajenos, llamada comúnmente gestión de negocios, es un cuasicontrato por el cual el que administra sin mandato los negocios de alguna persona, se obliga para con ésta, y la obliga en ciertos casos.","m":"[…] es un cuasicontrato por el cual el que administra sin mandato los negocios de alguna persona, se obliga para con ésta, y la obliga en ciertos casos."},{"c":"Fianza","a":"C","u":"Contratos Parte Especial","r":"Art. 2335 CC","d":"La fianza es una obligación accesoria, en virtud de la cual una o más personas responden de una obligación ajena, comprometiéndose para con el acreedor a cumplirla en todo o parte, si el deudor principal no la cumple.","m":"[…] es una obligación accesoria, en virtud de la cual una o más personas responden de una obligación ajena, comprometiéndose para con el acreedor a cumplirla en todo o parte, si el deudor principal no la cumple."},{"c":"Prenda","a":"C","u":"Contratos Parte Especial","r":"Art. 2384 CC","d":"Por el contrato de empeño o prenda se entrega una cosa mueble a un acreedor para la seguridad de su crédito.","m":"Por el contrato de […] se entrega una cosa mueble a un acreedor para la seguridad de su crédito."},{"c":"Hipoteca","a":"C","u":"Contratos Parte Especial","r":"Art. 2407 CC","d":"La hipoteca es un derecho de prenda, constituido sobre inmuebles que no dejan por eso de permanecer en poder del deudor.","m":"[…] es un derecho de prenda, constituido sobre inmuebles que no dejan por eso de permanecer en poder del deudor."},{"c":"Anticresis","a":"C","u":"Contratos Parte Especial","r":"Art. 2435 CC","d":"La anticresis es un contrato por el que se entrega al acreedor una cosa raíz para que se pague con sus frutos.","m":"[…] es un contrato por el que se entrega al acreedor una cosa raíz para que se pague con sus frutos."},{"c":"Transacción","a":"C","u":"Contratos Parte Especial","r":"Art. 2446 CC","d":"La transacción es un contrato en que las partes terminan extrajudicialmente un litigio pendiente, o precaven un litigio eventual.","m":"[…] es un contrato en que las partes terminan extrajudicialmente un litigio pendiente, o precaven un litigio eventual."},{"c":"Instrumento público","a":"C","u":"Acto Jurídico","r":"Art. 1699 CC","d":"Instrumento público o auténtico es el autorizado con las solemnidades legales por el competente funcionario.","m":"[…] es el autorizado con las solemnidades legales por el competente funcionario."},{"c":"Facultad de conocer, juzgar y hacer ejecutar lo juzgado","a":"P","u":"Procesal Orgánico","r":"Art. 1 COT","d":"La facultad de conocer de las causas civiles y criminales, de juzgarlas y de hacer ejecutar lo juzgado pertenece exclusivamente a los tribunales que establece la ley.","m":"La facultad de conocer de las causas civiles y criminales, de juzgarlas y de hacer ejecutar lo juzgado pertenece exclusivamente a los tribunales que establece la ley."},{"c":"Competencia","a":"P","u":"Procesal Orgánico","r":"Art. 108 COT","d":"La competencia es la facultad que tiene cada juez o tribunal para conocer de los negocios que la ley ha colocado dentro de la esfera de sus atribuciones.","m":"[…] es la facultad que tiene cada juez o tribunal para conocer de los negocios que la ley ha colocado dentro de la esfera de sus atribuciones."},{"c":"Prórroga de la competencia","a":"P","u":"Procesal Orgánico","r":"Art. 181 COT","d":"Un tribunal que no es naturalmente competente para conocer de un determinado asunto, puede llegar a serlo si para ello las partes, expresa o tácitamente, convienen en prorrogarle la competencia para este negocio.","m":"Un tribunal que no es naturalmente competente para conocer de un determinado asunto, puede llegar a serlo si para ello las partes, expresa o tácitamente, convienen en […] para este negocio."},{"c":"Juez árbitro","a":"P","u":"Procesal Orgánico","r":"Art. 222 COT","d":"Se llaman árbitros, los jueces nombrados por las partes, o por la autoridad judicial en subsidio, para la resolución de un asunto litigioso.","m":"Se llaman […], los jueces nombrados por las partes, o por la autoridad judicial en subsidio, para la resolución de un asunto litigioso."},{"c":"Receptores judiciales","a":"P","u":"Procesal Orgánico","r":"Art. 390 COT","d":"Los receptores son ministros de fe pública encargados de hacer saber a las partes, fuera de las oficinas de los secretarios, los decretos y resoluciones de los Tribunales de Justicia, y de evacuar todas aquellas diligencias que los mismos tribunales les cometieren.","m":"[…] son ministros de fe pública encargados de hacer saber a las partes, fuera de las oficinas de los secretarios, los decretos y resoluciones de los Tribunales de Justicia, y de evacuar todas aquellas diligencias que los mismos tribunales les cometieren."},{"c":"Procuradores del número","a":"P","u":"Procesal Orgánico","r":"Art. 394 COT","d":"Los procuradores del número, son oficiales de la administración de justicia encargados de representar en juicio a las partes.","m":"[…] son oficiales de la administración de justicia encargados de representar en juicio a las partes."},{"c":"Notarios","a":"P","u":"Procesal Orgánico","r":"Art. 399 COT","d":"Los notarios son ministros de fe pública encargados de extender y autorizar los instrumentos públicos y privados que ante ellos se otorguen, de guardarlos en los casos y formas que la ley lo señale, de dar copias de ellos y de practicar las demás diligencias que la ley les encomiende.","m":"[…] son ministros de fe pública encargados de extender y autorizar los instrumentos públicos y privados que ante ellos se otorguen, de guardarlos en los casos y formas que la ley lo señale, de dar copias de ellos y de practicar las demás diligencias que la ley les encomiende."},{"c":"Conservadores","a":"P","u":"Procesal Orgánico","r":"Art. 446 COT","d":"Son conservadores los ministro de fe encargados de los registros conservatorios de bienes raíces, de comercio, de minas, de accionistas de sociedades propiamente mineras, de asociaciones de canalistas, de prenda agraria, de prenda industrial, de especial de prenda y demás que les encomienden las leyes.","m":"Son […] los ministro de fe encargados de los registros […] de bienes raíces, de comercio, de minas, de accionistas de sociedades propiamente mineras, de asociaciones de canalistas, de prenda agraria, de prenda industrial, de especial de prenda y demás que les encomienden las leyes."},{"c":"Archiveros","a":"P","u":"Procesal Orgánico","r":"Art. 453 COT","d":"Los archiveros son ministros de fe pública encargados de la custodia de los documentos expresados en el artículo 455 de este Código y de dar a las partes interesadas los testimonios que de ellos pidieren.","m":"[…] son ministros de fe pública encargados de la custodia de los documentos expresados en el artículo 455 de este Código y de dar a las partes interesadas los testimonios que de ellos pidieren."},{"c":"Consejos técnicos","a":"P","u":"Procesal Orgánico","r":"Art. 457 COT","d":"Los consejos técnicos son organismos auxiliares de la administración de justicia, compuestos por profesionales en el número y con los requisitos que establece la ley.","m":"[…] son organismos auxiliares de la administración de justicia, compuestos por profesionales en el número y con los requisitos que establece la ley."},{"c":"Abogados","a":"P","u":"Procesal Orgánico","r":"Art. 520 COT","d":"Los abogados son personas revestidas por la autoridad competente de la facultad de defender ante los Tribunales de Justicia los derechos de las partes litigantes.","m":"[…] son personas revestidas por la autoridad competente de la facultad de defender ante los Tribunales de Justicia los derechos de las partes litigantes."},{"c":"Incidente","a":"P","u":"Procedimiento Incidental","r":"Art. 82 CPC","d":"Toda cuestión accesoria de un juicio que requiera pronunciamiento especial con audiencia de las partes, se tramitará como incidente y se sujetará a las reglas de este Título, si no tiene señalada por la ley una tramitación especial.","m":"Toda cuestión accesoria de un juicio que requiera pronunciamiento especial con audiencia de las partes, se tramitará como […] y se sujetará a las reglas de este Título, si no tiene señalada por la ley una tramitación especial."},{"c":"Sentencia definitiva","a":"P","u":"Normas Comunes","r":"Art. 158 CPC","d":"Es sentencia definitiva la que pone fin a la instancia, resolviendo la cuestión o asunto que ha sido objeto del juicio.","m":"Es […] la que pone fin a la instancia, resolviendo la cuestión o asunto que ha sido objeto del juicio."},{"c":"Sentencia interlocutoria","a":"P","u":"Normas Comunes","r":"Art. 158 CPC","d":"Es sentencia interlocutoria la que falla un incidente del juicio, estableciendo derechos permanentes a favor de las partes, o resuelve sobre algún trámite que debe servir de base en el pronunciamiento de una sentencia definitiva o interlocutoria.","m":"Es […] la que falla un incidente del juicio, estableciendo derechos permanentes a favor de las partes, o resuelve sobre algún trámite que debe servir de base en el pronunciamiento de una sentencia definitiva o interlocutoria."},{"c":"Auto","a":"P","u":"Normas Comunes","r":"Art. 158 CPC","d":"Se llama auto la resolución que recae en un incidente no comprendido en el inciso anterior.","m":"Se llama […] la resolución que recae en un incidente no comprendido en el inciso anterior."},{"c":"Decreto, providencia o proveído","a":"P","u":"Normas Comunes","r":"Art. 158 CPC","d":"Se llama decreto, providencia o proveído el que, sin fallar sobre incidentes o sobre trámites que sirvan de base para el pronunciamiento de una sentencia, tiene sólo por objeto determinar o arreglar la substanciación del proceso.","m":"Se llama […] el que, sin fallar sobre incidentes o sobre trámites que sirvan de base para el pronunciamiento de una sentencia, tiene sólo por objeto determinar o arreglar la substanciación del proceso."},{"c":"Sentencia firme o ejecutoriada","a":"P","u":"Normas Comunes","r":"Art. 174 CPC","d":"Se entenderá firme o ejecutoriada una resolución desde que se haya notificado a las partes, si no procede recurso alguno en contra de ella; y, en caso contrario, desde que se notifique el decreto que la mande cumplir, una vez que terminen los recursos deducidos, o desde que transcurran todos los plazos que la ley concede para la interposición de dichos recursos, sin que se hayan hecho valer por las partes.","m":"Se entenderá […] una resolución desde que se haya notificado a las partes, si no procede recurso alguno en contra de ella; y, en caso contrario, desde que se notifique el decreto que la mande cumplir, una vez que terminen los recursos deducidos, o desde que transcurran todos los plazos que la ley concede para la interposición de dichos recursos, sin que se hayan hecho valer por las partes."},{"c":"Notificación por el estado diario","a":"P","u":"Normas Comunes","r":"Art. 50 CPC","d":"Las resoluciones no comprendidas en los artículos precedentes se entenderán notificadas a las partes desde que se incluyan en un estado que deberá formarse electrónicamente, el que estará disponible diariamente en la página web del Poder Judicial con las indicaciones que el inciso siguiente expresa.","m":"Las resoluciones no comprendidas en los artículos precedentes se entenderán notificadas a las partes desde que se incluyan en un […] que deberá formarse electrónicamente, el que estará disponible diariamente en la página web del Poder Judicial con las indicaciones que el inciso siguiente expresa."},{"c":"Plazos fatales","a":"P","u":"Normas Comunes","r":"Art. 64 CPC","d":"Los plazos que señala este Código son fatales cualquiera sea la forma en que se exprese, salvo aquéllos establecidos para la realización de actuaciones propias del tribunal.","m":"[…] son fatales cualquiera sea la forma en que se exprese, salvo aquéllos establecidos para la realización de actuaciones propias del tribunal."},{"c":"Carácter supletorio del juicio ordinario","a":"P","u":"Juicio Ordinario de Mayor Cuantía","r":"Art. 3 CPC","d":"Se aplicará el procedimiento ordinario en todas las gestiones, trámites y actuaciones que no estén sometidos a una regla especial diversa, cualquiera que sea su naturaleza.","m":"Se aplicará el procedimiento […] en todas las gestiones, trámites y actuaciones que no estén sometidos a una regla especial diversa, cualquiera que sea su naturaleza."},{"c":"Recepción de la causa a prueba","a":"P","u":"Juicio Ordinario de Mayor Cuantía","r":"Art. 318 CPC","d":"Concluídos los trámites que deben preceder a la prueba, ya se proceda con la contestación expresa del demandado o en su rebeldía, el tribunal examinará por sí mismo los autos y si estima que hay o puede haber controversia sobre algún hecho substancial y pertinente en el juicio, recibirá la causa a prueba y fijará en la misma resolución los hechos substanciales controvertidos sobre los cuales deberá recaer.","m":"Concluídos los trámites que deben preceder a la prueba, ya se proceda con la contestación expresa del demandado o en su rebeldía, el tribunal examinará por sí mismo los autos y si estima que hay o puede haber controversia sobre algún hecho substancial y pertinente en el juicio, […] y fijará en la misma resolución los hechos substanciales controvertidos sobre los cuales deberá recaer."},{"c":"Deber de promover métodos autocompositivos","a":"P","u":"Ley 21.394 (reformas a la justicia)","r":"Art. 3 bis CPC","d":"Es deber de los abogados, de los funcionarios de la administración de justicia y de los jueces, promover el empleo de métodos autocompositivos de resolución de conflictos, como la conciliación, la mediación, entre otros.","m":"Es deber de los abogados, de los funcionarios de la administración de justicia y de los jueces, promover el empleo de métodos […] de resolución de conflictos, como la conciliación, la mediación, entre otros."}],"cases":[{"a":"C","u":"Acto Jurídico","q":"Pedro, de 15 años, vende su bicicleta de alto valor a un vecino sin autorización de sus padres. Un año después, sus padres quieren dejar sin efecto la venta. ¿Cómo se resuelve?","o":["Nulidad relativa, porque Pedro es menor adulto y actuó sin autorización de su representante.","Nulidad absoluta, porque Pedro es impúber y absolutamente incapaz de celebrar contratos.","El contrato es válido, porque el menor adulto puede vender libremente sus bienes muebles."],"e":"Pedro es menor adulto (art. 26 CC: varón mayor de 14 años). Sus actos sin autorización son relativamente nulos (arts. 1447 y 1682 inc. 3 CC). La acción la pueden ejercer él o su representante, dentro de cuatro años desde que cesa la incapacidad (art. 1691 CC)."},{"a":"C","u":"Acto Jurídico","q":"Ana compra un cuadro creyendo que es un original de un pintor famoso, porque el vendedor así se lo aseguró con certificados falsos. En realidad es una copia. ¿Qué puede hacer Ana?","o":["Pedir la nulidad relativa por dolo determinante de la contraparte, más indemnización de perjuicios.","Pedir la nulidad absoluta del contrato por objeto ilícito, ya que se vendió una cosa falsificada.","Nada, porque el error sobre la calidad de la cosa nunca vicia el consentimiento en la compraventa."],"e":"Hay dolo determinante y obra de una de las partes (art. 1458 CC), y además error sustancial (art. 1454 CC). Ambos vicios producen nulidad relativa (art. 1682 inc. 3 CC). El plazo de cuatro años se cuenta desde la celebración del contrato (art. 1691 CC)."},{"a":"C","u":"Acto Jurídico","q":"Juan, que padece una demencia diagnosticada, firma una escritura de compraventa de su casa en un momento en que no comprendía lo que hacía. ¿Qué sanción tiene el contrato?","o":["Nulidad absoluta, porque fue celebrado por un absolutamente incapaz.","Nulidad relativa, porque faltó la autorización de su curador.","Inoponibilidad respecto de sus herederos y de sus acreedores."],"e":"Los dementes son absolutamente incapaces (art. 1447 CC) y sus actos adolecen de nulidad absoluta (art. 1682 inc. 2 CC). Si hay decreto de interdicción, los actos posteriores son nulos aunque se alegue un intervalo lúcido (art. 465 CC)."},{"a":"C","u":"Bienes","q":"Luis compra un auto a Carlos, quien se lo había robado a Marta. Luis no sabía que el auto era robado. Marta descubre el auto en poder de Luis. ¿Qué acción procede?","o":["Marta puede reivindicar contra Luis, porque la tradición hecha por quien no es dueño no transfiere el dominio.","Luis es dueño, porque compró de buena fe y pagó el precio; Marta solo puede demandar a Carlos por los perjuicios.","Marta debe pedir la nulidad absoluta de la venta, porque la venta de cosa ajena es nula en Chile."],"e":"La venta de cosa ajena vale (art. 1815 CC), pero la tradición hecha por quien no es dueño no transfiere el dominio (art. 682 CC). Marta, dueña no poseedora, puede reivindicar (art. 889 CC), salvo que Luis haya adquirido por prescripción."},{"a":"C","u":"Bienes","q":"Rosa ocupa durante doce años un terreno sin título alguno, comportándose como dueña, sin que nadie se lo reclame. El inmueble está inscrito a nombre de otra persona. ¿Puede adquirirlo?","o":["Es discutible: según la doctrina mayoritaria, contra título inscrito solo se prescribe con otro título inscrito.","Sí, siempre, porque transcurrieron más de diez años de posesión irregular, tranquila y sin reclamo del dueño.","No, porque los bienes raíces inscritos no pueden adquirirse por prescripción en ningún caso."],"e":"Art. 2505 CC: contra un título inscrito no tendrá lugar la prescripción adquisitiva de bienes raíces sino en virtud de otro título inscrito. Para inmuebles sin inscripción o de pequeños propietarios existe además el procedimiento del DL 2.695."},{"a":"C","u":"Obligaciones","q":"Mario debía entregar una partida de fruta el 1 de marzo, pero no lo hizo. El comprador quiere terminar el contrato y ser indemnizado. ¿Qué derechos tiene?","o":["Puede pedir la resolución del contrato con indemnización, por la condición resolutoria tácita.","Solo puede pedir el cumplimiento forzado, porque la resolución requiere pacto comisorio expreso.","Solo puede pedir la nulidad relativa del contrato, por incumplimiento grave del vendedor."],"e":"En los contratos bilaterales va envuelta la condición resolutoria tácita. El acreedor puede pedir a su arbitrio la resolución o el cumplimiento, en ambos casos con indemnización de perjuicios (art. 1489 CC). Mario está en mora desde el vencimiento del plazo (art. 1551 N° 1 CC)."},{"a":"C","u":"Obligaciones","q":"Tres amigos firman un pagaré como codeudores solidarios por $3.000.000. Al vencimiento, el banco demanda solo a Pedro por el total. Pedro alega que solo debe $1.000.000. ¿Quién tiene razón?","o":["El banco: en la solidaridad pasiva puede cobrar el total a cualquiera de los deudores.","Pedro: cada codeudor responde solo de su cuota, aunque la deuda sea solidaria.","Pedro: el banco debe demandar a los tres conjuntamente para cobrar el total."],"e":"Art. 1514 CC. Pedro, una vez que pague, se subroga en la acción del banco contra sus codeudores, pero solo por la parte o cuota que a cada uno corresponda (arts. 1522 y 1610 N° 3 CC)."},{"a":"C","u":"Obligaciones","q":"Una deuda civil de dinero, sin título ejecutivo, se hizo exigible hace seis años y el acreedor nunca la cobró. Hoy demanda y el deudor no dice nada de la prescripción. ¿Puede el juez declararla?","o":["No, porque la prescripción debe ser alegada y el juez no puede declararla de oficio.","Sí, porque la prescripción extintiva opera de pleno derecho al cumplirse el plazo.","Sí, porque la acción ordinaria prescribe en cinco años y el juez debe constatarlo."],"e":"Art. 2493 CC: el que quiera aprovecharse de la prescripción debe alegarla; el juez no puede declararla de oficio. Si el deudor no la alega, la obligación subsiste como civil."},{"a":"C","u":"Obligaciones","q":"Daniel debe $500.000 a Sofía, y Sofía le debe a Daniel $300.000 por otro préstamo. Ambas deudas están vencidas. Sofía demanda el cobro de $500.000. ¿Qué puede oponer Daniel?","o":["La compensación, que extingue ambas deudas hasta concurrencia de sus valores: debe $200.000.","La novación de ambas obligaciones, que extingue las dos deudas y crea una nueva de $200.000.","Nada, porque la compensación exige que ambas deudas provengan de un mismo contrato."],"e":"Arts. 1655 y 1656 CC: ambas deudas son de dinero, líquidas y actualmente exigibles. La compensación opera de pleno derecho pero debe alegarse."},{"a":"C","u":"Responsabilidad Extracontractual","q":"Un niño de 6 años lanza una piedra y rompe el parabrisas de un auto estacionado. El dueño del auto quiere demandar. ¿A quién?","o":["A quien tenga el cuidado del niño, si puede imputársele negligencia; el niño es incapaz de delito.","Al niño, representado por sus padres, porque todo el que causa un daño a otro debe repararlo.","A nadie, porque el hecho de un menor de siete años se asimila a un caso fortuito."],"e":"Art. 2319 CC: no son capaces de delito o cuasidelito los menores de siete años; responden las personas a cuyo cargo estén, si pudiere imputárseles negligencia."},{"a":"C","u":"Responsabilidad Extracontractual","q":"Un conductor atropella a un peatón que cruzó corriendo en rojo y fuera del paso peatonal. El conductor iba con exceso de velocidad. ¿Cómo influye la conducta del peatón?","o":["La indemnización puede reducirse, porque la víctima se expuso imprudentemente al daño.","El conductor queda totalmente exento, porque la culpa de la víctima excluye la suya.","No influye, porque el conductor iba con exceso de velocidad y debe pagar el total."],"e":"Art. 2330 CC: la apreciación del daño está sujeta a reducción, si el que lo ha sufrido se expuso a él imprudentemente."},{"a":"C","u":"Responsabilidad Extracontractual","q":"Un trabajador de una empresa, mientras reparte productos, choca un vehículo por conducir sin cuidado. La víctima quiere demandar a la empresa. ¿Es posible?","o":["Sí, por la responsabilidad del empresario por el hecho de sus dependientes, que se presume.","No, porque solo responde el trabajador que causó el daño con su conducción descuidada.","Solo si se prueba que la empresa ordenó al trabajador conducir de esa manera."],"e":"Art. 2320 inc. 4 CC: los empresarios responden del hecho de sus dependientes mientras están bajo su cuidado. La empresa puede eximirse probando que no pudo impedir el hecho, y luego repetir contra el dependiente (art. 2325 CC)."},{"a":"C","u":"Contratos Parte General","q":"Carla y Jorge firman un documento privado en que se prometen comprar y vender un departamento, sin indicar plazo ni condición para celebrar la compraventa definitiva. ¿Es exigible la promesa?","o":["No, porque la promesa debe contener un plazo o condición que fije la época del contrato prometido.","Sí, porque la promesa consta por escrito y en ella las partes acordaron la cosa y el precio.","Sí, porque la promesa de compraventa es consensual y basta el acuerdo sobre la cosa."],"e":"Art. 1554 N° 3 CC. Sin plazo o condición, la promesa no produce obligación alguna."},{"a":"C","u":"Contratos Parte Especial","q":"Matías vende a su hermano un terreno mediante un documento firmado ante dos testigos, sin escritura pública. Después se arrepiente. ¿El contrato está perfecto?","o":["No: la venta de bienes raíces no se reputa perfecta mientras no se otorgue escritura pública.","Sí: la compraventa es consensual y se perfeccionó con el acuerdo en la cosa y el precio.","Sí: el documento firmado ante dos testigos suple la escritura pública entre parientes."],"e":"Además, la falta de instrumento público no puede suplirse por otra prueba (art. 1701 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"Elena vendió su casa avaluada en $100 millones a $40 millones a un comprador que se aprovechó de su urgencia. Han pasado dos años. ¿Qué puede hacer Elena?","o":["Ejercer la acción rescisoria por lesión enorme, pues recibió menos de la mitad del justo precio.","Pedir la nulidad absoluta del contrato por falta de precio real, que es requisito de existencia.","Nada, porque las partes fijan libremente el precio y la urgencia no vicia el consentimiento."],"e":"Arts. 1889, 1891 y 1896 CC. El comprador puede evitar la rescisión completando el justo precio con deducción de una décima parte (art. 1890 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"Un banco demanda al fiador de un crédito impago sin haber cobrado antes al deudor principal, que tiene bienes suficientes. ¿Qué puede oponer el fiador?","o":["El beneficio de excusión, para que primero se persigan los bienes del deudor principal.","El beneficio de inventario, para
