ntos accidentales (art. 1444 CC); excepcionalmente la ley los impone."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es el modo?","o":["La aplicación especial que debe darse a la cosa asignada o donada.","Un hecho futuro e incierto del que depende el nacimiento de un derecho.","Un hecho futuro y cierto del que depende el ejercicio de un derecho.","La forma en que debe cumplirse una obligación de hacer."],"e":"Art. 1089 CC."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es la ratificación de un acto relativamente nulo?","o":["La renuncia a pedir la nulidad, que sanea el vicio.","Un nuevo contrato que reemplaza y extingue al anterior.","Una declaración judicial que confirma la validez del acto.","La aprobación del acto por un tercero que no intervino en él."],"e":"Art. 1684 CC: la nulidad relativa puede sanearse por el lapso de tiempo o por la ratificación de las partes. La absoluta no puede ratificarse."},{"a":"C","u":"Acto Jurídico","q":"¿En qué contratos es la lesión enorme un vicio sancionado por el Código Civil?","o":["En la compraventa y permuta de inmuebles, entre otros.","En todos los contratos onerosos y conmutativos.","En todos los contratos gratuitos, sin excepción.","En los contratos celebrados por menores de edad."],"e":"Arts. 1888 y 1900 CC; también en la aceptación de una asignación (art. 1234), la partición (art. 1348), el mutuo con interés excesivo y la cláusula penal enorme (art. 1544)."},{"a":"C","u":"Bienes","q":"¿Qué son los bienes nacionales de uso público?","o":["Los que pertenecen a la nación y cuyo uso corresponde a todos los habitantes, como calles y plazas.","Los que pertenecen al Fisco y cuyo uso no corresponde generalmente a los habitantes del país.","Los que pertenecen a las municipalidades y se entregan en arriendo a los particulares.","Los que pertenecen a particulares pero están afectos por ley a un uso público permanente."],"e":"Art. 589 CC. Los bienes fiscales son los que pertenecen a la nación pero cuyo uso no pertenece generalmente a los habitantes."},{"a":"C","u":"Bienes","q":"¿Cuáles son los atributos del dominio?","o":["Uso, goce y disposición.","Posesión, tenencia y uso.","Uso, habitación y servidumbre.","Goce, prenda e hipoteca."],"e":"Art. 582 CC: gozar y disponer de la cosa arbitrariamente. La doctrina distingue uso, goce y disposición."},{"a":"C","u":"Bienes","q":"¿Cuáles son las características del dominio?","o":["Es real, absoluto, exclusivo y perpetuo.","Es personal, relativo, compartido y temporal.","Es real, relativo, transferible y temporal.","Es absoluto, inembargable, intransferible y perpetuo."],"e":"El dominio no se extingue por el no uso; solo se pierde si otro lo adquiere por prescripción."},{"a":"C","u":"Bienes","q":"¿Qué es la copropiedad o condominio?","o":["El dominio que dos o más personas tienen sobre una misma cosa, por cuotas.","El derecho exclusivo de una persona sobre un departamento de un edificio.","El usufructo que se constituye a favor de varias personas a la vez.","El derecho de una persona sobre la cosa de otra para usarla en común."],"e":"La comunidad es un cuasicontrato (art. 2304 CC)."},{"a":"C","u":"Bienes","q":"¿Cuáles son las clases de accesión?","o":["De frutos y continua.","Natural, civil e industrial.","Voluntaria, forzosa y legal.","Ordinaria y extraordinaria."],"e":"Arts. 643 y siguientes CC. Los frutos son naturales o civiles (arts. 644 y 647)."},{"a":"C","u":"Bienes","q":"¿Qué es la ocupación?","o":["Un modo de adquirir el dominio de cosas que no pertenecen a nadie, cuya adquisición no prohíbe la ley.","Un modo de adquirir el dominio de cualquier cosa por su tenencia material durante un año completo.","La tenencia de una cosa ajena sin título y por mera tolerancia o ignorancia del dueño.","La adquisición del dominio de una cosa abandonada por su dueño, a favor del Fisco."],"e":"Art. 606 CC."},{"a":"C","u":"Bienes","q":"¿Qué es el título translaticio de dominio?","o":["El que por su naturaleza sirve para transferir el dominio, como la venta.","El que por sí mismo constituye el dominio, como la ocupación o la accesión.","El que solo reconoce un dominio preexistente, como la transacción.","El que transfiere la posesión, pero no el dominio, como el arrendamiento."],"e":"Art. 703 CC."},{"a":"C","u":"Bienes","q":"¿Qué es la posesión inscrita?","o":["La de inmuebles, que se adquiere, conserva y pierde por inscripciones en el Conservador.","La de un mueble que consta en un registro público, como ocurre con los vehículos motorizados.","La posesión que se acredita con la declaración de testigos prestada ante un notario.","La posesión que se acredita con el pago de las contribuciones de bienes raíces."],"e":"Arts. 724, 728 y 924 CC: teoría de la posesión inscrita."},{"a":"C","u":"Bienes","q":"¿Qué requisito exige el art. 2505 CC para prescribir contra título inscrito?","o":["Un título inscrito.","Diez años de posesión material.","Buena fe y justo título.","Sentencia judicial previa."],"e":"Art. 2505 CC."},{"a":"C","u":"Bienes","q":"¿Qué es la propiedad fiduciaria?","o":["La sujeta al gravamen de pasar a otra persona si se cumple una condición.","La que corresponde a dos o más personas sobre una misma cosa, por cuotas.","La que se constituye sobre inmuebles en garantía de un crédito hipotecario.","La que tiene el Estado sobre los bienes nacionales de uso público."],"e":"Art. 733 CC."},{"a":"C","u":"Bienes","q":"¿Qué derechos reales de uso y goce limitados regula el Código Civil?","o":["El usufructo, el uso o habitación, y las servidumbres.","El arrendamiento, el comodato y el depósito irregular.","La prenda, la hipoteca, la anticresis y el censo.","La posesión, la mera tenencia, el precario y el uso."],"e":"Arts. 764, 811 y 820 CC."},{"a":"C","u":"Bienes","q":"¿Qué es el derecho real de habitación?","o":["El derecho de uso que recae sobre una casa, limitado a las necesidades del habitador y su familia.","El derecho del arrendatario a permanecer en el inmueble mientras pague puntualmente la renta.","El derecho del cónyuge a seguir habitando el bien familiar después de declarado el divorcio.","El derecho del dueño de una casa a impedir que terceros ingresen a ella sin su consentimiento."],"e":"Art. 811 CC. Es personalísimo, intransferible e intransmisible (art. 819 CC)."},{"a":"C","u":"Bienes","q":"¿Qué es la acción publiciana?","o":["La reivindicatoria del poseedor regular que perdió la posesión y estaba en vías de prescribir.","La acción del Fisco para recuperar los bienes nacionales de uso público ocupados por particulares.","La acción del comprador para que el vendedor lo defienda en caso de evicción de la cosa vendida.","La acción posesoria que tiene por objeto recuperar la posesión perdida por un acto de violencia."],"e":"Art. 894 CC."},{"a":"C","u":"Bienes","q":"¿Qué es la querella de restablecimiento?","o":["La del violentamente despojado de la posesión o mera tenencia, para que se restablezcan las cosas.","La acción reivindicatoria del dueño despojado de un inmueble por un tercero de buena fe.","La acción posesoria para conservar la posesión de un inmueble que ha sido turbada o molestada.","La acción que tiene un comunero para pedir judicialmente la división de la cosa común."],"e":"Art. 928 CC: prescribe en seis meses."},{"a":"C","u":"Bienes","q":"¿Qué son las cosas consumibles?","o":["Las que se destruyen por el primer uso conforme a su naturaleza.","Las que pueden reemplazarse por otras de igual género y calidad.","Las que no pueden transportarse de un lugar a otro sin detrimento.","Las que no tienen un valor económico apreciable en dinero."],"e":"Clasificación doctrinaria que se relaciona con el art. 575 CC, que las confunde con las fungibles."},{"a":"C","u":"Obligaciones","q":"¿Qué es una obligación?","o":["Un vínculo jurídico entre personas determinadas, por el que una debe dar, hacer o no hacer algo respecto de otra.","Un derecho real que recae sobre una cosa determinada y que se ejerce sin respecto a determinada persona.","Un deber moral de cumplir lo prometido, que no puede exigirse ante los tribunales de justicia.","Una carga que la ley impone a una persona en beneficio de la comunidad, sin un acreedor determinado."],"e":"Concepto doctrinario. Sus elementos son los sujetos, el objeto (prestación) y el vínculo jurídico."},{"a":"C","u":"Obligaciones","q":"Según su objeto, ¿cómo se clasifican las obligaciones?","o":["De dar, de hacer y de no hacer.","Civiles y naturales.","Puras y simples, y sujetas a modalidad.","Principales y accesorias."],"e":"Art. 1460 CC: toda declaración de voluntad debe tener por objeto una o más cosas que se trata de dar, hacer o no hacer."},{"a":"C","u":"Obligaciones","q":"¿Qué es una obligación de género?","o":["Aquella en que se debe indeterminadamente un individuo de una clase o género determinado.","Aquella en que se debe una especie o cuerpo cierto, individualmente determinada.","Aquella en que se deben varias cosas, cumpliéndose con una de ellas.","Aquella en que se debe una cosa, pero el deudor puede pagar con otra."],"e":"Art. 1508 CC. En ellas el acreedor no puede pedir determinadamente ningún individuo y el deudor cumple entregando uno de calidad a lo menos mediana (art. 1509 CC)."},{"a":"C","u":"Obligaciones","q":"¿Qué es una obligación simplemente conjunta o mancomunada?","o":["Aquella con varios sujetos y objeto divisible, en que cada deudor debe solo su cuota.","Aquella con varios sujetos en que cada deudor debe el total y cada acreedor puede pedir el total.","Aquella cuyo objeto no admite división, de modo que cada deudor puede ser obligado al total.","Aquella en que se deben varias cosas conjuntamente, y el deudor debe entregarlas todas a la vez."],"e":"Art. 1511 inc. 1 CC: es la regla general cuando hay pluralidad de sujetos."},{"a":"C","u":"Obligaciones","q":"¿Qué es una obligación indivisible?","o":["Aquella cuyo objeto no admite división, por lo que cada deudor puede ser obligado al total.","Aquella en que cada deudor debe el total por disposición de la convención, el testamento o la ley.","Aquella que no puede cumplirse por partes porque así lo pactaron expresamente las partes.","Aquella que no puede transmitirse a los herederos del deudor ni cederse a terceros."],"e":"Art. 1524 CC. La diferencia con la solidaridad está en la fuente: en la indivisibilidad es la naturaleza del objeto."},{"a":"C","u":"Obligaciones","q":"¿Qué es la condición suspensiva?","o":["La que, mientras no se cumple, suspende la adquisición del derecho.","La que, por su cumplimiento, extingue un derecho ya adquirido.","La que depende de la mera voluntad de la persona que se obliga.","La que consiste en un hecho futuro y cierto que necesariamente ocurrirá."],"e":"Art. 1479 CC. La resolutoria es la que, por su cumplimiento, extingue un derecho."},{"a":"C","u":"Obligaciones","q":"¿En qué se diferencia el plazo de la condición?","o":["El plazo es un hecho futuro y cierto; la condición es un hecho futuro e incierto.","El plazo es un hecho futuro e incierto; la condición es un hecho futuro y cierto.","El plazo afecta la existencia del derecho; la condición solo su ejercicio.","No hay diferencia: ambos son hechos futuros e inciertos."],"e":"Arts. 1473 y 1494 CC."},{"a":"C","u":"Obligaciones","q":"¿Cuál es la regla del art. 1489 CC sobre la acción resolutoria?","o":["El contratante diligente puede pedir a su arbitrio la resolución o el cumplimiento, con indemnización.","El contratante diligente solo puede pedir la resolución del contrato, pero nunca la indemnización.","El contratante diligente debe pedir primero el cumplimiento y, si no se obtiene, la resolución.","El contratante diligente solo puede pedir la indemnización, porque el contrato es ley para las partes."],"e":"Art. 1489 CC."},{"a":"C","u":"Obligaciones","q":"¿Qué es la mora del deudor?","o":["El retardo imputable en el cumplimiento, después de la interpelación.","Cualquier retardo en el cumplimiento, aunque se deba a un caso fortuito.","El incumplimiento total y definitivo de la obligación por parte del deudor.","La negativa injustificada del acreedor a recibir el pago que se le ofrece."],"e":"Art. 1551 CC."},{"a":"C","u":"Obligaciones","q":"¿Cuáles son los requisitos de la indemnización de perjuicios contractual?","o":["Incumplimiento imputable, perjuicio, causalidad y mora del deudor.","Contrato escrito, incumplimiento total y sentencia ejecutoriada previa.","Incumplimiento, daño moral y culpa grave probada por el acreedor.","Daño, dolo del deudor y notificación judicial previa del acreedor."],"e":"Arts. 1556 y 1557 CC."},{"a":"C","u":"Obligaciones","q":"¿Qué comprende la indemnización de perjuicios según el art. 1556 CC?","o":["El daño emergente y el lucro cesante.","Solo el daño emergente.","Solo el lucro cesante.","El daño emergente y la cláusula penal."],"e":"Art. 1556 CC. La jurisprudencia admite hoy también el daño moral en materia contractual."},{"a":"C","u":"Obligaciones","q":"¿Quién debe probar la diligencia o cuidado en materia contractual?","o":["El que ha debido emplearlo, esto es, el deudor.","El acreedor que alega el incumplimiento.","El juez, de oficio, en la sentencia.","Ninguna de las partes, porque la culpa se presume de derecho."],"e":"Art. 1547 inc. 3 CC: la prueba de la diligencia o cuidado incumbe al que ha debido emplearlo; la del caso fortuito al que lo alega."},{"a":"C","u":"Obligaciones","q":"¿Qué es el pago por consignación?","o":["El depósito de la cosa debida con las formalidades legales, ante la negativa o ausencia del acreedor.","El pago que hace un tercero por cuenta del deudor, subrogándose en los derechos del acreedor.","El pago que se hace con una cosa distinta de la debida, con el consentimiento del acreedor.","El abandono voluntario que el deudor hace de todos sus bienes a sus acreedores."],"e":"Art. 1599 CC."},{"a":"C","u":"Obligaciones","q":"¿Qué es la dación en pago?","o":["Un modo de extinguir en que el acreedor acepta una prestación distinta de la debida.","El pago parcial de la deuda, que el acreedor está siempre obligado a recibir.","El pago que hace un tercero, sin conocimiento ni consentimiento del deudor.","La entrega de bienes al acreedor en prenda mientras el deudor paga la deuda."],"e":"No está regulada en forma orgánica en el CC, pero se la reconoce en diversas normas (p. ej., art. 2382)."},{"a":"C","u":"Obligaciones","q":"¿Qué es la remisión?","o":["La renuncia gratuita que hace el acreedor de su crédito, total o parcialmente.","La sustitución de una obligación por otra nueva.","La reunión en una misma persona de las calidades de acreedor y deudor.","El pago que hace el deudor antes del vencimiento del plazo."],"e":"Arts. 1652 y siguientes CC. Si es gratuita, está sujeta a las reglas de la donación."},{"a":"C","u":"Obligaciones","q":"¿Cuáles son las prescripciones de corto tiempo del art. 2521 CC?","o":["Tres años para los honorarios de profesionales; dos años para los mercaderes que venden al menudeo.","Un año para los honorarios de profesionales; tres años para los mercaderes que venden al menudeo.","Cinco años para los honorarios de profesionales; un año para los mercaderes que venden al menudeo.","Tres años para los arriendos; cinco años para los honorarios de profesionales."],"e":"Arts. 2521 y 2522 CC."},{"a":"C","u":"Obligaciones","q":"¿Qué es la interversión de la prescripción de corto tiempo?","o":["Que, interrumpida, se transforma en una de largo tiempo.","Que se suspende a favor de los incapaces y de la mujer casada.","Que corre contra toda persona, sin excepción alguna.","Que debe ser declarada de oficio por el juez de la causa."],"e":"Art. 2523 CC."},{"a":"C","u":"Obligaciones","q":"¿A favor de quiénes se suspende la prescripción ordinaria?","o":["De los menores, los dementes, los sordos o sordomudos incapaces y los sujetos a tutela o curaduría.","De todas las personas, mientras no conozcan la existencia del derecho que les asiste.","Solo de los herederos del acreedor, mientras no se les conceda la posesión efectiva.","De los acreedores domiciliados en el extranjero, mientras no regresen al país."],"e":"Art. 2509 CC. La prescripción extraordinaria no se suspende (art. 2511 CC)."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es un delito civil?","o":["Un hecho ilícito cometido con intención de dañar, que causa daño a otro.","Un hecho ilícito cometido sin intención de dañar, por negligencia o descuido.","Un hecho tipificado y penado por el Código Penal, que se persigue de oficio.","Un incumplimiento doloso de un contrato, que obliga a indemnizar perjuicios."],"e":"Art. 2284 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es un cuasidelito civil?","o":["Un hecho culpable, sin intención de dañar, que causa daño a otro.","Un hecho ilícito cometido con la intención positiva de dañar a otro.","Un hecho lícito y voluntario que genera obligaciones entre las partes.","Un incumplimiento culpable de una obligación contractual previa."],"e":"Art. 2284 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es el daño emergente?","o":["El empobrecimiento real y efectivo del patrimonio de la víctima.","La utilidad o ganancia que la víctima deja de percibir por el hecho.","El dolor, la aflicción o el sufrimiento psíquico de la víctima.","El costo de los honorarios y las costas del juicio de indemnización."],"e":"El lucro cesante, en cambio, es la ganancia que se deja de obtener."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es el daño moral?","o":["El menoscabo de bienes extrapatrimoniales, como el dolor o la aflicción.","La pérdida económica que sufre la víctima por no poder trabajar.","El daño causado a los bienes inmuebles y muebles de la víctima.","El daño que se causa con la intención positiva de perjudicar a otro."],"e":"La jurisprudencia lo indemniza ampliamente en materia extracontractual."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Quién responde del daño causado por la ruina de un edificio por haber omitido las reparaciones necesarias?","o":["El dueño del edificio.","El arrendatario del edificio.","La municipalidad respectiva.","El constructor, en todo caso."],"e":"Art. 2323 CC. Si la ruina proviene de un vicio de construcción, responde el empresario o constructor (art. 2324 CC)."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Quién responde por el daño causado por un animal?","o":["El dueño, y también quien se sirve del animal ajeno, salvo prueba de que no hubo culpa.","Solo el dueño del animal, aunque esté al cuidado de otra persona al causar el daño.","Nadie, porque el daño causado por un animal constituye siempre un caso fortuito.","El veterinario que lo atendió por última vez, si no advirtió su peligrosidad."],"e":"Art. 2326 CC. Si el animal es fiero y no reporta utilidad para la guarda de un predio, responde siempre quien lo tenga (art. 2327 CC)."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es la relación de causalidad?","o":["El vínculo entre el hecho ilícito y el daño, que hace a éste consecuencia de aquél.","La relación de dependencia que existe entre el empleador y su trabajador.","La relación que existe entre la culpa del autor y la culpa de la víctima.","El vínculo contractual previo que existe entre el autor y la víctima."],"e":"Requisito de la responsabilidad que se desprende de los arts. 2314 y 2329 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Cuáles son causales de exención de responsabilidad extracontractual?","o":["El caso fortuito, el hecho de un tercero y la culpa exclusiva de la víctima.","La minoría de edad del autor mayor de dieciséis años y su falta de bienes.","El parentesco entre autor y víctima y la reparación posterior del daño.","La prescripción de la acción penal y el sobreseimiento del autor."],"e":"Excluyen la relación de causalidad o la culpa."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué responsabilidad tienen los padres por los hechos de sus hijos menores?","o":["Responden de los hijos menores que habitan con ellos, salvo que prueben que no pudieron impedirlo.","No responden nunca, porque cada persona responde solo de sus propios hechos y omisiones.","Responden siempre, sin que puedan probar que actuaron con la diligencia debida.","Solo responden si el hijo es menor de siete años, por ser incapaz de delito."],"e":"Art. 2320 inc. 2 CC. Responden siempre de los delitos o cuasidelitos de los hijos menores que conocidamente provengan de mala educación o hábitos viciosos que les han dejado adquirir (art. 2321 CC)."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué acción tiene quien paga el daño causado por un dependiente?","o":["La de reembolso contra el dependiente que actuó sin orden.","Ninguna, porque quien paga por el hecho ajeno lo hace por liberalidad.","La acción pauliana contra los bienes del dependiente insolvente.","La acción de nulidad del contrato de trabajo del dependiente."],"e":"Art. 2325 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es la acción popular del art. 2333 CC?","o":["La que tiene cualquier persona por un daño contingente que amenaza a personas indeterminadas.","La que tiene la víctima directa del daño en contra del autor del hecho ilícito.","La que tiene el Estado para recuperar los gastos de atención de salud de las víctimas.","La que tienen los herederos de la víctima fallecida para cobrar el daño moral propio."],"e":"Art. 2333 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"Los herederos de quien causó un daño por delito o cuasidelito:","o":["Están obligados a indemnizar, porque la obligación es transmisible.","No están obligados, porque la responsabilidad es personal del autor.","Solo están obligados si aceptaron la herencia sin beneficio de inventario.","Solo están obligados si eran mayores de edad al momento del hecho."],"e":"Art. 2316 CC: es obligado a la indemnización el que hizo el daño y sus herederos."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es un contrato bilateral?","o":["Aquel en que las partes contratantes se obligan recíprocamente.","Aquel que requiere el acuerdo de dos partes para formarse.","Aquel que se celebra entre dos personas solamente.","Aquel que produce efectos para dos terceros."],"e":"Art. 1439 CC. Todo contrato es acto jurídico bilateral; pero puede ser unilateral si solo una parte se obliga."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es un contrato aleatorio?","o":["El oneroso cuyo equivalente es una contingencia incierta de ganancia o pérdida.","El gratuito en que una parte se obliga sin recibir nada a cambio de la otra.","El que depende de una condición suspensiva pactada por las partes.","El que puede terminarse unilateralmente por cualquiera de las partes."],"e":"Art. 1441 CC. Ejemplos: seguro, renta vitalicia, juego y apuesta (art. 2258 CC)."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es un contrato real?","o":["El que requiere la entrega de la cosa para perfeccionarse.","El que recae exclusivamente sobre bienes inmuebles.","El que crea derechos reales sobre una cosa determinada.","El que debe celebrarse por escritura pública ante notario."],"e":"Art. 1443 CC. Ejemplos: mutuo, comodato, depósito y prenda civil."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es un contrato de adhesión?","o":["Aquel cuyas cláusulas redacta una parte y la otra solo puede aceptarlas o rechazarlas.","Aquel que se celebra por escrito, con la firma de dos testigos y ante un notario público.","Aquel que se forma por la adhesión sucesiva de nuevas partes a un contrato original.","Aquel que solo puede celebrarse con el Estado o con una empresa pública autónoma."],"e":"Está regulado especialmente en la Ley 19.496 sobre protección de los derechos de los consumidores."},{"a":"C","u":"Contratos Parte General","q":"¿Qué principio establece que los contratos solo producen efectos entre las partes?","o":["El efecto relativo del contrato.","La fuerza obligatoria del contrato.","La autonomía de la voluntad.","El consensualismo."],"e":"Se desprende de los arts. 1545 y 3 inc. 2 CC. Excepciones: estipulación a favor de otro, contrato colectivo, etc."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es el consensualismo?","o":["El principio de que los contratos se perfeccionan, por regla general, por el solo consentimiento.","El principio de que las partes pueden pactar cualquier cláusula que no esté prohibida por la ley.","El principio de que los contratos deben ejecutarse de buena fe por ambas partes.","El principio de que el contrato legalmente celebrado es una ley para los contratantes."],"e":"Las excepciones son los contratos reales y solemnes (art. 1443 CC)."},{"a":"C","u":"Contratos Parte General","q":"¿Cuáles son los elementos de la autonomía de la voluntad?","o":["Libertad de contratar o no, de elegir con quién y de fijar el contenido del contrato.","Libertad para elegir el tribunal, la ley aplicable y la moneda en que se pagará el contrato.","Libertad para contratar por escrito, verbalmente o por medios electrónicos, según convenga.","Libertad para renunciar a las normas de orden público y a las leyes imperativas."],"e":"La autonomía de la voluntad tiene como límites la ley, el orden público y las buenas costumbres."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es el contrato preparatorio?","o":["Aquel por el que las partes se obligan a celebrar otro contrato en el futuro.","Aquel que se celebra para preparar un juicio, como una medida prejudicial.","Aquel que regula las negociaciones previas, sin obligar a celebrar el contrato.","Aquel que solo produce efectos si lo aprueba un tercero ajeno a las partes."],"e":"La promesa (art. 1554 CC) es el contrato preparatorio por excelencia."},{"a":"C","u":"Contratos Parte General","q":"¿Cuál es la regla del art. 1563 CC sobre interpretación de los contratos?","o":["A falta de voluntad contraria, se está a la interpretación que mejor cuadre con la naturaleza del contrato.","Las cláusulas de un contrato deben interpretarse siempre en contra del acreedor que las redactó.","En caso de duda, debe estarse siempre a la interpretación que favorezca la nulidad del contrato.","El juez debe interpretar los contratos según la costumbre del lugar en que se celebraron."],"e":"Art. 1563 inc. 1 CC. El inc. 2 dispone que las cláusulas de uso común se presumen aunque no se expresen."},{"a":"C","u":"Contratos Parte General","q":"¿Cuándo se forma el consentimiento en los contratos entre presentes?","o":["Cuando la aceptación se da en el acto de conocerse la propuesta.","Cuando el oferente recibe la aceptación por escrito y firmada.","A las veinticuatro horas de haberse formulado la propuesta verbal.","Cuando las partes firman el contrato ante un notario público."],"e":"Art. 97 CCom: la propuesta verbal debe ser aceptada en el acto de ser conocida por la persona a quien se dirige."},{"a":"C","u":"Contratos Parte General","q":"¿En qué plazo debe aceptarse una oferta escrita hecha a una persona que reside en el mismo lugar?","o":["Dentro de veinticuatro horas.","Dentro de tres días hábiles.","Dentro de ocho días corridos.","Dentro de treinta días hábiles."],"e":"Art. 98 CCom: si reside en otro lugar, a vuelta de correo."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es la excepción de contrato no cumplido?","o":["La que permite no cumplir mientras el otro no cumpla o se allane a cumplir.","La que permite al deudor alegar la nulidad del contrato que no ha cumplido.","La que permite al acreedor cobrar intereses por el retardo en el cumplimiento.","La que permite al deudor pagar con una cosa distinta de la que se debe."],"e":"Se funda en el art. 1552 CC: la mora purga la mora."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuáles son los elementos esenciales de la compraventa?","o":["El consentimiento, la cosa y el precio.","La cosa, el precio y la escritura pública.","El consentimiento, la entrega y el pago.","La cosa, el precio y la inscripción."],"e":"Art. 1793 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué requisitos debe tener el precio en la compraventa?","o":["En dinero, real y serio, y determinado o determinable.","En dinero o en especies, y pagadero siempre al contado.","Igual o superior al avalúo fiscal vigente de la cosa vendida.","Fijado necesariamente por un perito tasador nombrado por el juez."],"e":"Arts. 1793, 1808 y 1809 CC. Si el precio consiste parte en dinero y parte en otra cosa, será permuta si la cosa vale más que el dinero (art. 1794 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Es válida la venta de cosa ajena?","o":["Sí, sin perjuicio de los derechos del dueño.","No, es nula absolutamente por falta de objeto.","No, adolece de objeto ilícito por ser cosa ajena.","Solo si el vendedor adquiere después la cosa."],"e":"Art. 1815 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuáles son las obligaciones del comprador?","o":["Pagar el precio y recibir la cosa.","Entregar la cosa y sanearla.","Pagar el precio e inscribir la cosa.","Recibir la cosa y conservarla."],"e":"Arts. 1871 y 1827 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el saneamiento de la evicción?","o":["Amparar al comprador privado de la cosa por sentencia, por causa anterior a la venta.","Devolver la cosa el comprador si no paga el precio en el plazo convenido en el contrato.","Responder el vendedor por los defectos ocultos de la cosa existentes al tiempo de la venta.","Entregar el vendedor la cosa en el lugar y en el tiempo convenidos con el comprador."],"e":"Art. 1838 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué son los vicios redhibitorios?","o":["Defectos ocultos de la cosa, existentes al venderse, que la hacen impropia para su uso natural.","Defectos visibles de la cosa, que el comprador pudo conocer fácilmente al tiempo de la venta.","Vicios del consentimiento del vendedor, como el error o la fuerza, al celebrar la venta.","Gravámenes que afectan a la cosa vendida, como una hipoteca o una servidumbre."],"e":"Art. 1858 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el pacto de retroventa?","o":["El vendedor se reserva la facultad de recobrar la cosa, reembolsando el precio estipulado.","El comprador puede devolver la cosa si no le agrada, dentro de un plazo convenido en el contrato.","Se resuelve de pleno derecho la venta si el comprador no paga el precio en el plazo convenido.","El vendedor promete vender la misma cosa a un tercero si el comprador no paga el saldo de precio."],"e":"Art. 1881 CC: el plazo no puede pasar de cuatro años desde la fecha del contrato (art. 1885 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuáles son las obligaciones del arrendador?","o":["Entregar la cosa, mantenerla en estado de servir y librar al arrendatario de turbaciones.","Pagar las contribuciones, los gastos comunes y los servicios básicos que consuma la cosa.","Recibir la renta mensual, restituir la garantía y otorgar recibo por cada pago recibido.","Conservar la cosa, hacer las reparaciones locativas y restituirla al término del contrato."],"e":"Art. 1924 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué reparaciones corresponden al arrendatario?","o":["Las reparaciones locativas.","Las reparaciones necesarias.","Las reparaciones útiles.","Todas las reparaciones."],"e":"Art. 1940 CC. Las necesarias corresponden al arrendador (art. 1927 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el desahucio?","o":["El aviso anticipado de una parte de su voluntad de poner término al arriendo.","La restitución del inmueble arrendado decretada por orden judicial.","El cobro judicial de las rentas de arrendamiento impagas por el arrendatario.","El abandono del inmueble por el arrendatario sin pagar las rentas adeudadas."],"e":"Art. 1951 CC y Ley 18.101."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es la sociedad?","o":["Un contrato en que dos o más personas ponen algo en común para repartirse los beneficios.","Un contrato en que una persona confía la gestión de uno o más negocios a otra persona.","Una comunidad que nace entre los herederos por la muerte de una persona.","Un contrato en que una persona se obliga a responder de una deuda ajena."],"e":"Art. 2053 CC. Forma una persona jurídica distinta de los socios individualmente considerados."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el contrato de depósito?","o":["Aquel en que se confía una cosa corporal a quien se encarga de guardarla y restituirla en especie.","Aquel en que se entrega una suma de dinero para que se restituya otra igual con intereses.","Aquel en que se entrega una cosa para que se use gratuitamente y luego se restituya.","Aquel en que se entrega una cosa mueble en garantía del cumplimiento de una obligación."],"e":"Art. 2211 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es la renta vitalicia?","o":["Un contrato aleatorio en que una parte se obliga, a título oneroso, a pagar a otra una renta periódica durante la vida de alguien.","Un contrato gratuito en que una persona se obliga a mantener a otra durante toda su vida, sin recibir nada a cambio.","Una pensión que el Estado paga a todas las personas mayores de sesenta y cinco años, cualquiera sea su situación.","Un contrato de seguro en que la aseguradora paga una suma de dinero a los beneficiarios al morir el asegurado."],"e":"Art. 2264 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es la fianza?","o":["Una obligación accesoria por la que se responde de una deuda ajena si el deudor no la cumple.","Una caución real que recae sobre bienes muebles que se entregan materialmente al acreedor.","Una obligación principal en que el fiador se obliga como único deudor directo del acreedor.","Un depósito de dinero que entrega el arrendatario para garantizar el pago de las rentas."],"e":"Art. 2335 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué características tiene la hipoteca?","o":["Es un derecho real, accesorio e indivisible, que da preferencia y persecución.","Es un derecho personal, principal y divisible, que no da preferencia alguna.","Es un contrato real que se perfecciona por la entrega del inmueble al acreedor.","Es una caución personal que recae sobre todo el patrimonio del deudor."],"e":"Arts. 2407, 2408 y 2428 CC. Es un crédito de tercera clase (art. 2477 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el mandato judicial?","o":["Un contrato solemne por el que se otorga a otro poder para representarlo en juicio.","Un contrato consensual por el que el juez delega sus funciones en un receptor judicial.","El encargo que el tribunal hace a un perito para que emita un informe técnico en el juicio.","Un contrato por el que un abogado asume la defensa de una persona ante los tribunales."],"e":"Arts. 6 y 7 CPC y Ley 18.120."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el contrato de transacción?","o":["Un contrato en que las partes terminan extrajudicialmente un litigio pendiente o precaven uno eventual.","Un contrato en que las partes someten un litigio a la decisión de un árbitro elegido por ellas.","Un acuerdo que las partes alcanzan ante el juez, a propuesta de éste, en la audiencia de conciliación.","Un contrato en que una parte renuncia gratuitamente a un derecho litigioso en favor de la otra."],"e":"Art. 2446 CC. Requiere concesiones recíprocas, según la doctrina y la jurisprudencia."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es la donación entre vivos?","o":["Un acto por el que una persona transfiere gratuita e irrevocablemente parte de sus bienes a otra, que la acepta.","Un acto por el que una persona dispone de sus bienes para que tenga efecto después de su muerte.","Un contrato por el que una persona entrega a otra una cosa para que la use gratuitamente y la restituya.","Un acto por el que una persona renuncia a una herencia que se le ha deferido en favor de otra."],"e":"Art. 1386 CC. Requiere insinuación (autorización judicial) cuando excede de dos centavos (art. 1401 CC)."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál de los siguientes es un título ejecutivo según el art. 434 CPC?","o":["Copia autorizada de escritura pública.","Copia simple de escritura pública.","Instrumento privado no reconocido.","Factura sin acuse de recibo."],"e":"Art. 434 N° 2 CPC. Otros títulos: sentencia firme, acta de avenimiento, instrumento privado reconocido, confesión judicial, títulos al portador y cualquier otro al que la ley dé fuerza ejecutiva."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué requisitos debe reunir la obligación para que proceda el juicio ejecutivo?","o":["Constar en título ejecutivo, ser líquida, actualmente exigible y no estar prescrita la acción.","Constar por escrito, ser de dinero, estar vencida y haber sido reconocida ante notario.","Constar en escritura pública, ser determinada, estar en mora y tener garantía real.","Constar en título ejecutivo, ser de hacer o no hacer y estar sujeta a condición."],"e":"Arts. 434, 437, 438 y 442 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿En qué plazo prescribe la acción ejecutiva?","o":["Tres años.","Cinco años.","Dos años.","Un año."],"e":"Art. 2515 CC y art. 442 CPC: el tribunal debe denegar la ejecución si la acción ejecutiva está prescrita."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cómo resuelve el tribunal la demanda ejecutiva?","o":["Examina el título y despacha o deniega la ejecución, sin audiencia ni notificación del demandado.","Confiere traslado al demandado por cinco días y luego resuelve si despacha la ejecución.","Cita a las partes a una audiencia de conciliación antes de despachar la ejecución.","Recibe la causa a prueba para acreditar la existencia de la deuda antes de despacharla."],"e":"Art. 441 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué contiene el mandamiento de ejecución y embargo?","o":["La orden de requerir de pago, la de embargar bienes y la designación de un depositario provisional.","La orden de notificar la demanda, la de citar a conciliación y la designación de un perito tasador.","La orden de requerir de pago, la de rematar los bienes y la designación de un martillero público.","La orden de arraigar al deudor, la de embargar sus bienes y la designación de un curador ad litem."],"e":"Art. 443 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué cuadernos se forman en el juicio ejecutivo de obligaciones de dar?","o":["El cuaderno ejecutivo y el de apremio.","El cuaderno de discusión y el de prueba.","El cuaderno principal y el de incidentes.","El cuaderno de embargo y el de tercerías."],"e":"Art. 458 CPC: se forma ramo separado con las diligencias relativas al embargo, su ampliación y el procedimiento de apremio."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuántas excepciones puede oponer el ejecutado según el art. 464 CPC?","o":["Dieciocho, taxativamente enumeradas.","Las que estime convenientes, sin límite.","Seis, las mismas del juicio ordinario.","Doce, más las que señalen las leyes especiales."],"e":"La enumeración del art. 464 CPC es taxativa: entre otras, incompetencia, falsedad del título, pago, novación, compensación, nulidad, transacción, prescripción y cosa juzgada."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál de las siguientes es una excepción admisible en el juicio ejecutivo?","o":["La falsedad del título.","La imprevisión.","La lesión enorme.","La excepción de contrato no cumplido."],"e":"Art. 464 N° 6 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cómo deben oponerse las excepciones en el juicio ejecutivo?","o":["Todas en un mismo escrito, expresando con claridad los hechos y los medios de prueba.","Separadamente, una por escrito, dentro del término de emplazamiento.","Verbalmente, en la audiencia del quinto día hábil después del requerimiento.","En la contestación de la demanda y luego en la dúplica, si son nuevas."],"e":"Art. 465 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué plazo tiene el ejecutante para responder la oposición?","o":["Cuatro días.","Seis días.","Tres días.","Diez días."],"e":"Art. 466 CPC: del escrito de oposición se da traslado al ejecutante para que dentro de cuatro días exponga lo que juzgue oportuno."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál es el término probatorio en el juicio ejecutivo?","o":["Diez días, ampliable hasta diez días más a petición del acreedor.","Veinte días, ampliable por acuerdo de las partes.","Ocho días, sin posibilidad de ampliación.","Quince días, ampliable a petición de cualquiera de las partes."],"e":"Art. 468 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué tipos de sentencia definitiva pueden dictarse en el juicio ejecutivo?","o":["Condenatoria (de pago o de remate) o absolutoria.","Declarativa, constitutiva o de condena.","Solo condenatoria, porque el título hace plena prueba.","Interlocutoria de primera o segunda clase."],"e":"Si se rechazan las excepciones, la sentencia manda seguir adelante con la ejecución (de pago si se embargó dinero; de remate si se embargaron otros bienes). Si se acogen, absuelve al ejecutado."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál de los siguientes bienes es inembargable según el art. 445 CPC?","o":["Los sueldos y pensiones que pagan el Estado y las municipalidades.","Los inmuebles cuyo avalúo fiscal sea superior a cien unidades de fomento.","Los vehículos motorizados inscritos a nombre del deudor en el Registro.","Las acciones de sociedades anónimas abiertas de propiedad del deudor."],"e":"Art. 445 N° 1 CPC. Tratándose de pensiones alimenticias decretadas judicialmente, puede embargarse hasta el 50% de las prestaciones."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué tercerías admite el juicio ejecutivo?","o":["De dominio, de posesión, de prelación y de pago.","De dominio, de nulidad, de prelación y de cosa juzgada.","Coadyuvante, excluyente e independiente.","De dominio y de posesión solamente."],"e":"Art. 518 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cómo se tramita la tercería de dominio?","o":["Como juicio ordinario, sin réplica ni dúplica.","Como incidente, en el cuaderno de apremio.","Por el procedimiento sumario, en audiencia verbal.","Por las reglas del juicio ejecutivo, con excepciones."],"e":"Art. 521 CPC. Las tercerías de posesión, prelación y pago se tramitan como incidente."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál es el mínimo de postura en el primer remate, salvo convenio de las partes?","o":["Dos tercios de la tasación.","La mitad de la tasación.","El total de la tasación.","Un tercio de la tasación."],"e":"Art. 493 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cómo puede prepararse la vía ejecutiva si el acreedor no tiene título ejecutivo?","o":["Por reconocimiento de firma, confesión de deuda o notificación del protesto, entre otras gestiones.","Por la declaración de testigos sobre la existencia de la deuda, prestada ante notario público.","Por una medida prejudicial precautoria de retención de bienes del futuro deudor ejecutado.","Por la inscripción de la deuda impaga en el Boletín Comercial durante a lo menos un año."],"e":"Arts. 434 N° 4 y 435 CPC. También procede la notificación de títulos a los herederos o la confrontación de títulos."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Qué efecto produce la sentencia del juicio ejecutivo respecto de un juicio ordinario posterior?","o":["Produce cosa juzgada, salvo reserva de acciones o excepciones para el ordinario.","No produce cosa juzgada, porque el juicio ejecutivo es de lato conocimiento.","Produce cosa juzgada solo respecto del ejecutado, nunca respecto del ejecutante.","Produce cosa juzgada solo si fue confirmada por la Corte de Apelaciones."],"e":"Art. 478 CPC."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Cuál es el plazo para oponer excepciones si el ejecutado es requerido de pago en el territorio jurisdiccional del tribunal?","o":["Ocho días.","Cuatro días.","Diez días.","Seis días."],"e":"Art. 459 CPC, modificado por la Ley 21.394."},{"a":"P","u":"Juicio Ejecutivo","q":"¿Desde cuándo corre el plazo para oponerse a la ejecución?","o":["Desde el día del requerimiento de pago.","Desde la notificación del mandamiento de embargo.","Desde que se practica el embargo de bienes.","Desde la notificación de la demanda por cédula."],"e":"Art. 462 CPC."},{"a":"P","u":"Juicio Sumario","q":"¿Cuándo se aplica el procedimiento sumario en forma general?","o":["Cuando la acción requiere, por su naturaleza, tramitación rápida para ser eficaz.","Cuando la cuantía del asunto no excede de quinientas unidades tributarias mensuales.","Cuando ambas partes lo solicitan de común acuerdo al presentar la demanda.","Cuando el demandado no tiene domicilio conocido dentro del territorio nacional."],"e":"Art. 680 inc. 1 CPC: aplicación general. El inc. 2 enumera casos de aplicación especial."},{"a":"P","u":"Juicio Sumario","q":"¿Cuál de estos asuntos se tramita por juicio sumario según el art. 680 CPC?","o":["El cobro de honorarios.","La partición de bienes.","La nulidad de un contrato.","La reivindicación de un inmueble."],"e":"Art. 680 N° 3 CPC, excepto el caso del art. 697. También: servidumbres legales, rendición de cuentas, depósito necesario, acciones ordinarias en que se convierten las ejecutivas, entre otros."},{"a":"P","u":"Juicio Sumario","q":"¿Cómo es el procedimiento sumario en cuanto a su forma?","o":["Verbal, aunque las partes pueden presentar minutas escritas.","Escrito, con demanda, contestación, réplica y dúplica.","Escrito, con demanda y contestación solamente.","Oral, con registro audiovisual obligatorio de todo el juicio."],"e":"Art. 682 CPC."},{"a":"P","u":"Juicio Sumario","q":"Deducida la demanda en juicio sumario, ¿a qué cita el tribunal?","o":["A la audiencia del quinto día hábil después de la última notificación.","A la audiencia del décimo día hábil después de la notificación.","A una audiencia de conciliación dentro de tercero día.","A contestar la demanda por escrito dentro de quince días."],"e":"Art. 683 CPC, ampliándose el plazo con la tabla de emplazamiento si el demandado no está en el lugar del juicio."},{"a":"P","u":"Juicio Sumario","q":"En el juicio sumario, ¿qué puede pedir el actor si el demandado no comparece a la audiencia?","o":["Que se acceda provisionalmente a lo pedido en la demanda.","Que se dicte de inmediato sentencia definitiva condenatoria.","Que se declare abandonado el procedimiento por su rebeldía.","Que se tenga por confeso al demandado de todos los hechos."],"e":"Art. 684 CPC: el demandado puede oponerse dentro de cinco días desde su notificación."},{"a":"P","u":"Juicio Sumario","q":"¿Cómo se rinde la prueba en el juicio sumario?","o":["En el plazo y la forma establecidos para los incidentes.","En el término probatorio ordinario de veinte días.","En una sola audiencia, sin término probatorio.","En el plazo que fijen las partes de común acuerdo."],"e":"Art. 686 CPC: término de ocho días, como en los incidentes (art. 90 CPC)."},{"a":"P","u":"Juicio Sumario","q":"¿Cómo se tramitan los incidentes en el juicio sumario?","o":["En la misma audiencia, junto con lo principal, sin paralizarlo.","En cuaderno separado, suspendiendo el curso de lo principal.","Como juicios independientes, ante el mismo tribunal de la causa.","Solo después de dictada y notificada la sentencia definitiva."],"e":"Art. 690 CPC."},{"a":"P","u":"Juicio Sumario","q":"¿En qué plazo debe dictarse la sentencia definitiva en el juicio sumario?","o":["Diez días desde la resolución que cita a oír sentencia.","Sesenta días desde que la causa queda en estado de sentencia.","Treinta días desde la última audiencia.","Quince días desde la contestación de la demanda."],"e":"Art. 688 CPC. Las demás resoluciones deben dictarse, a más tardar, dentro de segundo día."},{"a":"P","u":"Juicio Sumario","q":"¿En qué efecto es apelable la sentencia definitiva del juicio sumario?","o":["En ambos efectos, salvo que así se eludan sus resultados.","Solo en el efecto devolutivo, en todo caso y sin excepción.","Solo en el efecto suspensivo, en todo caso y sin excepción.","No es apelable, por la naturaleza breve del procedimiento."],"e":"Art. 691 CPC. Las demás resoluciones, incluida la que accede provisionalmente a la demanda, son apelables solo en el efecto devolutivo."},{"a":"P","u":"Juicio Sumario","q":"¿Puede sustituirse el procedimiento sumario por el ordinario?","o":["Sí, en los casos de aplicación general, si hay motivos fundados.","No, nunca, porque el procedimiento aplicable lo fija la ley.","Sí, siempre que lo pida el demandante antes de la audiencia.","Solo en segunda instancia, por resolución fundada de la Corte."],"e":"Art. 681 CPC: y a la inversa, un juicio iniciado como ordinario puede continuar como sumario si aparece la necesidad de aplicarlo."},{"a":"P","u":"Juicio Sumario","q":"¿Por qué procedimiento se tramita la acción de precario?","o":["Por el procedimiento sumario.","Por el juicio ordinario de mayor cuantía.","Por el procedimiento de arrendamiento de la Ley 18.101.","Por el juicio ejecutivo de obligaciones de dar."],"e":"Se tramita como juicio sumario por requerir tramitación rápida para ser eficaz (art. 680 inc. 1 CPC). El precario está definido en el art. 2195 inc. 2 CC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Cuáles son las clases de medidas prejudiciales?","o":["Preparatorias, probatorias y precautorias.","Conservativas, innovativas y anticipatorias.","Reales, personales y mixtas.","Ordinarias, extraordinarias y especiales."],"e":"Arts. 273, 281 y 279 CPC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Cuál es una medida prejudicial preparatoria del art. 273 CPC?","o":["La exhibición de la cosa objeto de la acción.","El secuestro de la cosa objeto de la demanda.","La inspección personal del tribunal en el lugar.","La retención de bienes determinados del demandado."],"e":"Art. 273 N° 2 CPC. Otras: declaración jurada sobre capacidad o personería, exhibición de sentencias, testamentos, libros de contabilidad, etc."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Cuál es una medida prejudicial probatoria?","o":["La inspección personal del tribunal, si los hechos pueden desaparecer.","La declaración jurada sobre la capacidad del futuro demandado para comparecer.","La prohibición de celebrar actos y contratos sobre bienes determinados.","La exhibición de los libros de contabilidad relativos al negocio."],"e":"Art. 281 CPC: inspección personal, informe de peritos o certificado de ministro de fe, cuando hay peligro inminente de daño o se trata de hechos que puedan fácilmente desaparecer."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué requisitos especiales exige el art. 279 CPC para las medidas prejudiciales precautorias?","o":["Motivos graves y calificados, monto determinado de los bienes y fianza o garantía suficiente.","Título ejecutivo, mora del deudor y notificación previa del futuro demandado por cédula.","Escritura pública, presunción grave del derecho y autorización del Ministerio Público.","Sentencia previa, motivos fundados y caución equivalente al doble del monto reclamado."],"e":"Art. 279 CPC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué debe expresar quien solicita una medida prejudicial?","o":["La acción que deducirá y someramente sus fundamentos.","Los medios de prueba de que se valdrá en el juicio.","El monto exacto de la indemnización que reclamará.","Los nombres y domicilios de los testigos que presentará."],"e":"Art. 287 CPC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Quién puede pedir medidas prejudiciales probatorias para preparar su defensa?","o":["Quien fundadamente tema ser demandado.","Solo el futuro demandante del juicio.","Solo el Ministerio Público, de oficio.","Solo quien tenga un título ejecutivo."],"e":"Art. 288 CPC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Cuándo procede el secuestro como medida precautoria?","o":["En el caso del art. 901 CC o en acciones sobre un mueble determinado que se tema perder o deteriorar.","Cuando el demandado tenga deudas impagas con otros acreedores registradas en el Boletín Comercial.","Cuando el demandado no tenga domicilio conocido dentro del territorio jurisdiccional del tribunal.","Cuando la demanda recaiga sobre un inmueble inscrito y se tema que el demandado lo hipoteque."],"e":"Art. 291 CPC."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué característica tienen las medidas precautorias según el art. 301 CPC?","o":["Son esencialmente provisionales.","Son definitivas una vez decretadas.","Son irrevocables durante el juicio.","Solo cesan con la sentencia definitiva."],"e":"Art. 301 CPC: deben hacerse cesar siempre que desaparezca el peligro que se ha procurado evitar o se otorguen cauciones suficientes."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Puede llevarse a efecto una medida precautoria antes de notificarse a la persona contra quien se dicta?","o":["Sí, por razones graves y orden del tribunal; caduca si no se notifica en cinco días.","No, nunca, porque se vulneraría el derecho a defensa del afectado por la medida.","Sí, siempre, y sin plazo alguno para notificar al afectado por la medida.","Solo si el demandante rinde caución equivalente al valor total de los bienes."],"e":"Art. 302 inc. 2 CPC. El tribunal puede ampliar el plazo de cinco días por motivos fundados."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué medida precautoria agregó la Ley 21.461 en materia de arrendamiento?","o":["La restitución anticipada del inmueble, en ciertos casos.","El arraigo del arrendatario moroso.","La retención de las remuneraciones del arrendatario.","La prohibición de arrendar a terceros."],"e":"La Ley 21.461 incorporó en la Ley 18.101 la posibilidad de solicitar la restitución anticipada del inmueble como medida precautoria."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuáles son los períodos del juicio ordinario de mayor cuantía?","o":["Discusión, conciliación, prueba y sentencia.","Demanda, defensa, alegatos y fallo final.","Instrucción, acusación y juicio oral público.","Preparación, discusión, ejecución y apremio."],"e":"La conciliación es obligatoria salvo excepciones (art. 262 CPC)."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué requisitos debe contener toda demanda según el art. 254 CPC?","o":["Tribunal, partes, exposición de hechos y derecho, y peticiones concretas.","Tribunal, cuantía, lista de testigos, documentos fundantes y dos firmas de abogado.","Demandado, monto de la deuda, título ejecutivo y domicilio del demandante.","Tribunal, fecha del hecho, nómina de testigos y propuesta de bases de arreglo."],"e":"Art. 254 CPC, además de los requisitos comunes de todo escrito (art. 30 CPC)."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué puede hacer el tribunal si la demanda no contiene las indicaciones de los N° 1, 2 y 3 del art. 254 CPC?","o":["No darle curso, expresando el defecto.","Rechazarla de plano en la sentencia definitiva.","Declararla nula de oficio, con costas.","Darle curso y corregirla en la sentencia."],"e":"Art. 256 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué ocurre si el demandado no contesta la demanda dentro del término de emplazamiento?","o":["El juicio sigue en su rebeldía y los hechos quedan controvertidos.","Se tiene por aceptada la demanda y se dicta sentencia de inmediato.","Se suspende el juicio hasta que el demandado comparezca personalmente.","El demandante debe probar solo los hechos que el demandado no reconoció."],"e":"En materia civil, el silencio del demandado importa una contestación ficta negativa: los hechos quedan controvertidos y deben probarse."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuál es el plazo para replicar y duplicar en el juicio ordinario?","o":["Seis días cada uno.","Tres días cada uno.","Diez días cada uno.","Ocho días cada uno."],"e":"Art. 311 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué recurso procede contra la resolución que recibe la causa a prueba?","o":["Reposición, y apelación subsidiaria, en tres días.","Apelación directa, dentro de cinco días hábiles.","Casación en la forma, dentro de quince días.","Ninguno, porque es una resolución inapelable."],"e":"Art. 319 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuántos testigos puede presentar cada parte por cada hecho que deba acreditarse?","o":["Seis testigos.","Cuatro testigos.","Diez testigos.","Ocho testigos."],"e":"Art. 372 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"Vencido el término probatorio, ¿qué plazo tienen las partes para hacer observaciones a la prueba?","o":["Diez días.","Seis días.","Quince días.","Cinco días."],"e":"Art. 430 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué son las medidas para mejor resolver?","o":["Diligencias que el juez puede decretar de oficio dentro del plazo para dictar sentencia.","Diligencias probatorias que las partes pueden pedir después de vencido el término probatorio.","Medidas precautorias que se decretan para asegurar el cumplimiento de la sentencia definitiva.","Resoluciones que el tribunal dicta para corregir los errores de forma de la sentencia definitiva."],"e":"Art. 159 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué valor probatorio tiene el instrumento público en juicio?","o":["Hace plena fe en cuanto al hecho de haberse otorgado y su fecha, pero no en la verdad de las declaraciones.","Hace plena fe en cuanto a la verdad de todas las declaraciones de las partes, respecto de cualquier persona.","Solo tiene valor de base de presunción judicial, que el juez aprecia libremente.","No tiene valor probatorio si no es reconocido por la parte contra quien se presenta."],"e":"Art. 1700 CC: en cuanto a la verdad de las declaraciones, hace plena fe solo contra los declarantes."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué plazo tiene la parte para objetar un documento acompañado en el juicio, por regla general?","o":["Tres días.","Seis días.","Diez días.","Cinco días."],"e":"Arts. 342 N° 3 y 346 N° 3 CPC: se acompañan con citación, y la parte contraria tiene tres días para objetarlos."},{"a":"P","u":"Procesal Penal","q":"¿A quién corresponde dirigir en forma exclusiva la investigación penal?","o":["Al Ministerio Público.","Al juez de garantía.","A la policía.","Al tribunal oral."],"e":"Art. 3 CPP y art. 83 CPR."},{"a":"P","u":"Procesal Penal","q":"¿Qué función cumple el juez de garantía durante la investigación?","o":["Velar por los derechos del imputado y autorizar diligencias que los afecten.","Dirigir la investigación y dar instrucciones directas a la policía.","Formular la acusación contra el imputado al cierre de la investigación.","Dictar la sentencia definitiva en el juicio oral contra el acusado."],"e":"Arts. 9, 10 y 70 CPP y art. 14 COT."},{"a":"P","u":"Procesal Penal","q":"¿Qué es la formalización de la investigación?","o":["La comunicación del fiscal al imputado, ante el juez de garantía, de que lo investiga por delitos determinados.","La resolución del juez de garantía que ordena al fiscal iniciar una investigación por delitos determinados.","La presentación de la querella por la víctima ante el juez de garantía.","La acusación que el fiscal presenta al cerrar la investigación."],"e":"Art. 229 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Cuál es el plazo máximo de la investigación formalizada?","o":["Dos años desde la formalización.","Un año desde la formalización.","Seis meses desde la formalización.","Tres años desde la formalización."],"e":"Art. 247 CPP. El juez de garantía puede además fijar un plazo judicial menor (art. 234 CPP)."},{"a":"P","u":"Procesal Penal","q":"¿Qué es la flagrancia?","o":["La situación de quien está cometiendo un delito o acaba de cometerlo, entre otros casos legales.","La situación de quien tiene una orden de detención pendiente por un delito cometido antes.","La situación del imputado que no comparece a la audiencia sin causa debidamente justificada.","La situación de quien es sorprendido portando armas, aunque no se haya cometido delito alguno."],"e":"Art. 130 CPP."},{"a":"P","u":"Procesal Penal","q":"En caso de detención en flagrancia, ¿en qué plazo máximo debe ser conducido el detenido ante el juez?","o":["Veinticuatro horas.","Cuarenta y ocho horas.","Doce horas.","Setenta y dos horas."],"e":"Art. 131 CPP. La policía debe informar al Ministerio Público dentro de doce horas."},{"a":"P","u":"Procesal Penal","q":"¿Hasta cuánto puede ampliarse la detención en la audiencia de control para preparar la formalización?","o":["Hasta tres días.","Hasta cinco días.","Hasta diez días.","Hasta veinticuatro horas."],"e":"Art. 132 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Cuál es la medida cautelar personal más gravosa del proceso penal?","o":["La prisión preventiva.","El arresto domiciliario total.","La prohibición de salir del país.","La sujeción a vigilancia de una institución."],"e":"Art. 139 CPP: procede cuando las demás medidas cautelares personales son estimadas insuficientes."},{"a":"P","u":"Procesal Penal","q":"¿Qué requisitos exige el art. 140 CPP para decretar la prisión preventiva?","o":["Antecedentes del delito, presunción de participación y necesidad de cautela.","Antecedentes del delito, confesión del imputado y peligro para la víctima.","Formalización, acusación presentada y riesgo cierto de fuga del imputado.","Querella de la víctima, antecedentes del delito y una condena anterior."],"e":"Art. 140 letras a), b) y c) CPP: además, la investigación debe estar formalizada."},{"a":"P","u":"Procesal Penal","q":"¿Qué es el principio de oportunidad?","o":["La facultad del fiscal de no perseguir o abandonar la persecución de hechos que no comprometen gravemente el interés público.","La facultad del juez de garantía de suspender el procedimiento cuando la pena probable no excede de tres años.","La facultad de la víctima de acordar con el imputado la reparación del daño causado por el delito investigado.","La facultad del fiscal de cerrar provisionalmente una investigación cuando no hay antecedentes para esclarecer los hechos."],"e":"Art. 170 CPP: no procede si la pena mínima excede de presidio o reclusión menores en su grado mínimo o se trata de un delito cometido por un funcionario público en el ejercicio de sus funciones."},{"a":"P","u":"Procesal Penal","q":"¿Qué es el archivo provisional?","o":["La facultad del fiscal de archivar, antes de intervenir el juez, investigaciones sin antecedentes útiles.","La facultad del juez de garantía de suspender el procedimiento hasta que se cumpla una condición.","La facultad del fiscal de no iniciar la investigación porque el hecho no es constitutivo de delito.","La resolución judicial que pone término al procedimiento penal con efecto de cosa juzgada."],"e":"Art. 167 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Cuáles son las salidas alternativas en el proceso penal?","o":["La suspensión condicional y los acuerdos reparatorios.","El procedimiento abreviado y el simplificado.","El archivo provisional y el principio de oportunidad.","El sobreseimiento definitivo y el temporal."],"e":"Arts. 237 y 241 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué pena máxima debe requerir el fiscal para que proceda la suspensión condicional del procedimiento?","o":["Una pena que no exceda de tres años de privación de libertad.","Una pena que no exceda de cinco años de privación de libertad.","Una pena que no exceda de quinientos cuarenta y un días.","Una pena que no exceda de diez años de privación de libertad."],"e":"Art. 237 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué puede hacer el fiscal dentro de los diez días siguientes al cierre de la investigación?","o":["Pedir sobreseimiento, acusar o comunicar la decisión de no perseverar.","Formalizar la investigación, pedir prisión preventiva o archivar la causa.","Reabrir la investigación, pedir nuevas diligencias o citar a juicio oral.","Dictar sentencia, aplicar el principio de oportunidad o suspender el juicio."],"e":"Art. 248 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué tribunal dicta el auto de apertura del juicio oral?","o":["El juez de garantía, al término de la audiencia de preparación.","El tribunal de juicio oral en lo penal, al iniciar el juicio.","La Corte de Apelaciones respectiva, a petición del fiscal.","El fiscal regional, al aprobar la acusación."],"e":"Art. 277 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Cómo valora la prueba el tribunal oral en lo penal?","o":["Con libertad, sin contradecir la lógica, la experiencia ni la ciencia afianzada.","Conforme a las reglas de la prueba legal o tasada del Código de Procedimiento Civil.","En conciencia, sin necesidad de fundamentar las razones de su decisión de condena.","Conforme a la sana crítica, pero solo respecto de la prueba pericial rendida."],"e":"Art. 297 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué estándar de convicción exige el CPP para condenar?","o":["Más allá de toda duda razonable.","Preponderancia de la prueba rendida.","Presunción grave, precisa y concordante.","Plena prueba conforme a la ley."],"e":"Art. 340 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Para qué penas procede el procedimiento abreviado?","o":["Cuando el fiscal requiere una pena privativa de libertad no superior a diez años de presidio mayor en su grado mínimo.","Cuando el fiscal requiere una pena privativa de libertad no superior a cinco años de presidio menor en su grado máximo.","Cuando el fiscal requiere una pena privativa de libertad no superior a tres años, sin importar el delito.","Solo para las faltas y los simples delitos que tengan asignada pena de multa."],"e":"Art. 406 CPP: el imputado debe aceptar expresamente los hechos y los antecedentes de la investigación."},{"a":"P","u":"Procesal Penal","q":"¿Qué recurso procede contra la sentencia definitiva del tribunal de juicio oral en lo penal?","o":["El recurso de nulidad.","El recurso de apelación.","El recurso de casación en el fondo.","El recurso de queja."],"e":"Las resoluciones del tribunal oral son inapelables (art. 364 CPP); la sentencia definitiva se impugna por el recurso de nulidad (art. 372 CPP)."},{"a":"P","u":"Procesal Penal","q":"¿Cuál es el plazo para interponer el recurso de nulidad, tras la Ley 21.694?","o":["Quince días.","Diez días.","Cinco días.","Treinta días."],"e":"Art. 372 CPP vigente: con un día adicional por cada dos de exceso si el juicio duró más de cinco días, sin superar treinta días."},{"a":"P","u":"Procesal Penal","q":"¿Cuáles son delitos de acción penal privada según el art. 55 CPP?","o":["La calumnia y la injuria, entre otros.","Las lesiones menos graves y las amenazas.","El hurto y la estafa de menor cuantía.","La violación de domicilio y el daño."],"e":"Art. 55 CPP. Las lesiones menos graves, la violación de domicilio y las amenazas son de acción pública previa instancia particular (art. 54 CPP)."},{"a":"P","u":"Procesal Penal","q":"¿Qué principio establece el art. 4 CPP?","o":["La presunción de inocencia: nadie es considerado culpable mientras no sea condenado por sentencia firme.","La exclusividad de la investigación: solo el Ministerio Público dirige la investigación.","El juicio previo: nadie puede ser condenado sino por sentencia fundada de un tribunal imparcial.","La única persecución: nadie puede ser perseguido más de una vez por el mismo hecho."],"e":"Art. 4 CPP."},{"a":"P","u":"Procesal Penal","q":"¿Qué tribunal conoce del procedimiento simplificado?","o":["El juez de garantía.","El tribunal de juicio oral en lo penal.","El juez de policía local.","La Corte de Apelaciones."],"e":"Art. 14 letra d) COT y arts. 388 y siguientes CPP."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿De qué trata la Ley 21.394?","o":["Reforma la justicia civil, penal y orgánica para enfrentar la situación posterior a la pandemia.","Crea los tribunales de familia y regula el procedimiento de mediación familiar obligatoria previa.","Establece el matrimonio entre personas del mismo sexo y modifica las normas de filiación vigentes.","Crea el Registro Nacional de Deudores de Pensiones de Alimentos y sus efectos en los trámites."],"e":"La Ley 21.394 (D.O. 30/11/2021) modificó, entre otros, el CPC, el COT y el CPP para enfrentar la mayor carga de causas tras el estado de excepción por la pandemia."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué modificó la Ley 21.394 en la notificación del art. 44 CPC?","o":["Eliminó la necesidad de una nueva resolución que autorice la notificación subsidiaria.","Exigió que la notificación subsidiaria se haga siempre por carta certificada.","Estableció que la notificación subsidiaria solo procede con autorización del juez.","Reemplazó la notificación subsidiaria por la notificación por avisos."],"e":"Art. 44 CPC: el receptor procede en la misma diligencia, sin necesidad de nueva orden del tribunal."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué exige hoy el art. 49 CPC a los abogados, tras la Ley 21.394?","o":["Designar un medio electrónico de notificación.","Designar domicilio en la comuna del tribunal.","Firmar sus escritos con firma electrónica simple.","Comparecer personalmente a todas las audiencias."],"e":"Art. 49 CPC: bajo apercibimiento de notificarles por el estado diario."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué cambio introdujo la Ley 21.394 en el plazo para oponerse a la ejecución?","o":["Lo fijó en ocho días si el requerimiento es dentro del territorio del tribunal.","Lo redujo a cuatro días si el requerimiento es en la comuna asiento del tribunal.","Lo amplió a quince días en todo caso, cualquiera sea el lugar del requerimiento.","Lo fijó en diez días más la tabla de emplazamiento, en todo caso y sin distinción."],"e":"Art. 459 CPC."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué plazo de emplazamiento fijó la Ley 21.394 en el juicio ordinario si el demandado es notificado en el territorio jurisdiccional del tribunal?","o":["Dieciocho días, sin distinguir comunas.","Quince días, más tres si es fuera de la comuna.","Veinte días, sin distinguir comunas.","Diez días, más la tabla de emplazamiento."],"e":"Art. 258 CPC."},{"a":"P","u":"Recursos","q":"¿Qué es un recurso procesal?","o":["El medio que la ley da a la parte agraviada para obtener la modificación o invalidación de una resolución.","El escrito con que el demandado responde a la demanda dentro del término de emplazamiento legal.","La facultad del tribunal de revisar de oficio sus propias resoluciones en cualquier momento del juicio.","El medio que la ley concede a los terceros para intervenir en un juicio seguido entre otras personas."],"e":"Concepto doctrinario. El presupuesto común de los recursos es el agravio."},{"a":"P","u":"Recursos","q":"¿Qué es el agravio?","o":["El perjuicio que una resolución causa a una parte al no acoger sus pretensiones.","El vicio de forma que afecta a una resolución y la hace anulable de oficio.","El error de derecho en que incurre el tribunal al interpretar y aplicar la ley.","El daño que el litigante temerario causa a su contraparte con el juicio."],"e":"Es requisito para recurrir, por ejemplo, de apelación y de casación."},{"a":"P","u":"Recursos","q":"¿Contra qué resoluciones procede el recurso de reposición, por regla general?","o":["Contra los autos y decretos.","Contra las sentencias definitivas.","Contra las sentencias interlocutorias.","Contra las sentencias de segunda instancia."],"e":"Art. 181 CPC. Excepcionalmente procede contra ciertas sentencias interlocutorias, como la que recibe la causa a prueba (art. 319)."},{"a":"P","u":"Recursos","q":"¿Cuál es el plazo para interponer el recurso de reposición, por regla general?","o":["Cinco días.","Tres días.","Diez días.","Quince días."],"e":"Art. 181 CPC: dentro de cinco días fatales después de notificado. Existen reposiciones especiales con plazo de tres días."},{"a":"P","u":"Recursos","q":"¿Cuál es el objeto del recurso de apelación?","o":["Obtener que el tribunal superior enmiende, con arreglo a derecho, la resolución del inferior.","Obtener que el mismo tribunal que dictó la resolución la modifique o la deje sin efecto.","Obtener la invalidación de una sentencia por haberse dictado con infracción de ley.","Obtener que la Corte Suprema uniforme la jurisprudencia sobre una materia."],"e":"Art. 186 CPC."},{"a":"P","u":"Recursos","q":"¿Contra qué resoluciones procede la apelación según el art. 187 CPC?","o":["Contra sentencias definitivas e interlocutorias de primera instancia, salvo norma en contrario.","Contra todas las resoluciones dictadas en el juicio, sin excepción alguna, en cualquier instancia.","Solo contra las sentencias definitivas de primera instancia, y nunca contra las interlocutorias.","Contra las sentencias de segunda instancia dictadas por las Cortes de Apelaciones en sala."],"e":"Art. 187 CPC. Los autos y decretos son apelables solo si alteran la sustanciación del juicio o recaen sobre trámites no ordenados por la ley, y en subsidio de la reposición (art. 188 CPC)."},{"a":"P","u":"Recursos","q":"¿En qué efectos puede concederse la apelación?","o":["En el devolutivo, o en ambos efectos.","Solo en el efecto suspensivo, siempre.","En el efecto extensivo o en el diferido.","Solo en el efecto devolutivo, siempre."],"e":"Arts. 191 a 195 CPC. La regla general es que se conceda en ambos efectos (art. 195)."},{"a":"P","u":"Recursos","q":"¿Qué es la orden de no innovar?","o":["La resolución del tribunal de alzada que suspende los efectos de la resolución recurrida.","La resolución del tribunal inferior que prohíbe celebrar actos sobre la cosa litigiosa.","La medida precautoria que impide al demandado enajenar sus bienes durante el juicio.","La resolución que impide presentar escritos después de la citación para sentencia."],"e":"Art. 192 CPC: procede cuando la apelación se concede solo en el efecto devolutivo."},{"a":"P","u":"Recursos","q":"¿Qué tribunal conoce en segunda instancia de la apelación de una sentencia de un juez de letras?","o":["La Corte de Apelaciones respectiva.","La Corte Suprema.","Otro juez de letras del mismo territorio.","El mismo juez que dictó la sentencia."],"e":"Art. 63 N° 3 COT. El tribunal a quo concede o deniega el recurso; el tribunal ad quem lo conoce y falla."},{"a":"P","u":"Recursos","q":"¿Cómo se clasifica el recurso de casación?","o":["En casación en la forma y casación en el fondo.","En casación ordinaria y extraordinaria.","En casación civil y casación penal.","En casación de oficio y a petición de parte."],"e":"Art. 765 CPC."},{"a":"P","u":"Recursos","q":"¿Contra qué resoluciones procede la casación en el fondo?","o":["Contra definitivas e interlocutorias inapelables que terminen el juicio, dictadas por Cortes o árbitros de segunda instancia.","Contra todas las sentencias definitivas de primera instancia dictadas por los jueces de letras del territorio.","Contra los autos y decretos que alteran la sustanciación regular del juicio y causan agravio a las partes.","Contra las sentencias definitivas dictadas por la Corte Suprema al conocer de un recurso de queja."],"e":"Art. 767 CPC. Debe fundarse en una infracción de ley que haya influido sustancialmente en lo dispositivo del fallo."},{"a":"P","u":"Recursos","q":"¿Contra qué resoluciones procede la casación en la forma?","o":["Contra definitivas, e interlocutorias que pongan término al juicio o hagan imposible su continuación.","Solo contra las sentencias definitivas de segunda instancia dictadas por las Cortes de Apelaciones.","Contra los autos y decretos que alteren la sustanciación regular del juicio y causen agravio.","Contra todas las resoluciones dictadas sin emplazamiento de alguna de las partes del juicio."],"e":"Art. 766 CPC. Excepcionalmente, contra ciertas interlocutorias de segunda instancia dictadas sin emplazamiento."},{"a":"P","u":"Recursos","q":"¿Cuál de las siguientes es una causal de casación en la forma?","o":["Haberse dado la sentencia ultra petita.","Haberse aplicado mal una norma del Código Civil.","Haberse valorado erróneamente la prueba testimonial.","Haberse condenado en costas a la parte vencida."],"e":"Art. 768 N° 4 CPC: haber sido dada ultra petita, esto es, otorgando más de lo pedido o extendiéndola a puntos no sometidos a la decisión del tribunal."},{"a":"P","u":"Recursos","q":"¿Qué requisito de admisibilidad especial exige la casación en la forma?","o":["Haber reclamado del vicio oportunamente y en todos sus grados.","Haber consignado una suma equivalente al monto de lo disputado.","Haber obtenido autorización previa de la Corte para recurrir.","Haber presentado el recurso con la firma de dos abogados."],"e":"Art. 769 CPC, salvo las excepciones que la misma norma señala."},{"a":"P","u":"Recursos","q":"¿Cuál es el plazo para interponer el recurso de casación?","o":["Quince días desde la notificación de la sentencia.","Diez días desde la notificación de la sentencia.","Cinco días desde la notificación de la sentencia.","Treinta días desde la notificación de la sentencia."],"e":"Art. 770 CPC. Si se interponen ambos recursos, deben hacerse conjuntamente."},{"a":"P","u":"Recursos","q":"¿Qué es la casación de oficio?","o":["La facultad del tribunal que conoce de un recurso de anular la sentencia por un vicio de forma manifiesto.","La facultad de cualquier tribunal de anular sus propias resoluciones cuando advierte un error de hecho.","El recurso que el fiscal judicial interpone en el solo interés de la ley ante la Corte Suprema.","La facultad de la Corte Suprema de revisar cualquier sentencia firme, aunque no haya sido recurrida."],"e":"Art. 775 CPC: el tribunal debe oír sobre este punto a los abogados que concurran a alegar."},{"a":"P","u":"Normas Comunes","q":"¿Qué resoluciones producen la acción o excepción de cosa juzgada?","o":["Las sentencias definitivas o interlocutorias firmes.","Todas las resoluciones firmes, incluidos autos y decretos.","Solo las sentencias definitivas de segunda instancia.","Solo las sentencias que acogen la demanda."],"e":"Art. 175 CPC."},{"a":"P","u":"Normas Comunes","q":"¿Qué requisitos exige el art. 177 CPC para que proceda la excepción de cosa juzgada?","o":["Identidad legal de personas, de cosa pedida y de causa de pedir.","Identidad de tribunal, de procedimiento y de abogados patrocinantes.","Identidad de las partes, del tribunal y del número de la causa.","Identidad de la cosa pedida, de la cuantía y del juez que falló."],"e":"Art. 177 CPC: la llamada triple identidad."},{"a":"P","u":"Normas Comunes","q":"¿A quién corresponde la acción de cosa juzgada?","o":["A quien obtuvo a su favor la declaración de un derecho en el juicio.","A cualquier persona que tenga interés en el cumplimiento del fallo.","Solo al demandado que obtuvo una sentencia absolutoria a su favor.","Al tribunal que dictó la sentencia, que debe ejecutarla de oficio."],"e":"Art. 176 CPC."},{"a":"P","u":"Normas Comunes","q":"¿Qué parte de la sentencia definitiva contiene la decisión del asunto controvertido?","o":["La parte resolutiva.","La parte expositiva.","La parte considerativa.","El encabezamiento."],"e":"Art. 170 N° 6 CPC. La parte expositiva comprende los N° 1 a 3 y la considerativa los N° 4 y 5."},{"a":"P","u":"Normas Comunes","q":"¿Qué deben contener las consideraciones de la sentencia definitiva según el art. 170 CPC?","o":["Los fundamentos de hecho y de derecho, y las leyes o principios de equidad que aplica.","Solo las normas legales aplicables, sin analizar los hechos ni la prueba rendida.","Un resumen de las alegaciones de los abogados y de los escritos de las partes.","La opinión del juez sobre la conducta procesal y la buena fe de las partes."],"e":"Art. 170 N° 4 y 5 CPC."},{"a":"P","u":"Normas Comunes","q":"¿Qué significa que una diligencia se decrete «con citación»?","o":["Que no puede cumplirse sino pasados tres días desde la notificación de la contraria, que puede oponerse.","Que puede cumplirse de inmediato, sin necesidad de notificar previamente a la parte contraria.","Que requiere la presencia personal de la parte contraria en la diligencia, bajo sanción de nulidad.","Que debe resolverse previo traslado y audiencia de la parte contraria, como un incidente."],"e
