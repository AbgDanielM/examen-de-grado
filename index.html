<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen de Grado</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#162854">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Examen de Grado">
<meta name="description" content="Ensayos de alternativas, definiciones legales y casos prácticos de Derecho Civil y Procesal para preparar el examen de grado. Plataforma independiente.">
<style>
:root{
  --navy:#162854; --navy2:#24467e; --gold:#f0c45a;
  --bg:#f4f1ea; --card:#ffffff; --ink:#1e2433; --muted:#5d6478; --line:#e3e6ee; --soft:#e6ebf6;
  --ok:#1f7a4a; --ok-soft:#e7f4ec; --bad:#c0392b; --bad-soft:#fbe9e7;
  --shadow:0 2px 12px rgba(22,40,84,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;height:56px;display:flex;align-items:center;justify-content:center;padding:0 56px;padding-top:env(safe-area-inset-top);box-sizing:content-box}
.topbar h1{margin:0;font-size:1.1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tb-btn{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb-btn svg{width:24px;height:24px}
.hero{background:var(--navy);color:#fff;text-align:center;padding:14px 22px 50px}
.hero h2{margin:0;font-size:1.7rem;line-height:1.15;font-weight:900;letter-spacing:-.3px}
.hero h2 span{color:var(--gold)}
.hero p{margin:8px 0 0;font-size:.92rem;opacity:.85}
.hero .cnt{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .cnt div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;min-width:84px}
.hero .cnt b{display:block;font-size:1.3rem;color:var(--gold);line-height:1.1}
.hero .cnt small{font-size:.72rem;opacity:.85}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-28px;padding:16px 14px 30px;position:relative}
.wrap{max-width:720px;margin:0 auto}
.tile{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:16px 16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);position:relative}
.tile:active{transform:scale(.99)}
.tile.hl{background:var(--soft)}
.tile .ic{flex:0 0 44px;height:44px;border-radius:14px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:26px;height:26px}
.tile h3{margin:0 0 3px;font-size:1.08rem;font-weight:800;color:var(--navy)}
.tile p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.38}
.tile .badge{position:absolute;right:14px;top:-8px;background:var(--gold);color:var(--navy);font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:7px}
.notice{font-size:.8rem;color:var(--muted);text-align:center;margin:18px 6px 0;line-height:1.5}
.notice a{color:inherit}
.page{padding:16px 14px 120px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.15rem;color:var(--navy);font-weight:800}
.card p{margin:0 0 6px}
.lbl{font-size:.8rem;color:var(--muted);margin:16px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:.9rem;cursor:pointer;color:var(--ink);font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.small{font-size:.82rem}.muted{color:var(--muted)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-weight:800;cursor:pointer;width:100%;text-align:center;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:10px}
.btn.navy{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:var(--soft);color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.pill{background:var(--navy);color:#fff;font-weight:800;font-size:.85rem;padding:7px 14px;border-radius:20px;white-space:nowrap}
.tm{border:1.5px solid var(--bad);color:var(--bad);font-weight:800;font-size:.9rem;padding:6px 11px;border-radius:10px;background:#fff;font-variant-numeric:tabular-nums}
.tm.calm{border-color:var(--line);color:var(--muted)}
.prog{height:5px;background:#dfe3ec;border-radius:5px;overflow:hidden;margin:-4px 0 12px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .25s}
.topic{display:inline-block;font-size:.72rem;font-weight:700;color:var(--navy2);background:var(--soft);padding:4px 10px;border-radius:8px;margin-bottom:10px}
.topic.p{background:#fff3d6;color:#7a5600}
.q{font-size:1.08rem;font-weight:800;color:var(--ink);line-height:1.4;margin:0 0 14px}
.q.def{font-weight:600;font-style:italic;font-size:1rem}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;color:var(--ink);cursor:pointer;font-size:.95rem;line-height:1.38}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.88rem}
.opt.sel{border-color:var(--navy2);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .k{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .k{background:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:4px 0;font-size:.92rem;line-height:1.5;border-left:5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb b{display:block;margin-bottom:3px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb .art{display:block;margin-top:6px;font-size:.85rem;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,241,234,0),var(--bg) 35%)}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.dock .btn{margin:0;background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;border-radius:16px;padding:15px;box-shadow:0 6px 18px rgba(22,40,84,.25)}
.dock .btn.sec{background:#fff;color:var(--navy);box-shadow:var(--shadow);flex:0 0 34%}
.score{font-size:3rem;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.grade{display:inline-block;margin-top:8px;font-weight:800;padding:6px 12px;border-radius:10px}
.grade.ok{background:var(--ok-soft);color:var(--ok)}.grade.bad{background:var(--bad-soft);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.3rem;color:var(--navy)}.stat span{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#e3e6ee;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--navy2)}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rev .q{font-size:.96rem;margin:6px 0 8px}
.ans{font-size:.9rem;margin:3px 0}.ans.ok{color:var(--ok)}.ans.bad{color:var(--bad)}
.ex{font-size:.86rem;color:var(--muted);margin-top:6px;line-height:1.45}
/* unir */
.mcols{display:grid;grid-template-columns:38% 1fr;gap:10px}
.mi{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:9px;cursor:pointer;color:var(--ink);font-size:.86rem;line-height:1.35;transition:background .15s,border-color .15s}
.mi.c{font-weight:800;color:var(--navy);font-size:.9rem}
.mi.sel{border-color:var(--navy2);background:var(--soft);box-shadow:0 0 0 2px var(--navy2) inset}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mi.err{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mi .tag{display:inline-block;font-size:.7rem;font-weight:800;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px}
.hint{font-size:.84rem;color:var(--muted);margin:0 0 12px}
.drawer{position:fixed;inset:0;z-index:90;display:flex}
.drawer .bk{flex:1;background:rgba(11,20,48,.5)}
.drawer nav{width:min(82vw,320px);background:#fff;padding:calc(14px + env(safe-area-inset-top)) 8px 20px;order:-1;overflow-y:auto;display:flex;flex-direction:column}
.dhead{padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dhead b{display:block;color:var(--navy);font-size:1.1rem}.dhead span{font-size:.78rem;color:var(--muted);letter-spacing:1px}
.ditem{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 10px;border-radius:12px;cursor:pointer;color:var(--ink);font-weight:600;font-size:1rem}
.ditem:hover{background:var(--soft)}
.dfoot{margin-top:auto;padding:14px 10px 0;font-size:.74rem;color:var(--muted);line-height:1.45}
.dim{position:fixed;inset:0;z-index:80;background:rgba(11,20,48,.62);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:420px}
.modal h3{margin:0 0 8px;color:var(--navy)}
@media(min-width:900px){
  .hero{padding:26px 22px 64px}.hero h2{font-size:2.2rem}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tiles .tile{margin:0}
  .wrap{max-width:860px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="tb-btn" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="title">Examen de Grado</h1>
</header>
<main id="app"></main>
<div id="dock" class="dock hidden"><div class="in" id="dockIn"></div></div>
<div id="overlay"></div>

<script>
const DATA = {"mcq":[{"a":"C","u":"Teoría de la Ley","q":"Según el art. 1 CC, la ley es una declaración de la voluntad soberana que, manifestada en la forma prescrita por la Constitución:","o":["Manda, prohíbe o permite.","Ordena, castiga o premia.","Regula, sanciona o autoriza.","Obliga, faculta o exime."],"e":"Art. 1 CC: «La ley es una declaración de la voluntad soberana que, manifestada en la forma prescrita por la Constitución, manda, prohíbe o permite»."},{"a":"C","u":"Teoría de la Ley","q":"¿Cuál es el valor de la costumbre en materia civil según el Código Civil?","o":["No constituye derecho sino en los casos en que la ley se remite a ella.","Constituye derecho en silencio de la ley, siempre que sea uniforme y pública.","Tiene el mismo valor que la ley, salvo que contradiga una norma de orden público.","Solo constituye derecho si se prueba por escritura pública ante el juez."],"e":"Art. 2 CC: «La costumbre no constituye derecho sino en los casos en que la ley se remite a ella». Es la costumbre según ley; en materia comercial, en cambio, se admite la costumbre en silencio de la ley (art. 4 CCom)."},{"a":"C","u":"Teoría de la Ley","q":"La regla general en materia de efecto retroactivo de la ley es que:","o":["La ley solo puede disponer para lo futuro, aunque el legislador puede darle efecto retroactivo fuera de materia penal.","La ley siempre tiene efecto retroactivo, salvo que ella misma disponga expresamente que solo regirá para el futuro.","La ley rige desde su aprobación por el Congreso y alcanza a todos los hechos anteriores a su publicación en el Diario Oficial.","La retroactividad está prohibida en toda materia por la Constitución, sin excepción alguna."],"e":"El art. 9 CC establece la irretroactividad como regla de interpretación dirigida al juez, pero el legislador puede dictar leyes retroactivas, salvo en materia penal (art. 19 N° 3 CPR) y con el límite del derecho de propiedad."},{"a":"C","u":"Teoría de la Ley","q":"Las leyes que se limiten a declarar el sentido de otras leyes:","o":["Se entienden incorporadas en éstas, sin afectar las sentencias ejecutoriadas en el tiempo intermedio.","Derogan tácitamente la ley interpretada desde la fecha de su publicación en el Diario Oficial.","Solo rigen hacia el futuro y no se entienden incorporadas en la ley que interpretan.","Requieren quórum calificado y afectan incluso las sentencias ejecutoriadas anteriores."],"e":"Art. 9 inc. 2 CC: las leyes interpretativas se entienden incorporadas en las interpretadas, pero no afectan en manera alguna los efectos de las sentencias judiciales ejecutoriadas en el tiempo intermedio."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué es la derogación tácita de una ley?","o":["La que ocurre cuando la nueva ley contiene disposiciones inconciliables con las de la anterior.","La que ocurre cuando la nueva ley declara expresamente que deja sin efecto a la anterior.","La que ocurre cuando una ley deja de aplicarse por desuso prolongado de la población.","La que ocurre cuando el Tribunal Constitucional declara inaplicable un precepto legal."],"e":"Art. 52 CC: es tácita la derogación cuando la nueva ley contiene disposiciones que no pueden conciliarse con las de la ley anterior. El desuso no deroga la ley en Chile."},{"a":"C","u":"Teoría de la Ley","q":"Conforme al Código Civil, cuando el sentido de la ley es claro:","o":["No se desatenderá su tenor literal, a pretexto de consultar su espíritu.","El juez debe preferir su espíritu, aunque contradiga el tenor literal.","Debe aplicarse la equidad natural antes que el texto de la ley.","Debe consultarse siempre la historia fidedigna de su establecimiento."],"e":"Art. 19 inc. 1 CC. Solo para interpretar una expresión oscura puede recurrirse a su intención o espíritu, claramente manifestados en ella misma o en la historia fidedigna de su establecimiento (inc. 2)."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué elemento de interpretación consagra el art. 22 inc. 1 CC al disponer que el contexto de la ley servirá para ilustrar el sentido de cada una de sus partes?","o":["El elemento lógico-sistemático.","El elemento gramatical o literal.","El elemento histórico o genético.","La equidad natural."],"e":"El art. 22 CC consagra el elemento lógico (contexto) y sistemático (otras leyes que versen sobre el mismo asunto)."},{"a":"C","u":"Teoría de la Ley","q":"Según el art. 24 CC, ¿cuándo se recurre al espíritu general de la legislación y a la equidad natural?","o":["Cuando no puedan aplicarse las reglas de interpretación precedentes.","Siempre, antes de recurrir al tenor literal de la ley.","Solo cuando la ley interpretada pertenezca al derecho de familia o sucesorio.","Cuando ambas partes lo soliciten expresamente al juez."],"e":"El art. 24 CC tiene carácter subsidiario: opera cuando no pueden aplicarse las reglas de los arts. 19 a 23."},{"a":"C","u":"Teoría de la Ley","q":"La interpretación judicial de la ley:","o":["Solo obliga respecto de las causas en que actualmente se pronunciare.","Obliga a todos los tribunales inferiores al que la dictó.","Tiene efectos generales, igual que la ley interpretativa.","Obliga a la Corte Suprema cuando la dicta una Corte de Apelaciones."],"e":"Art. 3 inc. 2 CC: las sentencias judiciales no tienen fuerza obligatoria sino respecto de las causas en que actualmente se pronunciaren (efecto relativo)."},{"a":"C","u":"Teoría de la Ley","q":"¿Cómo se computan los plazos de días, meses o años mencionados en las leyes según el Código Civil?","o":["Son completos y corren hasta la medianoche del último día del plazo.","Se cuentan solo los días hábiles, excluyendo domingos y festivos.","Corren hasta las doce horas del último día del plazo.","Se cuentan desde el día siguiente hábil y hasta la hora de cierre del tribunal."],"e":"Art. 48 CC. Además, en los plazos del CC se comprenden los días feriados, salvo que el plazo diga expresamente que es de días útiles (art. 50 CC)."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué principio rige la ley chilena en cuanto al territorio?","o":["Obliga a todos los habitantes de la República, incluso a los extranjeros.","Obliga solo a los chilenos, dondequiera que se encuentren.","Obliga solo a los extranjeros que tengan residencia definitiva en el país.","Los extranjeros se rigen siempre por la ley de su nacionalidad."],"e":"Art. 14 CC: territorialidad de la ley. Hay excepciones de extraterritorialidad, como el art. 15 CC respecto de los chilenos en el extranjero."},{"a":"C","u":"Teoría de la Ley","q":"Los bienes situados en Chile están sujetos a las leyes chilenas:","o":["Aunque sus dueños sean extranjeros y no residan en Chile.","Solo si sus dueños son chilenos o residen en Chile.","Solo si son inmuebles; los muebles siguen a su dueño.","Salvo que el contrato se haya celebrado en el extranjero."],"e":"Art. 16 inc. 1 CC. Sin perjuicio de las estipulaciones de los contratos otorgados válidamente en país extraño (inc. 2), cuyos efectos, si han de cumplirse en Chile, se rigen por la ley chilena (inc. 3)."},{"a":"C","u":"Teoría de la Ley","q":"La forma de los instrumentos públicos se determina:","o":["Por la ley del país en que hayan sido otorgados.","Siempre por la ley chilena, si han de valer en Chile.","Por la ley del domicilio del otorgante.","Por la ley que elijan libremente las partes."],"e":"Art. 17 CC: lex locus regit actum. La autenticidad se prueba según el Código de Procedimiento Civil."},{"a":"C","u":"Teoría de la Ley","q":"Según la Ley sobre Efecto Retroactivo de las Leyes, las meras expectativas:","o":["No forman derecho.","Forman derecho adquirido una vez inscritas.","Son derechos adquiridos protegidos por la Constitución.","Se transmiten a los herederos como derechos eventuales."],"e":"Art. 7 LERL: las meras expectativas no forman derecho. Lo protegido son los derechos adquiridos."},{"a":"C","u":"Persona","q":"¿Cuándo principia legalmente la existencia de la persona?","o":["Al nacer, esto es, al separarse completamente de su madre.","Desde la concepción, según el art. 19 N° 1 de la Constitución.","Al ser inscrito su nacimiento en el Registro Civil.","Al sobrevivir veinticuatro horas después del parto."],"e":"Art. 74 CC: la existencia legal de toda persona principia al nacer, esto es, al separarse completamente de su madre. La criatura que muere en el vientre materno, o que perece antes de estar completamente separada de su madre, se reputa no haber existido jamás."},{"a":"C","u":"Persona","q":"Los derechos que se deferirían a la criatura que está en el vientre materno, si hubiese nacido y viviese:","o":["Están suspensos hasta que el nacimiento se efectúe.","Se adquieren desde la concepción en forma pura y simple.","Pasan a la madre en todo caso y en forma definitiva.","Se extinguen, porque el no nacido no es persona."],"e":"Art. 77 CC. Si el nacimiento constituye un principio de existencia, entra el recién nacido en el goce de dichos derechos como si hubiese existido al tiempo en que se defirieron."},{"a":"C","u":"Persona","q":"La presunción de derecho sobre la época de la concepción (art. 76 CC) establece que la concepción precede al nacimiento:","o":["No menos de 180 días cabales y no más de 300, contados hacia atrás desde la medianoche del día del nacimiento.","No menos de 100 días cabales y no más de 200, contados hacia atrás desde la medianoche del día del nacimiento.","No menos de 120 días cabales y no más de 270, contados hacia atrás desde la medianoche del día del nacimiento.","No menos de 150 días cabales y no más de 320, contados hacia atrás desde la medianoche del día del nacimiento."],"e":"Art. 76 CC: presunción de derecho, por lo que no admite prueba en contrario."},{"a":"C","u":"Persona","q":"¿Qué es la conmoriencia?","o":["Se presume que quienes mueren en un mismo hecho, sin saberse el orden, murieron a la vez y ninguno sucedió al otro.","Se presume que, si mueren los cónyuges en un mismo hecho, el más joven sobrevivió al mayor y lo heredó.","Es la declaración judicial de muerte presunta de varias personas desaparecidas en un mismo hecho.","Es la regla que hace heredar al hijo que muere en el parto junto con su madre."],"e":"Art. 79 CC. Es una presunción simplemente legal."},{"a":"C","u":"Persona","q":"¿Cuál de los siguientes NO es un atributo de la personalidad?","o":["La capacidad de ejercicio.","El nombre y los apellidos.","El domicilio civil.","El patrimonio propio."],"e":"Son atributos: capacidad de goce, nacionalidad, nombre, estado civil, domicilio y patrimonio. La capacidad de ejercicio no es atributo, pues no todas las personas la tienen."},{"a":"C","u":"Persona","q":"El domicilio consiste en:","o":["La residencia, acompañada, real o presuntivamente, del ánimo de permanecer en ella.","El lugar donde la persona tiene la mayor parte de sus bienes y negocios.","El lugar de nacimiento de la persona, según conste en su inscripción en el Registro Civil.","La comuna en que la persona está inscrita para votar, según el padrón electoral vigente."],"e":"Art. 59 CC. Se divide en político y civil. El civil es relativo a una parte determinada del territorio del Estado."},{"a":"C","u":"Persona","q":"La mera residencia hace las veces de domicilio civil:","o":["Respecto de quienes no tienen domicilio civil en otra parte.","Respecto de toda persona, en cualquier caso y para todos los efectos legales.","Solo para efectos tributarios y de notificaciones.","Nunca, porque el domicilio exige ánimo de permanecer."],"e":"Art. 68 CC."},{"a":"C","u":"Persona","q":"¿Desde cuándo puede pedirse la declaración de muerte presunta de un desaparecido?","o":["Transcurridos a lo menos cinco años desde las últimas noticias.","Transcurrido a lo menos un año desde las últimas noticias.","Transcurridos a lo menos diez años desde la desaparición.","Transcurridos a lo menos tres meses desde la última citación."],"e":"Art. 81 N° 1 CC: debe justificarse que desde la fecha de las últimas noticias han transcurrido a lo menos cinco años. Existen plazos especiales para casos de herida grave en guerra, naves o aeronaves y sismos o catástrofes."},{"a":"C","u":"Persona","q":"En la muerte presunta, el juez concede la posesión definitiva de los bienes del desaparecido, en lugar de la provisoria, cuando:","o":["Cumplidos cinco años desde las últimas noticias, se prueba que han transcurrido setenta desde su nacimiento.","Cumplidos dos años desde las últimas noticias, se prueba que el desaparecido no tenía herederos.","Cumplidos cinco años desde las últimas noticias, lo solicitan todos los herederos presuntivos.","Cumplidos tres años desde las últimas noticias, se prueba que el desaparecido tendría hoy más de sesenta años."],"e":"Art. 82 CC: el juez concede la posesión definitiva si, cumplidos los cinco años, se prueba que han transcurrido setenta desde el nacimiento del desaparecido. También puede concederla transcurridos diez años desde la fecha de las últimas noticias, cualquiera que fuese la edad del desaparecido."},{"a":"C","u":"Persona","q":"Una persona jurídica se define como:","o":["Una persona ficticia, capaz de ejercer derechos y contraer obligaciones civiles, y de ser representada.","Un conjunto de personas naturales que actúan unidas, sin patrimonio distinto del de sus miembros.","Una sociedad de hecho que adquiere personalidad desde que sus socios comienzan a operar.","Una persona natural que actúa en representación de un grupo de personas o de bienes."],"e":"Art. 545 CC. Las personas jurídicas son de dos especies: corporaciones y fundaciones de beneficencia pública."},{"a":"C","u":"Persona","q":"¿Cuál es la diferencia entre corporación y fundación?","o":["La corporación es una agrupación de personas; la fundación, un conjunto de bienes afectos a un fin.","La corporación persigue fines de lucro; la fundación, en cambio, persigue fines benéficos.","La fundación requiere a lo menos cien miembros; la corporación, solo veinticinco.","La corporación es de derecho público; la fundación, en cambio, es de derecho privado."],"e":"Ambas son personas jurídicas sin fines de lucro; la corporación tiene un sustrato personal y la fundación uno patrimonial."},{"a":"C","u":"Acto Jurídico","q":"Según el art. 1445 CC, para que una persona se obligue a otra por un acto o declaración de voluntad es necesario:","o":["Capacidad legal, consentimiento sin vicios, objeto lícito y causa lícita.","Capacidad legal, consentimiento, objeto y cumplimiento de solemnidades.","Consentimiento, causa, escritura pública y capacidad de ejercicio.","Capacidad de goce, consentimiento, objeto posible y buena fe."],"e":"Art. 1445 inc. 1 CC. La doctrina agrega como requisitos de existencia la voluntad, el objeto, la causa y las solemnidades, y como requisitos de validez la voluntad sin vicios, la capacidad, el objeto lícito y la causa lícita."},{"a":"C","u":"Acto Jurídico","q":"¿Cuáles son los vicios del consentimiento según el Código Civil?","o":["Error, fuerza y dolo.","Error, fuerza, dolo y lesión.","Error, simulación y dolo.","Fuerza, dolo e incapacidad."],"e":"Art. 1451 CC. La lesión enorme es considerada vicio del consentimiento por parte de la doctrina, pero el Código solo la sanciona en casos específicos."},{"a":"C","u":"Acto Jurídico","q":"El error sobre un punto de derecho:","o":["No vicia el consentimiento.","Vicia siempre el consentimiento.","Vicia el consentimiento solo si es excusable.","Produce nulidad absoluta del acto."],"e":"Art. 1452 CC, en relación con el art. 8 CC (nadie puede alegar ignorancia de la ley)."},{"a":"C","u":"Acto Jurídico","q":"Un comprador cree comprar un caballo y el vendedor cree vender una vaca. ¿Qué tipo de error es?","o":["Error esencial u obstáculo.","Error sustancial sobre la calidad.","Error accidental sobre la cosa.","Error en la persona."],"e":"Art. 1453 CC: error sobre la especie de acto o contrato o sobre la identidad de la cosa específica. Su sanción es discutida: inexistencia o nulidad absoluta para unos; nulidad relativa para otros."},{"a":"C","u":"Acto Jurídico","q":"El error acerca de la persona con quien se tiene intención de contratar:","o":["No vicia el consentimiento, salvo que esa persona sea la causa principal del contrato.","Vicia siempre el consentimiento, porque recae sobre un elemento del contrato.","Nunca vicia el consentimiento, aunque el contrato sea intuito personae.","Produce nulidad absoluta cuando el contrato es gratuito."],"e":"Art. 1455 CC. En los contratos intuito personae, el error en la persona vicia el consentimiento; la otra parte tiene derecho a ser indemnizada de los perjuicios en que de buena fe haya incurrido."},{"a":"C","u":"Acto Jurídico","q":"Para que la fuerza vicie el consentimiento debe ser:","o":["Grave, injusta y determinante.","Física, actual y personal.","Grave, justa y anterior al contrato.","Ejercida por la contraparte y no por un tercero."],"e":"Art. 1456 CC. Además, la fuerza vicia el consentimiento aunque no la haya empleado el beneficiado por ella (art. 1457 CC). El temor reverencial no basta."},{"a":"C","u":"Acto Jurídico","q":"En los actos bilaterales, el dolo vicia el consentimiento cuando:","o":["Es obra de una de las partes y aparece claramente que sin él no hubieran contratado.","Es obra de un tercero, aunque la parte beneficiada no haya tenido conocimiento de él.","Es obra de cualquier persona, aunque no haya sido determinante para contratar.","Se presume por la sola desproporción de las prestaciones del contrato."],"e":"Art. 1458 CC: en los actos bilaterales debe ser determinante y obra de una de las partes. En los demás casos solo da lugar a la acción de perjuicios. El dolo no se presume sino en los casos especialmente previstos por la ley (art. 1459 CC)."},{"a":"C","u":"Acto Jurídico","q":"¿Quiénes son absolutamente incapaces según el art. 1447 CC?","o":["Los dementes, los impúberes y los sordos o sordomudos que no pueden darse a entender claramente.","Los dementes, los menores adultos y los sordos o sordomudos que no saben leer ni escribir.","Los dementes, los disipadores interdictos y los impúberes que no tienen representante legal.","Los dementes, los menores de dieciocho años y las personas sujetas a interdicción judicial."],"e":"Art. 1447 inc. 1 CC. Sus actos no producen ni aun obligaciones naturales y no admiten caución. Son relativamente incapaces los menores adultos y los disipadores que se hallen bajo interdicción de administrar lo suyo."},{"a":"C","u":"Acto Jurídico","q":"¿Qué sanción tienen los actos de los relativamente incapaces otorgados sin cumplir las formalidades habilitantes?","o":["Nulidad relativa.","Nulidad absoluta.","Inexistencia.","Inoponibilidad."],"e":"Art. 1682 inc. 3 CC: cualquiera otra especie de vicio produce nulidad relativa. Los actos de los absolutamente incapaces producen nulidad absoluta (art. 1682 inc. 2)."},{"a":"C","u":"Acto Jurídico","q":"Hay objeto ilícito en la enajenación de:","o":["Las cosas embargadas por decreto judicial, sin autorización del juez o consentimiento del acreedor.","Las cosas que están en el comercio humano, cuando se enajenan a título gratuito y sin insinuación judicial.","Las cosas que pertenecen a un menor de edad, aunque haya autorización judicial.","Los bienes futuros, aunque las partes hayan previsto expresamente en el contrato que llegarán a existir."],"e":"Art. 1464 CC: hay objeto ilícito en la enajenación de las cosas que no están en el comercio, de los derechos o privilegios que no pueden transferirse a otra persona, de las cosas embargadas y de las especies cuya propiedad se litiga, sin permiso del juez que conoce en el litigio."},{"a":"C","u":"Acto Jurídico","q":"El pacto sobre sucesión futura (art. 1463 CC):","o":["Adolece de objeto ilícito, aunque consienta la persona de cuya sucesión se trata.","Es válido si consiente expresamente la persona de cuya sucesión se trata.","Es válido si se otorga por escritura pública ante notario y dos testigos.","Es válido siempre que no afecte las legítimas de los herederos forzosos."],"e":"Art. 1463 CC. Existe una excepción: el pacto de no disponer de la cuarta de mejoras (art. 1204 CC)."},{"a":"C","u":"Acto Jurídico","q":"Según el art. 1467 CC, la pura liberalidad o beneficencia:","o":["Es causa suficiente.","No es causa suficiente.","Debe expresarse siempre por escrito.","Solo es causa en las donaciones por escritura pública."],"e":"Art. 1467 CC: no puede haber obligación sin una causa real y lícita, pero no es necesario expresarla. La pura liberalidad o beneficencia es causa suficiente."},{"a":"C","u":"Acto Jurídico","q":"¿Cuál es el plazo de prescripción de la acción de nulidad absoluta?","o":["Diez años desde la celebración del acto.","Cuatro años desde la celebración del acto.","Cinco años desde que la obligación se hizo exigible.","Es imprescriptible, por ser de orden público."],"e":"Art. 1683 CC: la nulidad absoluta no puede sanearse por la ratificación de las partes ni por un lapso que no pase de diez años."},{"a":"C","u":"Acto Jurídico","q":"¿Quién puede alegar la nulidad absoluta?","o":["Todo interesado, salvo quien contrató sabiendo o debiendo saber el vicio; y el ministerio público.","Solo las partes del contrato, aunque hayan contratado sabiendo o debiendo saber el vicio.","Solo aquellos en cuyo beneficio la han establecido las leyes, sus herederos o cesionarios.","Solo el juez de oficio, cuando el vicio aparece de manifiesto en el acto o contrato."],"e":"Art. 1683 CC. Además, puede y debe ser declarada por el juez, aun sin petición de parte, cuando aparece de manifiesto en el acto o contrato."},{"a":"C","u":"Acto Jurídico","q":"¿Cuál es el plazo para pedir la rescisión (nulidad relativa) en caso de fuerza?","o":["Cuatro años desde el día en que la fuerza hubiere cesado.","Cuatro años desde el día de la celebración del contrato.","Diez años desde el día de la celebración del contrato.","Dos años desde el día en que la fuerza hubiere cesado."],"e":"Art. 1691 CC: en el caso de violencia, el cuadrienio se cuenta desde el día en que ésta hubiere cesado; en el de error o dolo, desde el día de la celebración; respecto de los incapaces, desde que cesa la incapacidad."},{"a":"C","u":"Acto Jurídico","q":"La nulidad judicialmente declarada:","o":["Da derecho a las partes a ser restituidas al estado anterior al acto o contrato nulo.","Produce efectos solo hacia el futuro, manteniendo lo ya ejecutado por las partes.","Produce efectos solo respecto de terceros, pero no entre las partes del contrato.","No obliga a restituir lo recibido, salvo que haya existido mala fe de una parte."],"e":"Art. 1687 CC: efecto retroactivo entre las partes. Respecto de terceros, la nulidad judicialmente pronunciada da acción reivindicatoria contra terceros poseedores, sin perjuicio de las excepciones legales (art. 1689 CC)."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es la simulación relativa?","o":["Las partes celebran un acto aparente para ocultar otro acto real distinto.","Las partes celebran un acto aparente sin que exista ningún acto real.","Una sola de las partes declara algo distinto de lo que realmente quiere.","Un tercero suplanta a una de las partes en la celebración del acto."],"e":"En la simulación relativa existe un acto real oculto (p. ej., una donación disfrazada de compraventa). En la absoluta, no existe acto alguno tras el aparente. El art. 1707 CC regula las contraescrituras."},{"a":"C","u":"Acto Jurídico","q":"Las escrituras privadas hechas por los contratantes para alterar lo pactado en escritura pública:","o":["No producen efecto contra terceros.","Producen efecto contra terceros desde su otorgamiento.","Son nulas absolutamente entre las partes.","Producen efecto contra terceros solo si se protocolizan."],"e":"Art. 1707 inc. 1 CC. Tampoco lo producen las contraescrituras públicas, cuando no se ha tomado razón de su contenido al margen de la escritura matriz y del traslado en cuya virtud ha obrado el tercero (inc. 2)."},{"a":"C","u":"Acto Jurídico","q":"La falta de instrumento público en los actos y contratos en que la ley requiere esa solemnidad:","o":["Hace que se miren como no celebrados, y no puede suplirse por otra prueba.","Puede suplirse por prueba testimonial si hay principio de prueba por escrito.","Puede suplirse por la confesión de la parte que celebró el acto.","Produce nulidad relativa, que se sanea en cuatro años."],"e":"Art. 1701 inc. 1 CC."},{"a":"C","u":"Acto Jurídico","q":"¿Qué limitación tiene la prueba de testigos en las obligaciones según el Código Civil?","o":["Deben constar por escrito los actos que contienen la entrega o promesa de una cosa que valga más de dos UTM.","Deben constar por escrito los actos que contienen la entrega o promesa de una cosa que valga más de diez UTM.","Deben constar por escrito los actos que contienen la entrega o promesa de una cosa que valga más de una UF.","Deben constar por escrito todos los actos civiles, cualquiera sea el valor de la cosa."],"e":"Arts. 1708 y 1709 CC. Excepciones: principio de prueba por escrito, imposibilidad de obtener prueba escrita y demás casos expresamente exceptuados (art. 1711 CC)."},{"a":"C","u":"Acto Jurídico","q":"La representación en los actos jurídicos produce como efecto que:","o":["Lo hecho por el representante, dentro de sus facultades, obliga al representado como si hubiese contratado él.","Lo hecho por el representante obliga solo a éste, quien luego debe rendir cuenta al representado.","Lo hecho por el representante solo vale si el representado lo ratifica por escritura pública.","Lo hecho por el representante es siempre inoponible al representado mientras no lo apruebe el juez."],"e":"Art. 1448 CC. Si el representante actúa sin poder o excediéndolo, el acto es inoponible al representado, salvo ratificación (art. 1449 CC en la estipulación por otro)."},{"a":"C","u":"Acto Jurídico","q":"¿Qué son los elementos de la naturaleza de un acto jurídico?","o":["Los que, no siendo esenciales, se entienden pertenecerle sin necesidad de cláusula especial.","Los que, siendo esenciales, determinan que el acto produzca o no algún efecto civil.","Los que, no siendo esenciales, se agregan al acto por medio de cláusulas especiales.","Los que la ley exige como solemnidad para la validez o la prueba del acto."],"e":"Art. 1444 CC: distingue cosas esenciales, de la naturaleza y accidentales. Ejemplo de elemento de la naturaleza: la obligación de saneamiento en la compraventa."},{"a":"C","u":"Bienes","q":"Según el Código Civil, los bienes consisten en:","o":["Cosas corporales o incorporales.","Cosas muebles o inmuebles.","Derechos reales o personales.","Cosas fungibles o no fungibles."],"e":"Art. 565 CC: corporales son las que tienen un ser real y pueden ser percibidas por los sentidos; incorporales, las que consisten en meros derechos."},{"a":"C","u":"Bienes","q":"¿Qué son los inmuebles por destinación?","o":["Cosas muebles permanentemente destinadas al uso, cultivo y beneficio de un inmueble.","Cosas que adhieren permanentemente a un inmueble, como los edificios y los árboles.","Derechos reales que recaen sobre un inmueble, como el usufructo o la hipoteca.","Cosas muebles que las partes declaran inmuebles en una escritura pública."],"e":"Art. 570 CC. Ejemplo: los animales destinados al cultivo o beneficio de un predio. Los inmuebles por adherencia, en cambio, son los que adhieren permanentemente a un inmueble (art. 568 CC)."},{"a":"C","u":"Bienes","q":"¿Cuáles son los derechos reales según el art. 577 CC?","o":["Dominio, herencia, usufructo, uso o habitación, servidumbres activas, prenda e hipoteca.","Dominio, posesión, usufructo, uso o habitación, servidumbres, prenda e hipoteca.","Dominio, herencia, usufructo, arrendamiento, servidumbres activas, prenda e hipoteca.","Dominio, herencia, usufructo, mera tenencia, servidumbres activas, prenda y anticresis."],"e":"Art. 577 inc. 2 CC. Existen otros fuera del Código, como el derecho de censo, el derecho real de conservación (Ley 20.930) y la concesión minera."},{"a":"C","u":"Bienes","q":"¿Cuáles son los modos de adquirir el dominio que enumera el art. 588 CC?","o":["Ocupación, accesión, tradición, sucesión por causa de muerte y prescripción.","Ocupación, accesión, tradición, contrato y prescripción.","Tradición, inscripción, sucesión por causa de muerte y prescripción.","Ocupación, accesión, compraventa, herencia y posesión."],"e":"Art. 588 CC. La ley es también un modo de adquirir (p. ej., usufructo legal del padre o madre)."},{"a":"C","u":"Bienes","q":"¿Cómo se efectúa la tradición del dominio de los bienes raíces?","o":["Por la inscripción del título en el Registro del Conservador.","Por la entrega material del inmueble al adquirente.","Por la sola escritura pública de compraventa.","Por la entrega de las llaves y del certificado de dominio."],"e":"Art. 686 CC. Lo mismo rige para los derechos de usufructo, uso, habitación, censo e hipoteca constituidos sobre inmuebles. Las servidumbres se tradicionan por escritura pública (art. 698 CC)."},{"a":"C","u":"Bienes","q":"¿Cuáles son los requisitos de la tradición?","o":["Tradente y adquirente capaces, consentimiento sin vicios, título translaticio y entrega.","Tradente dueño, adquirente de buena fe, escritura pública y pago del precio.","Consentimiento del tradente, inscripción en el Conservador y justo título.","Título translaticio, buena fe del adquirente y posesión del tradente por cinco años."],"e":"Arts. 670 a 675 CC. Para que valga la tradición se requiere un título translaticio de dominio, como el de venta, permuta, donación, etc. (art. 675 CC)."},{"a":"C","u":"Bienes","q":"La posesión se compone de dos elementos:","o":["El corpus y el animus.","El título y la inscripción.","La buena fe y el justo título.","La tradición y la prescripción."],"e":"Art. 700 CC: la posesión es la tenencia de una cosa determinada con ánimo de señor o dueño."},{"a":"C","u":"Bienes","q":"¿Qué requisitos tiene la posesión regular?","o":["Justo título, buena fe y, si el título es translaticio, la tradición.","Justo título, inscripción en el Conservador y posesión por cinco años.","Buena fe al momento de adquirir y durante todo el tiempo de la posesión.","Título translaticio, mala fe excusable y tenencia material de la cosa."],"e":"Art. 702 CC. La buena fe solo se exige al momento de adquirir la posesión."},{"a":"C","u":"Bienes","q":"¿Cuál es el plazo de prescripción adquisitiva ordinaria de los bienes raíces?","o":["Cinco años.","Dos años.","Diez años.","Quince años."],"e":"Art. 2508 CC: dos años para los muebles y cinco años para los bienes raíces. La prescripción extraordinaria es de diez años (art. 2511 CC)."},{"a":"C","u":"Bienes","q":"¿Qué se requiere para la prescripción adquisitiva extraordinaria?","o":["Posesión irregular durante diez años.","Posesión regular durante cinco años.","Justo título y buena fe durante diez años.","Mera tenencia durante quince años."],"e":"Art. 2510 y 2511 CC. No es necesario título alguno y se presume de derecho la buena fe, sin embargo de la falta de un título adquisitivo de dominio."},{"a":"C","u":"Bienes","q":"La mera tenencia:","o":["Se ejerce sobre una cosa, no como dueño, sino en lugar o a nombre del dueño.","Es una especie de posesión irregular, que habilita para prescribir en diez años.","Se convierte en posesión por el mero transcurso de diez años sin reclamo del dueño.","Es la posesión de una cosa sin título inscrito, pero con ánimo de señor y dueño."],"e":"Art. 714 CC. El simple lapso de tiempo no muda la mera tenencia en posesión (art. 716 CC), salvo el caso del art. 2510 regla 3.ª."},{"a":"C","u":"Bienes","q":"¿Quién es el titular de la acción reivindicatoria?","o":["El dueño de una cosa singular, de que no está en posesión.","El poseedor regular que ha perdido la posesión de la cosa.","El mero tenedor despojado de la cosa por un tercero.","El acreedor hipotecario cuando el inmueble es enajenado."],"e":"Art. 889 CC. Se concede también al poseedor regular que ha perdido la posesión hallándose en el caso de poder ganar la cosa por prescripción: es la acción publiciana (art. 894 CC)."},{"a":"C","u":"Bienes","q":"Las acciones posesorias tienen por objeto:","o":["Conservar o recuperar la posesión de bienes raíces o de derechos reales constituidos en ellos.","Conservar o recuperar la posesión de bienes muebles o de derechos personales sobre ellos.","Declarar el dominio de un inmueble a favor de quien lo ha poseído por más de un año.","Obtener la indemnización de los perjuicios por el uso de un inmueble ajeno."],"e":"Art. 916 CC. No puede instaurarlas sino el que ha estado en posesión tranquila y no interrumpida un año completo (art. 918 CC)."},{"a":"C","u":"Bienes","q":"¿En qué plazo prescriben las acciones posesorias que tienen por objeto conservar la posesión?","o":["Un año completo desde el acto de molestia o embarazo.","Seis meses desde el acto de molestia o embarazo.","Dos años desde el acto de molestia o embarazo.","Cinco años desde el acto de molestia o embarazo."],"e":"Art. 920 inc. 1 CC. Las que tienen por objeto recuperarla expiran al cabo de un año completo contado desde que el poseedor anterior la ha perdido."},{"a":"C","u":"Bienes","q":"¿Qué derecho real se define como un gravamen impuesto sobre un predio en utilidad de otro predio de distinto dueño?","o":["La servidumbre predial.","El derecho real de usufructo.","El derecho real de hipoteca.","El derecho real de censo."],"e":"Art. 820 CC."},{"a":"C","u":"Bienes","q":"El usufructo supone necesariamente dos derechos coexistentes:","o":["El del nudo propietario y el del usufructuario.","El del dueño de la cosa y el del arrendatario.","El del usufructuario y el del fiduciario.","El del acreedor y el del deudor hipotecario."],"e":"Art. 765 CC. Tiene una duración limitada, al cabo de la cual pasa al nudo propietario y se consolida con la propiedad."},{"a":"C","u":"Obligaciones","q":"¿Cuáles son las fuentes de las obligaciones según el art. 1437 CC?","o":["El contrato, el cuasicontrato, el delito, el cuasidelito y la ley.","El contrato, la declaración unilateral, el delito y la ley.","El contrato, el delito, la sentencia judicial y la costumbre.","El acto jurídico, el hecho jurídico, la ley y la equidad."],"e":"Art. 1437 CC. La doctrina agrega la declaración unilateral de voluntad y el enriquecimiento sin causa."},{"a":"C","u":"Obligaciones","q":"Las obligaciones naturales:","o":["No dan acción para exigir su cumplimiento, pero cumplidas autorizan para retener lo pagado.","Dan acción para exigir su cumplimiento, pero, una vez cumplidas, no autorizan para retener lo pagado.","Son las que nacen directamente de la ley, sin intervención de la voluntad.","Solo pueden cumplirse válidamente por un deudor absolutamente incapaz."],"e":"Art. 1470 CC. Enumera como tales, entre otras, las obligaciones civiles extinguidas por la prescripción y las que proceden de actos a que faltan las solemnidades que la ley exige para que produzcan efectos civiles."},{"a":"C","u":"Obligaciones","q":"¿Qué es una condición resolutoria tácita?","o":["La que va envuelta en los contratos bilaterales, para el caso de no cumplirse lo pactado.","La que las partes pactan expresamente para el caso de no cumplirse lo pactado.","La que va envuelta en los contratos unilaterales, para el caso de muerte del deudor.","La que se cumple por el solo transcurso del plazo fijado en el contrato."],"e":"Art. 1489 CC: en tal caso, el otro contratante puede pedir a su arbitrio o la resolución o el cumplimiento del contrato, con indemnización de perjuicios."},{"a":"C","u":"Obligaciones","q":"La condición que consiste en la mera voluntad de la persona que se obliga (condición meramente potestativa del deudor):","o":["Es nula si es suspensiva.","Es siempre válida.","Es nula siempre, sea suspensiva o resolutoria.","Se tiene por no escrita y el acto es puro y simple."],"e":"Art. 1478 CC. Si la condición consiste en un hecho voluntario de cualquiera de las partes, vale."},{"a":"C","u":"Obligaciones","q":"En el pacto comisorio calificado en la compraventa por no pago del precio, el comprador puede hacer subsistir el contrato pagando el precio:","o":["En las 24 horas siguientes a la notificación judicial de la demanda.","En los 3 días siguientes a la notificación judicial de la demanda.","Hasta la citación para oír sentencia en primera instancia.","Hasta antes de la sentencia de primera instancia."],"e":"Art. 1879 CC."},{"a":"C","u":"Obligaciones","q":"En las obligaciones solidarias pasivas, el acreedor puede:","o":["Demandar a todos conjuntamente o a cualquiera de ellos, a su arbitrio, por el total.","Demandar a cada deudor solo por su cuota, salvo que el contrato diga otra cosa.","Demandar primero al deudor principal y, si éste no paga, a los demás.","Demandar solo cuando todos los deudores se encuentren constituidos en mora."],"e":"Art. 1514 CC: sin que por éste pueda oponérsele el beneficio de división."},{"a":"C","u":"Obligaciones","q":"¿Cuándo es solidaria una obligación?","o":["Cuando lo dispone la convención, el testamento o la ley, y debe declararse expresamente.","Cuando hay pluralidad de deudores de una cosa divisible, salvo pacto en contrario.","Cuando el objeto debido es indivisible, aunque nada digan las partes.","Se presume en materia civil cuando los deudores son parientes."],"e":"Arts. 1511 y 1511 inc. final CC. La solidaridad no se presume."},{"a":"C","u":"Obligaciones","q":"¿Cuándo está el deudor en mora según el art. 1551 CC?","o":["Al no cumplir en el término estipulado; al dejar pasar el tiempo útil; y en los demás casos, al ser reconvenido judicialmente.","Desde que la obligación se hace exigible, en todos los casos, sin necesidad de requerimiento alguno del acreedor.","Desde que el acreedor le envía una carta certificada requiriéndole el pago, con copia a un notario.","Solo desde que existe una sentencia ejecutoriada que lo condena a cumplir la obligación."],"e":"Art. 1551 CC. Además, en los contratos bilaterales ninguno de los contratantes está en mora dejando de cumplir lo pactado, mientras el otro no lo cumple por su parte (art. 1552 CC, la mora purga la mora)."},{"a":"C","u":"Obligaciones","q":"¿Desde cuándo se debe la indemnización de perjuicios?","o":["Desde la mora, o desde la contravención si la obligación es de no hacer.","Desde la celebración del contrato, en todos los casos y sin necesidad de mora.","Desde la notificación de la sentencia condenatoria.","Desde que el acreedor sufre el daño, aunque el deudor no se encuentre en mora."],"e":"Art. 1557 CC."},{"a":"C","u":"Obligaciones","q":"En materia contractual, si no se puede imputar dolo al deudor, ¿de qué perjuicios responde?","o":["De los directos previstos o que pudieron preverse al tiempo del contrato.","De todos los perjuicios, directos e indirectos, previstos e imprevistos.","De los directos, sean previstos o imprevistos al tiempo del contrato.","Solo del daño moral, salvo pacto en contrario de las partes."],"e":"Art. 1558 CC. Si hay dolo, el deudor responde de todos los perjuicios que fueron una consecuencia inmediata o directa de no haberse cumplido la obligación o de haberse demorado su cumplimiento."},{"a":"C","u":"Obligaciones","q":"En los contratos que solo son útiles al acreedor (por ejemplo, el depósito), el deudor responde de:","o":["Culpa grave o lata.","Culpa leve o mediana.","Culpa levísima o lata.","Caso fortuito o fuerza mayor."],"e":"Art. 1547 CC: el deudor no es responsable sino de la culpa lata en los contratos que por su naturaleza solo son útiles al acreedor; de la leve en los contratos que se hacen para beneficio recíproco; y de la levísima en los contratos en que el deudor es el único que reporta beneficio."},{"a":"C","u":"Obligaciones","q":"¿Qué es la cláusula penal?","o":["Aquella en que una persona, para asegurar una obligación, se sujeta a una pena en caso de no cumplirla o retardarla.","Aquella en que el juez impone una multa al deudor que no cumple una obligación de hacer dentro del plazo.","Aquella en que una persona garantiza una obligación ajena constituyendo prenda sobre un bien mueble.","Aquella en que las partes fijan el interés máximo convencional para una operación de crédito de dinero."],"e":"Art. 1535 CC. Para exigir la pena no es necesario probar perjuicios (art. 1542 CC)."},{"a":"C","u":"Obligaciones","q":"¿Cuáles son los derechos auxiliares del acreedor?","o":["Medidas conservativas, acción oblicua, acción pauliana y beneficio de separación.","Acción de cumplimiento, acción resolutoria, indemnización y cláusula penal.","Indemnización compensatoria, indemnización moratoria y derecho de retención.","Acción reivindicatoria, acción publiciana, acción posesoria y tercería."],"e":"Tienen por objeto mantener la integridad del patrimonio del deudor, que es la garantía general del acreedor (art. 2465 CC)."},{"a":"C","u":"Obligaciones","q":"La acción pauliana tiene por objeto:","o":["Revocar los actos que el deudor ha ejecutado en fraude de sus acreedores.","Que el acreedor ejerza los derechos que el deudor negligente no ejerce.","Separar el patrimonio del causante del patrimonio de su heredero.","Declarar la nulidad absoluta de un contrato simulado por el deudor."],"e":"Art. 2468 CC. En los contratos onerosos se exige mala fe del deudor y del adquirente; en los gratuitos basta la mala fe del deudor. Prescribe en un año desde la fecha del acto o contrato."},{"a":"C","u":"Obligaciones","q":"Según el art. 1567 CC, ¿cuál de los siguientes NO es un modo de extinguir las obligaciones?","o":["La tradición.","La novación.","La transacción.","La pérdida de la cosa que se debe."],"e":"Art. 1567 CC: convención, solución o pago efectivo, novación, transacción, remisión, compensación, confusión, pérdida de la cosa que se debe, declaración de nulidad o rescisión, evento de la condición resolutoria y prescripción. La tradición es un modo de adquirir."},{"a":"C","u":"Obligaciones","q":"¿A quién debe hacerse el pago para que sea válido?","o":["Al acreedor, a su representante o a la persona diputada por el acreedor para el cobro.","A cualquier persona que exhiba el título, aunque no esté facultada para cobrar.","Solo al acreedor personalmente, nunca a un representante o mandatario.","Al notario del domicilio del deudor, quien lo pone a disposición del acreedor."],"e":"Art. 1576 CC. El pago hecho de buena fe a la persona que estaba entonces en posesión del crédito es válido, aunque después aparezca que el crédito no le pertenecía."},{"a":"C","u":"Obligaciones","q":"¿Qué es la subrogación legal?","o":["La que opera por el solo ministerio de la ley, aun contra la voluntad del acreedor.","La que se produce por convención entre el acreedor y el tercero que le paga la deuda.","La que sustituye una obligación por otra nueva, extinguiendo la primera.","La que cambia al deudor con el consentimiento expreso del acreedor."],"e":"Art. 1610 CC. Ejemplo: en favor del codeudor solidario o fiador que paga la deuda."},{"a":"C","u":"Obligaciones","q":"Para que opere la compensación legal se requiere que ambas deudas:","o":["Sean de dinero o fungibles de igual género y calidad, líquidas y actualmente exigibles.","Provengan del mismo contrato y tengan el mismo acreedor y el mismo deudor.","Sean del mismo monto, consten por escrito y estén vencidas hace más de un año.","Consten en escritura pública y hayan sido reconocidas judicialmente por ambos."],"e":"Art. 1656 CC. La compensación opera por el solo ministerio de la ley y aun sin conocimiento de los deudores, pero debe ser alegada."},{"a":"C","u":"Obligaciones","q":"¿Cuál es el plazo general de prescripción de la acción ejecutiva?","o":["Tres años.","Cinco años.","Dos años.","Un año."],"e":"Art. 2515 CC: la acción ejecutiva prescribe en tres años y la ordinaria en cinco. La acción ejecutiva se convierte en ordinaria por el lapso de tres años, y convertida en ordinaria durará solamente otros dos."},{"a":"C","u":"Obligaciones","q":"La prescripción extintiva se interrumpe civilmente:","o":["Por la demanda judicial notificada.","Por una carta del acreedor al deudor.","Por el transcurso de un año sin pago.","Por la muerte del deudor."],"e":"Art. 2518 CC: se interrumpe naturalmente por el reconocimiento del deudor y civilmente por la demanda judicial."},{"a":"C","u":"Obligaciones","q":"¿Qué es la novación?","o":["La substitución de una nueva obligación a otra anterior, que queda extinguida.","La transferencia del crédito a un tercero, que queda como nuevo acreedor.","La renuncia gratuita del acreedor a cobrar total o parcialmente la deuda.","La modificación del plazo de la obligación, que subsiste en lo demás."],"e":"Art. 1628 CC. Requiere ánimo de novar; si no aparece, se mirarán las dos obligaciones como coexistentes (art. 1634 CC)."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Cuál es el principio general de la responsabilidad extracontractual en el Código Civil?","o":["Quien comete un delito o cuasidelito que daña a otro debe indemnizar.","Toda persona responde por los daños que causan sus bienes, haya o no culpa.","Solo se responde del daño causado con dolo o intención de dañar.","Solo responde el Estado por los daños causados en su territorio."],"e":"Art. 2314 CC, sin perjuicio de la pena que le impongan las leyes por el delito o cuasidelito. El sistema es de responsabilidad subjetiva."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Cuáles son los requisitos de la responsabilidad extracontractual?","o":["Acción u omisión, capacidad, dolo o culpa, daño y relación de causalidad.","Contrato previo, incumplimiento, mora del deudor y daño al acreedor.","Daño y culpa, sin que sea necesario probar relación de causalidad.","Acción, sentencia penal condenatoria, daño y capacidad del autor."],"e":"Se deducen de los arts. 2314, 2319 y 2329 CC."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Quiénes son incapaces de delito o cuasidelito según el art. 2319 CC?","o":["Los menores de siete años y los dementes.","Los menores de dieciocho años y los dementes.","Los menores de dieciséis años y los disipadores.","Los menores de catorce años y los interdictos."],"e":"Art. 2319 CC: serán responsables de los daños causados por ellos las personas a cuyo cargo estén, si pudiere imputárseles negligencia. Queda a la prudencia del juez determinar si el menor de dieciséis años ha cometido el delito o cuasidelito sin discernimiento."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué es la responsabilidad por el hecho ajeno (art. 2320 CC)?","o":["Se responde también del hecho de quienes están al propio cuidado, presumiéndose la culpa del guardián.","Solo responde quien causa el daño personalmente, aunque esté al cuidado de otra persona.","Es una responsabilidad objetiva del guardián, que no admite prueba de haber actuado con diligencia.","Es la responsabilidad del Estado por los actos de sus funcionarios en ejercicio de sus cargos."],"e":"Art. 2320 CC: se presume la culpa del guardián; pero cesa la obligación si con la autoridad y el cuidado que su respectiva calidad les confiere y prescribe, no hubieren podido impedir el hecho."},{"a":"C","u":"Responsabilidad Extracontractual","q":"La apreciación del daño está sujeta a reducción si el que lo ha sufrido:","o":["Se expuso a él imprudentemente.","Era menor de edad al momento del daño.","No dedujo la acción dentro de un año.","Tenía un seguro que cubría el daño."],"e":"Art. 2330 CC: exposición imprudente de la víctima al daño."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿En qué plazo prescriben las acciones de responsabilidad extracontractual?","o":["Cuatro años desde la perpetración del acto.","Cinco años desde que se produce el daño.","Diez años desde la perpetración del acto.","Dos años desde que la víctima conoce el daño."],"e":"Art. 2332 CC. Es una prescripción de corto tiempo."},{"a":"C","u":"Responsabilidad Extracontractual","q":"Si un delito o cuasidelito ha sido cometido por dos o más personas:","o":["Cada una es solidariamente responsable de todo el perjuicio.","Cada una responde solo de su cuota en el perjuicio, que se divide por partes iguales.","Responde solo quien causó el mayor daño.","Responde solo el autor principal del hecho, y los demás de manera subsidiaria."],"e":"Art. 2317 CC, salvas las excepciones de los arts. 2323 y 2328. Todo fraude o dolo cometido por dos o más personas produce la acción solidaria."},{"a":"C","u":"Responsabilidad Extracontractual","q":"El art. 2329 CC establece, según la doctrina mayoritaria:","o":["Una presunción de culpa por el hecho propio, cuando el daño proviene de malicia o negligencia de otro.","Una responsabilidad objetiva del propietario de vehículos motorizados, sin admitir prueba en contrario.","La responsabilidad del Estado por falta de servicio de sus órganos administrativos.","El plazo de prescripción de la acción de perjuicios derivada de un delito o cuasidelito."],"e":"Art. 2329 inc. 1 CC: por regla general, todo daño que pueda imputarse a malicia o negligencia de otra persona debe ser reparado por ésta. Sus numerales contienen ejemplos de actividades peligrosas."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Cuáles son las diferencias más relevantes entre la responsabilidad contractual y la extracontractual?","o":["En la contractual se presume la culpa del deudor y hay gradación; en la extracontractual se prueba la culpa y no hay gradación.","En la extracontractual se presume la culpa y hay gradación; en la contractual la culpa debe probarse y no hay gradación.","No hay diferencias relevantes: ambas exigen mora previa, prueba de culpa y gradación según el beneficio.","En ambas se presume la culpa del autor, pero solo en la contractual la responsabilidad es solidaria."],"e":"Otras diferencias: la capacidad (plena en la contractual; 7 y 16 años en la extracontractual), la mora (necesaria solo en la contractual), la solidaridad (art. 2317 CC) y los plazos de prescripción."},{"a":"C","u":"Responsabilidad Extracontractual","q":"¿Qué perjuicios son indemnizables en la responsabilidad extracontractual?","o":["Todo daño: emergente, lucro cesante y moral.","Solo el daño emergente debidamente probado.","Solo los daños previstos al momento del hecho.","Solo el daño patrimonial, nunca el moral."],"e":"Rige el principio de reparación integral del daño (art. 2329 CC). La jurisprudencia admite ampliamente la indemnización del daño moral."},{"a":"C","u":"Contratos Parte General","q":"¿Qué principio consagra el art. 1545 CC al disponer que todo contrato legalmente celebrado es una ley para los contratantes?","o":["El principio de la fuerza obligatoria del contrato.","El principio del efecto relativo del contrato.","El principio de la buena fe contractual.","El principio del consensualismo."],"e":"Art. 1545 CC: el contrato no puede ser invalidado sino por su consentimiento mutuo o por causas legales."},{"a":"C","u":"Contratos Parte General","q":"Según el art. 1546 CC, los contratos deben ejecutarse:","o":["De buena fe, y obligan a lo expresado y a lo que emana de la naturaleza de la obligación, la ley o la costumbre.","Literalmente, y obligan solo a lo expresado en ellos, sin que la costumbre pueda agregar obligaciones.","Conforme a la equidad natural, y el juez puede modificarlos cuando se vuelven excesivamente onerosos.","Según la intención de la parte más débil, y obligan a lo que ésta razonablemente pudo esperar."],"e":"Art. 1546 CC: consagra la buena fe objetiva en la ejecución del contrato."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es la oferta según el Código de Comercio?","o":["Acto unilateral por el que una persona propone a otra celebrar una convención, que basta aceptar para formar el consentimiento.","Acto bilateral por el que ambas partes se obligan a celebrar en el futuro un contrato ya determinado en todos sus elementos.","Aceptación tácita de una propuesta, que forma el consentimiento desde que el oferente toma conocimiento de ella.","Contrato preparatorio por el que el oferente se obliga a mantener su propuesta por un plazo."],"e":"La formación del consentimiento está regulada en los arts. 97 a 108 del Código de Comercio, que se aplican también en materia civil por falta de norma en el CC."},{"a":"C","u":"Contratos Parte General","q":"Según el art. 101 CCom, ¿cuándo queda perfecto el contrato?","o":["Dada la contestación, si en ella se aprueba pura y simplemente la propuesta.","Cuando el oferente toma conocimiento de la aceptación del destinatario.","Cuando las partes firman el contrato ante un notario público.","Cuando el oferente entrega la cosa al aceptante."],"e":"Art. 101 CCom: teoría de la declaración o aprobación. Una aceptación condicional importa una nueva propuesta (art. 102 CCom)."},{"a":"C","u":"Contratos Parte General","q":"¿Qué requisitos debe cumplir la promesa de celebrar un contrato para producir obligación (art. 1554 CC)?","o":["Por escrito; contrato prometido eficaz; plazo o condición que fije su época; y especificación completa del contrato.","Por escritura pública; pago de un anticipo; plazo para celebrarlo; y aprobación de ambas partes ante notario.","Por escrito; inscripción en el Conservador; precio determinado; y firma de dos testigos hábiles.","Por escrito o verbalmente; plazo o condición; y que el contrato prometido sea consensual."],"e":"Art. 1554 CC. La promesa es un contrato solemne (debe constar por escrito)."},{"a":"C","u":"Contratos Parte General","q":"¿Cuál es la regla de interpretación de los contratos que da primacía a la intención de las partes?","o":["Conocida claramente la intención de los contratantes, debe estarse a ella más que a lo literal.","Debe estarse siempre a lo literal de las palabras, aunque la intención de las partes sea otra.","Debe preferirse la interpretación que favorezca al acreedor, por ser la parte diligente.","Debe estarse a la costumbre del lugar donde se celebró el contrato, antes que a su texto."],"e":"Art. 1560 CC: sistema subjetivo de interpretación de los contratos."},{"a":"C","u":"Contratos Parte General","q":"Las cláusulas ambiguas que hayan sido extendidas o dictadas por una de las partes:","o":["Se interpretan contra ella, si la ambigüedad proviene de su falta de explicación.","Se interpretan a favor de ella, por ser quien conocía mejor el contrato.","Se tienen por no escritas, y el contrato vale en todo lo demás que hayan convenido las partes.","Producen nulidad relativa del contrato, por error de la otra parte."],"e":"Art. 1566 inc. 2 CC. Inc. 1: no pudiendo aplicarse ninguna de las reglas precedentes, las cláusulas ambiguas se interpretarán a favor del deudor."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es la estipulación a favor de otro (art. 1449 CC)?","o":["Se estipula a favor de un tercero sin representarlo, y solo éste puede demandar lo estipulado.","Se promete que un tercero ejecutará un hecho, y éste queda obligado sin necesidad de ratificar.","Se confía la gestión de un negocio a otro, que actúa a su propio nombre y riesgo.","Se cede la posición contractual a un tercero, que asume los derechos y obligaciones."],"e":"Art. 1449 CC: mientras no intervenga la aceptación expresa o tácita del tercero, es revocable el contrato por la sola voluntad de las partes."},{"a":"C","u":"Contratos Parte General","q":"Una persona promete que un tercero, de quien no es legítimo representante, entregará un caballo. Si el tercero no ratifica:","o":["El otro contratante tiene acción de perjuicios contra quien hizo la promesa.","El tercero queda igualmente obligado, porque la promesa es válida.","El contrato es nulo absolutamente, por falta de consentimiento del tercero.","Nadie responde, porque la promesa de hecho ajeno no produce efectos."],"e":"Art. 1450 CC: promesa de hecho ajeno. El tercero no contraerá obligación alguna sino en virtud de su ratificación."},{"a":"C","u":"Contratos Parte General","q":"El contrato es solemne cuando:","o":["Está sujeto a ciertas formalidades especiales, sin las cuales no produce efecto civil.","Requiere la tradición de la cosa a que se refiere para quedar perfecto.","Se perfecciona por el solo consentimiento de las partes, aunque la ley exija escrituración para su prueba.","Debe celebrarse ante el juez o ante un ministro de fe del tribunal, con citación de ambas partes."],"e":"Art. 1443 CC: el contrato es real cuando requiere la tradición de la cosa; solemne cuando requiere formalidades; y consensual cuando se perfecciona por el solo consentimiento."},{"a":"C","u":"Contratos Parte General","q":"¿Qué es la teoría de la imprevisión?","o":["Permite revisar un contrato cuando hechos imprevisibles y ajenos a las partes hacen excesivamente oneroso cumplirlo.","Exime al deudor de responsabilidad cuando el incumplimiento se debe a un caso fortuito o fuerza mayor.","Permite anular el contrato cuando una de las partes sufrió error sustancial sobre la calidad esencial de la cosa.","Permite rescindir el contrato cuando el precio es inferior a la mitad del justo precio de la cosa."],"e":"No tiene consagración general en el Código Civil chileno. Su admisión se discute en doctrina y jurisprudencia, por la fuerza obligatoria del art. 1545 CC."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuándo se reputa perfecta la compraventa de bienes raíces?","o":["Cuando se ha otorgado escritura pública.","Cuando las partes convienen en la cosa y el precio.","Cuando se inscribe en el Conservador de Bienes Raíces.","Cuando el comprador paga íntegramente el precio."],"e":"Art. 1801 CC: la regla general es que la venta es consensual; pero la venta de bienes raíces, servidumbres, censos y de una sucesión hereditaria no se reputa perfecta ante la ley mientras no se ha otorgado escritura pública."},{"a":"C","u":"Contratos Parte Especial","q":"La compraventa entre cónyuges no separados judicialmente:","o":["Es nula.","Es válida si se otorga por escritura pública.","Es válida con autorización judicial.","Es inoponible a los acreedores."],"e":"Art. 1796 CC: es nulo el contrato de compraventa entre cónyuges no separados judicialmente, y entre el padre o madre y el hijo sujeto a patria potestad."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuáles son las obligaciones del vendedor según el art. 1824 CC?","o":["La entrega o tradición, y el saneamiento de la cosa vendida.","El pago del precio y la recepción de la cosa vendida.","La entrega de la cosa y el otorgamiento de garantía convencional.","La conservación de la cosa y su inscripción a nombre del comprador."],"e":"Art. 1824 CC. La obligación de saneamiento comprende el amparar al comprador en el dominio y posesión pacífica de la cosa vendida (evicción) y responder de los defectos ocultos (vicios redhibitorios)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es la lesión enorme que sufre el vendedor?","o":["El precio que recibe es inferior a la mitad del justo precio de la cosa.","El precio que paga es superior al doble del justo precio de la cosa.","El precio que recibe es inferior al avalúo fiscal de la cosa.","El precio que recibe es inferior a dos tercios del justo precio de la cosa."],"e":"Art. 1889 CC: el comprador sufre lesión enorme cuando el justo precio de la cosa que compra es inferior a la mitad del precio que paga por ella. Solo procede en la compraventa de bienes raíces (art. 1891 CC) y prescribe en cuatro años desde la fecha del contrato."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuál es el plazo de prescripción de la acción redhibitoria respecto de bienes raíces?","o":["Un año.","Seis meses.","Cuatro años.","Cinco años."],"e":"Art. 1866 CC: la acción redhibitoria dura seis meses respecto de las cosas muebles y un año respecto de los bienes raíces, en todos los casos en que leyes especiales no hayan ampliado o restringido este plazo."},{"a":"C","u":"Contratos Parte Especial","q":"El arrendamiento de cosas es un contrato:","o":["Bilateral, oneroso, conmutativo, consensual por regla general y de tracto sucesivo.","Unilateral, gratuito, real, principal y de ejecución instantánea o de una sola vez.","Bilateral, gratuito, solemne, accesorio y de ejecución instantánea o de una sola vez.","Unilateral, oneroso, aleatorio, real y de tracto sucesivo."],"e":"Art. 1915 CC. Los arriendos de predios urbanos se rigen además por la Ley 18.101."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué ley regula el arrendamiento de predios urbanos y fue modificada por la Ley 21.461 («Devuélveme mi casa»)?","o":["La Ley 18.101.","La Ley 19.496.","La Ley 20.720.","La Ley 18.010."],"e":"La Ley 21.461 incorporó a la Ley 18.101 un procedimiento monitorio de cobro de rentas y restitución (arts. 18-A y siguientes) y la posibilidad de solicitar la restitución anticipada del inmueble como medida precautoria."},{"a":"C","u":"Contratos Parte Especial","q":"El mandato:","o":["Es un contrato en que una persona confía la gestión de negocios a otra, que actúa por cuenta y riesgo de la primera.","Es un contrato real, que se perfecciona por la entrega de los bienes que el mandatario debe administrar.","Es un contrato solemne, que requiere siempre escritura pública para producir efectos entre las partes.","Es un contrato esencialmente gratuito, que degenera en arrendamiento de servicios si se remunera."],"e":"Art. 2116 CC. Es consensual por regla general, y puede ser gratuito o remunerado (art. 2117 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cuál de las siguientes es una causal de terminación del mandato según el art. 2163 CC?","o":["La revocación del mandante.","La venta de los bienes del mandante.","El cambio de domicilio del mandatario.","El matrimonio del mandatario."],"e":"Art. 2163 CC: desempeño del negocio, expiración del término o evento de la condición, revocación del mandante, renuncia del mandatario, muerte del mandante o del mandatario, resolución de liquidación concursal (Ley 20.720), interdicción de uno u otro y cesación de las funciones del mandante si el mandato ha sido dado en ejercicio de ellas."},{"a":"C","u":"Contratos Parte Especial","q":"El mutuo es un contrato:","o":["Real.","Consensual.","Solemne.","Bilateral."],"e":"Art. 2197 CC. Es además unilateral y principal. Las operaciones de crédito de dinero se rigen por la Ley 18.010."},{"a":"C","u":"Contratos Parte Especial","q":"En el comodato, el comodante conserva:","o":["Todos sus derechos sobre la cosa, pero no su ejercicio en cuanto sea incompatible con el uso concedido.","Solo la nuda propiedad, porque el comodatario adquiere un derecho real de usufructo sobre la cosa.","Ningún derecho sobre la cosa mientras dure el comodato, salvo el de cobrar una renta mensual.","El derecho a usar la cosa en conjunto con el comodatario, por partes iguales y sin restricción."],"e":"Art. 2176 CC. El comodato es esencialmente gratuito; si hay remuneración, degenera en arrendamiento."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué es el precario?","o":["La tenencia de cosa ajena, sin previo contrato y por ignorancia o mera tolerancia del dueño.","El arrendamiento de una cosa celebrado verbalmente, sin contrato escrito ni plazo fijo.","El comodato de una cosa por un plazo determinado y para un servicio particular.","La posesión irregular de un inmueble por menos de diez años, sin título inscrito."],"e":"Art. 2195 CC. Se constituye también precario cuando no se presta la cosa para un servicio particular ni se fija tiempo para su restitución (inc. 1). Se tramita como juicio sumario (art. 680 inc. 1 CPC)."},{"a":"C","u":"Contratos Parte Especial","q":"El fiador puede exigir que, antes de proceder contra él, se persiga la deuda en los bienes del deudor principal. Este derecho se llama:","o":["Beneficio de excusión.","Beneficio de división.","Beneficio de inventario.","Beneficio de competencia."],"e":"Art. 2357 CC. El beneficio de división, en cambio, permite a los cofiadores exigir que la deuda se divida entre ellos por partes iguales (art. 2367 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Cómo se perfecciona el contrato de hipoteca?","o":["Por escritura pública, que además debe inscribirse en el Registro de Hipotecas.","Por escritura privada, que debe protocolizarse ante notario dentro de treinta días.","Por la entrega del inmueble al acreedor, que lo conserva hasta el pago.","Por la inscripción en el Registro de Propiedad, sin necesidad de escritura pública."],"e":"Arts. 2409 y 2410 CC. Discute la doctrina si la inscripción es solemnidad del contrato o la tradición del derecho real de hipoteca; la tesis mayoritaria sostiene que es la forma de efectuar la tradición."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué ley regula hoy la prenda sin desplazamiento?","o":["El art. 14 de la Ley 20.190.","El Código de Comercio.","La Ley 18.112.","La Ley de Prenda Agraria."],"e":"La Ley 20.190 (art. 14) unificó el régimen de prenda sin desplazamiento y derogó, entre otras, la prenda agraria, la industrial, la de compraventa de cosas muebles a plazo y la de la Ley 18.112."},{"a":"C","u":"Contratos Parte Especial","q":"La transacción no puede tener por objeto:","o":["El estado civil de las personas.","Derechos patrimoniales disponibles.","La acción civil derivada de un delito.","Un litigio pendiente entre las partes."],"e":"Art. 2450 CC. Se puede transigir sobre la acción civil que nace de un delito, pero sin perjuicio de la acción criminal (art. 2449 CC)."},{"a":"C","u":"Contratos Parte Especial","q":"¿Qué plazo de garantía legal establece hoy la Ley 19.496, modificada por la Ley 21.398?","o":["Seis meses.","Tres meses.","Un año.","Dos meses."],"e":"La Ley 21.398 (Ley Pro Consumidor) amplió la garantía legal de tres a seis meses desde la recepción del producto (art. 21 Ley 19.496)."},{"a":"C","u":"Familia","q":"Según el art. 102 CC vigente, el matrimonio es un contrato solemne por el cual:","o":["Dos personas se unen actual e indisolublemente, y por toda la vida, con el fin de vivir juntos, de procrear y de auxiliarse mutuamente.","Un hombre y una mujer se unen actual e indisolublemente, y por toda la vida, con el fin de vivir juntos, de procrear y de auxiliarse mutuamente.","Dos personas se unen actual e indisolublemente, con el fin de compartir un hogar común y administrar en conjunto sus bienes.","Dos personas se unen actualmente y mientras dure la convivencia, con el fin de vivir juntos y de auxiliarse mutuamente."],"e":"La Ley 21.400 (matrimonio igualitario) sustituyó la expresión «un hombre y una mujer» por «dos personas»."},{"a":"C","u":"Familia","q":"¿Cuál es la edad mínima para contraer matrimonio en Chile?","o":["Dieciocho años.","Dieciséis años, con asenso.","Catorce años.","Veintiún años."],"e":"La Ley 21.515 (2022) elevó la edad mínima a 18 años: la Ley de Matrimonio Civil (art. 5) impide contraer matrimonio a los menores de dieciocho años. Por ello se derogaron las normas sobre asenso de los arts. 105 a 116 CC."},{"a":"C","u":"Familia","q":"¿Qué es el divorcio por cese de convivencia unilateral?","o":["El que pide cualquiera de los cónyuges tras a lo menos tres años de cese efectivo de la convivencia.","El que piden ambos cónyuges de común acuerdo tras a lo menos un año de cese de la convivencia.","El que pide un cónyuge por una falta imputable al otro que torne intolerable la vida en común.","El que pide cualquiera de los cónyuges en cualquier momento, sin acreditar cese de convivencia."],"e":"Art. 55 inc. 3 LMC. El divorcio por cese de convivencia de común acuerdo requiere un año (art. 55 inc. 1 LMC)."},{"a":"C","u":"Familia","q":"¿Cuál es el régimen patrimonial supletorio del matrimonio en Chile?","o":["La sociedad conyugal.","La separación total de bienes.","La participación en los gananciales.","La comunidad de bienes."],"e":"Art. 135 CC: por el hecho del matrimonio se contrae sociedad de bienes entre los cónyuges. La reforma de la sociedad conyugal sigue en tramitación en el Congreso."},{"a":"C","u":"Familia","q":"¿Cuál es la sanción de los actos que el marido ejecuta sobre los bienes raíces sociales sin la autorización de la mujer, cuando ésta es necesaria?","o":["Nulidad relativa.","Nulidad absoluta.","Inoponibilidad.","Inexistencia."],"e":"Art. 1757 CC. La excepción son los arrendamientos o cesiones de la tenencia por más de cinco u ocho años sin autorización, que son inoponibles a la mujer en el exceso.
