"},{"a":"C","u":"Familia","q":"¿Qué son los bienes familiares?","o":["El inmueble de cualquiera de los cónyuges que sirve de residencia principal de la familia y los muebles que la guarnecen.","Todos los bienes muebles e inmuebles adquiridos a título oneroso por cualquiera de los cónyuges durante el matrimonio.","Los bienes que forman el haber de la sociedad conyugal, administrados por el marido como jefe de ella.","Los bienes que los hijos heredan de sus padres, mientras se encuentran sujetos a patria potestad."],"e":"Art. 141 CC. Su afectación se aplica cualquiera sea el régimen de bienes del matrimonio y también al acuerdo de unión civil (Ley 20.830)."},{"a":"C","u":"Familia","q":"¿Cuál es el plazo de la acción de impugnación de la paternidad del hijo concebido o nacido durante el matrimonio, por parte del marido?","o":["180 días desde que conoció el parto, o un año si estaba separado de hecho de la mujer.","Un año desde el nacimiento del hijo, o dos años si estaba separado de hecho de la mujer.","Cinco años desde el nacimiento del hijo, cualquiera sea la situación de los cónyuges.","Es imprescriptible, al igual que la acción de reclamación de la filiación."],"e":"Art. 212 CC. La acción de reclamación de filiación, en cambio, es imprescriptible (art. 195 CC)."},{"a":"C","u":"Familia","q":"Según el art. 324 CC, ¿quiénes quedan privados del derecho a pedir alimentos al hijo?","o":["El padre o madre que no pagó pensión de alimentos judicialmente decretada, o que lo abandonó en su infancia si la filiación se estableció contra su oposición.","El padre o madre mayor de sesenta y cinco años que recibe una pensión de vejez del Estado, cualquiera sea su monto o su situación económica.","El padre o madre que no vive con el hijo y que no ha mantenido con él una relación directa y regular durante los últimos cinco años.","Ningún padre o madre puede ser privado del derecho de alimentos respecto de su hijo, porque se trata de un derecho personalísimo e irrenunciable."],"e":"Art. 324 inc. final CC. Además, en caso de injuria atroz cesa la obligación de prestar alimentos; solo constituyen injuria atroz las conductas descritas en el art. 968 CC."},{"a":"C","u":"Familia","q":"¿Qué creó la Ley 21.389?","o":["El Registro Nacional de Deudores de Pensiones de Alimentos.","El acuerdo de unión civil y el estado civil de conviviente civil.","El matrimonio entre personas del mismo sexo.","Los tribunales de familia y la mediación familiar."],"e":"La Ley 21.389 (2021) creó el Registro Nacional de Deudores de Pensiones de Alimentos y modificó diversos cuerpos legales para mejorar el pago de las pensiones."},{"a":"C","u":"Familia","q":"¿Qué estado civil genera el acuerdo de unión civil?","o":["El de conviviente civil.","El de casado civilmente.","El de soltero o soltera.","Ninguno, porque es un contrato."],"e":"Art. 1 Ley 20.830: los contrayentes se denominarán convivientes civiles y serán considerados parientes para efectos de algunas normas. Si termina, se restituye el estado civil anterior, salvo el caso de matrimonio de los convivientes entre sí."},{"a":"C","u":"Sucesorio","q":"¿Cuándo se defiere la herencia o legado según la regla general?","o":["Al fallecer el causante, si el asignatario no es llamado condicionalmente.","Al aceptar el heredero la herencia, en forma expresa o tácita, ante el tribunal.","Al dictarse la resolución que concede la posesión efectiva.","Al inscribirse el testamento en el Registro del Conservador."],"e":"Art. 956 CC. Si el heredero o legatario se llama condicionalmente, se defiere en el momento de cumplirse la condición."},{"a":"C","u":"Sucesorio","q":"¿Qué es el derecho de representación?","o":["Ficción por la que una persona ocupa el lugar y los derechos que tendría su padre o madre si éste no quisiese o no pudiese suceder.","Facultad del heredero de un heredero fallecido para aceptar o repudiar la herencia que se le había deferido a este último.","Derecho del cónyuge sobreviviente a representar al causante en los juicios pendientes al tiempo de su muerte.","Facultad del albacea de representar judicial y extrajudicialmente a la sucesión mientras no se haga la partición."],"e":"Art. 984 CC. Solo hay lugar a la representación en la descendencia del difunto y en la descendencia de sus hermanos (art. 986 CC)."},{"a":"C","u":"Sucesorio","q":"¿Quiénes son legitimarios según el art. 1182 CC vigente?","o":["Los hijos, personalmente o representados; los ascendientes; y el cónyuge sobreviviente.","Los hijos, personalmente o representados; los hermanos; y el cónyuge sobreviviente.","Los hijos y los ascendientes; el cónyuge solo concurre como heredero abintestato.","Los hijos, el cónyuge y los colaterales hasta el sexto grado inclusive."],"e":"Art. 1182 CC. Además, el art. 16 de la Ley 20.830 otorga al conviviente civil sobreviviente la calidad de heredero intestado y legitimario, con los mismos derechos que corresponden al cónyuge sobreviviente."},{"a":"C","u":"Sucesorio","q":"En el primer orden de sucesión intestada, cuando concurren hijos y cónyuge sobreviviente, el cónyuge lleva:","o":["El doble de la legítima de cada hijo; igual a la de éste si hay uno solo; nunca menos de un cuarto.","Lo mismo que cada hijo, cualquiera sea el número de hijos; pero nunca menos de la cuarta parte.","La mitad de la herencia si hay un solo hijo; un tercio si hay dos o más hijos.","La cuarta de mejoras completa, y los hijos se reparten el resto por partes iguales."],"e":"Art. 988 CC."},{"a":"C","u":"Sucesorio","q":"¿Cómo se divide la herencia cuando el causante tiene legitimarios (sucesión testada con legitimarios)?","o":["Mitad legitimaria, cuarta de mejoras y cuarta de libre disposición.","Mitad para los hijos y mitad para el cónyuge sobreviviente.","Tres cuartos para los legitimarios y un cuarto de libre disposición.","Por partes iguales entre todos los herederos instituidos."],"e":"Art. 1184 CC. Si no hay descendientes, ascendientes ni cónyuge, la mitad restante es de libre disposición."},{"a":"C","u":"Sucesorio","q":"¿Qué es la indignidad para suceder?","o":["Una sanción que priva de la herencia por hechos graves contra el causante, y que debe declararse judicialmente.","Una incapacidad absoluta para suceder, que opera de pleno derecho sin necesidad de declaración judicial.","La privación de la legítima que el testador ordena en su testamento, por las causas que señala la ley.","La renuncia voluntaria que hace el heredero a la herencia que se le ha deferido."],"e":"Arts. 968 a 979 CC. La indignidad debe declararse judicialmente a instancia de cualquiera de los interesados en la exclusión del heredero o legatario indigno (art. 974 CC) y se purga en cinco años de posesión de la herencia o legado (art. 975 CC). El art. 968 incorpora hoy causales vinculadas a la violencia intrafamiliar y el femicidio."},{"a":"C","u":"Sucesorio","q":"El testamento solemne abierto otorgado en Chile debe hacerse ante:","o":["Un escribano y tres testigos, o cinco testigos.","Un notario y dos testigos, o cuatro testigos.","El juez de letras y dos testigos, o tres testigos.","Un notario solamente, sin necesidad de testigos."],"e":"Art. 1014 CC. Puede hacer las veces de escribano el juez de letras del territorio jurisdiccional del lugar del otorgamiento."},{"a":"C","u":"Sucesorio","q":"¿Ante quién se tramita la posesión efectiva de una herencia intestada abierta en Chile?","o":["Ante el Servicio de Registro Civil e Identificación.","Ante el juez de letras del último domicilio del causante.","Ante el notario del último domicilio del causante.","Ante el Servicio de Impuestos Internos."],"e":"Ley 19.903: las posesiones efectivas de herencias intestadas abiertas en Chile se tramitan ante el Registro Civil; las testadas y las abiertas en el extranjero, ante el tribunal competente (arts. 877 y siguientes CPC)."},{"a":"C","u":"Sucesorio","q":"El beneficio de inventario consiste en:","o":["No hacer responsables a los herederos de las deudas hereditarias sino hasta el valor de lo heredado.","Separar el patrimonio del causante del de los herederos, en favor de los acreedores hereditarios.","Eximir a los herederos del pago del impuesto a las herencias, si se hace inventario solemne.","Que los herederos reciban los bienes libres de deudas, que se pagan con cargo a los legados."],"e":"Art. 1247 CC. El beneficio de separación, en cambio, lo pueden pedir los acreedores hereditarios y testamentarios (art. 1378 CC)."},{"a":"C","u":"Sucesorio","q":"¿Qué es el derecho de transmisión?","o":["El del heredero de quien murió sin aceptar o repudiar una asignación, para aceptarla o repudiarla.","El del nieto para ocupar el lugar de su padre premuerto en la sucesión intestada de su abuelo.","El de un coasignatario para llevar la porción que otro no quiso o no pudo llevar.","El del legatario para pedir a los herederos la entrega de la especie legada."],"e":"Art. 957 CC. A diferencia de la representación, opera tanto en la sucesión testada como en la intestada."},{"a":"P","u":"Procesal Orgánico","q":"Según el art. 1 COT, la facultad de conocer de las causas civiles y criminales, de juzgarlas y de hacer ejecutar lo juzgado pertenece exclusivamente:","o":["A los tribunales que establece la ley.","Al Poder Judicial y al Ministerio Público.","A la Corte Suprema y a las Cortes de Apelaciones.","A los tribunales ordinarios y a los árbitros."],"e":"Art. 1 COT, en concordancia con el art. 76 de la Constitución."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuáles son los momentos o fases de la jurisdicción?","o":["Conocimiento, juzgamiento y ejecución.","Demanda, contestación y sentencia.","Discusión, prueba y fallo.","Instrucción, acusación y juicio."],"e":"Se desprenden del art. 76 CPR y del art. 1 COT: conocer, juzgar y hacer ejecutar lo juzgado."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué es el principio de inexcusabilidad?","o":["Reclamada su intervención en forma legal, los tribunales no pueden excusarse ni aun por falta de ley.","Los jueces no pueden excusarse de conocer de un asunto, salvo por enfermedad o feriado legal.","Las partes no pueden excusarse de comparecer al tribunal cuando son citadas personalmente.","Los jueces deben fallar siempre conforme a la ley y no pueden aplicar la equidad."],"e":"Art. 76 inc. 2 CPR y art. 10 inc. 2 COT."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué principio consagra el art. 7 COT al disponer que los tribunales solo podrán ejercer su potestad en los negocios y dentro del territorio que la ley les hubiere respectivamente asignado?","o":["El principio de territorialidad.","El principio de inavocabilidad.","El principio de pasividad.","El principio de sedentariedad."],"e":"Art. 7 COT. Ello no impide que en los negocios de que conocen puedan dictar providencias que hayan de llevarse a efecto en otro territorio."},{"a":"P","u":"Procesal Orgánico","q":"El principio de pasividad (art. 10 COT) significa que:","o":["Los tribunales solo actúan a petición de parte, salvo que la ley los faculte para proceder de oficio.","Los tribunales deben actuar siempre de oficio, aunque las partes no lo pidan ni lo autorice la ley.","Los jueces no pueden dictar resoluciones sin oír previamente a ambas partes.","Los tribunales carecen de toda iniciativa probatoria en cualquier procedimiento, civil o penal."],"e":"Art. 10 inc. 1 COT."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué es la competencia según el art. 108 COT?","o":["La facultad de cada tribunal para conocer de los negocios que la ley ha colocado dentro de sus atribuciones.","El poder deber de los tribunales para resolver los conflictos de relevancia jurídica con efecto de cosa juzgada.","La aptitud legal de las partes para comparecer en juicio por sí mismas.","La división territorial del Poder Judicial en distritos jurisdiccionales y agrupaciones de comunas."],"e":"Art. 108 COT."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuáles son los elementos para determinar la competencia absoluta?","o":["Cuantía, materia y fuero o persona.","Territorio y materia.","Domicilio del demandado y cuantía.","Voluntad de las partes y materia."],"e":"La competencia absoluta determina la jerarquía del tribunal; es de orden público e irrenunciable. La relativa (territorio) determina cuál tribunal dentro de esa jerarquía, y es prorrogable en asuntos contenciosos civiles entre tribunales ordinarios de igual jerarquía."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué regla de competencia establece el art. 109 COT?","o":["La regla de la radicación.","La regla del grado o jerarquía.","La regla de la extensión.","La regla de la prevención."],"e":"Art. 109 COT. La regla del grado está en el art. 110, la de extensión en el art. 111 y la de prevención o inexcusabilidad en el art. 112."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué establece la regla de la extensión (art. 111 COT)?","o":["El tribunal competente para un asunto lo es para sus incidencias, la reconvención y la compensación.","El tribunal de primera instancia determina cuál será el tribunal de segunda instancia.","El tribunal competente para la acción principal lo es para cualquier otro juicio entre las partes.","Si varios tribunales son competentes, conoce del asunto el que previno en su conocimiento."],"e":"Art. 111 COT. También comprende las cuestiones que se susciten por vía de reconvención o de compensación, aunque el conocimiento de estas cuestiones, atendida su cuantía, hubiere de corresponder a un juez inferior si se entablasen por separado."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué es la prórroga de la competencia?","o":["El acuerdo de las partes para dar competencia territorial en primera instancia a un tribunal no naturalmente competente.","El acuerdo de las partes para dar competencia en razón de la materia a un tribunal no naturalmente competente.","La ampliación del plazo que tiene el tribunal para dictar sentencia definitiva en el juicio.","La delegación que hace el tribunal exhortante en el exhortado para practicar una diligencia."],"e":"Arts. 181 y 182 COT: solo procede en primera instancia, entre tribunales ordinarios de igual jerarquía, y en asuntos civiles contenciosos."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuándo se entiende prorrogada tácitamente la competencia por parte del demandado?","o":["Cuando hace cualquier gestión que no sea reclamar la incompetencia.","Cuando no contesta la demanda dentro del término de emplazamiento.","Cuando es notificado personalmente de la demanda.","Cuando designa abogado patrocinante en el juicio."],"e":"Art. 187 N° 2 COT. Por parte del demandante, la prórroga tácita se produce por el hecho de ocurrir ante el juez interponiendo su demanda (art. 187 N° 1)."},{"a":"P","u":"Procesal Orgánico","q":"¿Hasta qué cuantía conocen los jueces de letras en única instancia de las causas civiles y de comercio?","o":["Hasta 10 UTM.","Hasta 500 UTM.","Hasta 50 UTM.","Hasta 1 UTM."],"e":"Art. 45 N° 1 COT. En primera instancia conocen de las causas civiles y de comercio cuya cuantía exceda de 10 UTM (art. 45 N° 2 letra a)."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuántos ministros integran la Corte Suprema?","o":["Veintiún ministros.","Diecisiete ministros.","Quince ministros.","Treinta y cuatro ministros."],"e":"Art. 93 COT y art. 78 CPR: la Corte Suprema se compone de veintiún ministros, uno de los cuales es su presidente."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuántos ministros integran actualmente la Corte de Apelaciones de Santiago?","o":["Treinta y cuatro.","Treinta y uno.","Veintinueve.","Cuarenta y uno."],"e":"Art. 56 COT vigente: Santiago tiene 34 ministros; San Miguel y Concepción, 19 cada una; Valparaíso, 16."},{"a":"P","u":"Procesal Orgánico","q":"¿De qué conoce en única instancia la Corte de Apelaciones en sala?","o":["De la casación en la forma contra sentencias de jueces de letras de su territorio.","De los recursos de amparo y de protección deducidos dentro de su territorio jurisdiccional.","De las apelaciones contra sentencias definitivas de los jueces de letras.","De los juicios de amovilidad seguidos contra los jueces de letras."],"e":"Art. 63 N° 1 COT. Los amparos y protecciones los conoce en primera instancia (art. 63 N° 2), y las apelaciones, en segunda instancia (art. 63 N° 3)."},{"a":"P","u":"Procesal Orgánico","q":"¿Quién puede ser nombrado árbitro de derecho?","o":["Solo un abogado.","Toda persona mayor de edad que sepa leer y escribir.","Solo un juez de letras en ejercicio.","Cualquier persona con libre disposición de sus bienes."],"e":"Art. 225 COT: puede ser nombrado árbitro toda persona mayor de edad, con libre disposición de sus bienes y que sepa leer y escribir; los abogados habilitados pueden serlo aunque sean menores de edad; pero el nombramiento de árbitros de derecho solo puede recaer en un abogado."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué materias son de arbitraje prohibido según el COT?","o":["Alimentos, separación de bienes entre cónyuges, causas criminales y las que requieren oír al fiscal judicial.","Partición de bienes, liquidación de la sociedad conyugal y cuentas de los administradores de bienes ajenos.","Causas civiles de mayor cuantía, juicios ejecutivos, cobros de pagarés y cuentas de mandatarios.","Cuestiones entre socios de una sociedad anónima, liquidación de sociedades y partición de bienes."],"e":"Arts. 229 y 230 COT. La partición y la liquidación de la sociedad conyugal son materias de arbitraje forzoso (art. 227 COT)."},{"a":"P","u":"Procesal Orgánico","q":"El árbitro arbitrador:","o":["Falla según su prudencia y la equidad, y tramita según lo que las partes hayan expresado.","Falla conforme a derecho y tramita según las reglas de los jueces ordinarios.","Tramita como arbitrador, pero falla conforme a derecho, y debe ser siempre abogado habilitado.","Falla conforme a derecho, pero tramita según lo que las partes hayan expresado."],"e":"Art. 223 inc. 3 COT. El árbitro mixto tramita como arbitrador y falla conforme a derecho (art. 223 inc. final)."},{"a":"P","u":"Procesal Orgánico","q":"¿Cuál es la diferencia entre implicancia y recusación?","o":["La implicancia es irrenunciable y se declara de oficio; la recusación es renunciable y debe alegarla la parte.","La recusación es irrenunciable y se declara de oficio; la implicancia es renunciable y debe alegarla la parte.","Ambas son renunciables, pero la implicancia solo puede alegarse antes de contestar la demanda.","Ambas son irrenunciables, pero la recusación solo afecta a los auxiliares de la justicia."],"e":"Arts. 195, 196, 199 y 200 COT. Las implicancias producen nulidad de lo obrado y el juez que falla a sabiendas con implicancia comete delito; las recusaciones pueden renunciarse expresa o tácitamente."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué son los receptores judiciales?","o":["Ministros de fe que notifican fuera de la secretaría y evacuan las diligencias que les encomiendan los tribunales.","Funcionarios que reciben los escritos de las partes en la oficina de partes de cada tribunal y certifican su ingreso.","Abogados que representan gratuitamente a las partes de escasos recursos ante los tribunales.","Funcionarios que reciben la prueba testimonial en las Cortes de Apelaciones y en la Corte Suprema."],"e":"Art. 390 COT."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué principio formativo del proceso se refiere a que el tribunal solo puede pronunciarse sobre lo pedido por las partes?","o":["El principio de congruencia.","El principio de inmediación.","El principio de bilateralidad.","El principio de concentración."],"e":"La infracción a este principio genera el vicio de ultra petita, que es causal de casación en la forma (art. 768 N° 4 CPC)."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué recurso procede contra las faltas o abusos graves cometidos en la dictación de resoluciones de carácter jurisdiccional, cuando no proceden otros recursos ordinarios o extraordinarios?","o":["El recurso de queja.","El recurso de reposición.","El recurso de hecho.","El recurso de protección."],"e":"Art. 545 COT: el recurso de queja tiene por exclusiva finalidad corregir las faltas o abusos graves cometidos en la dictación de resoluciones de carácter jurisdiccional, y solo procede cuando la falta o abuso se cometa en sentencia interlocutoria que ponga fin al juicio o haga imposible su continuación, o definitiva, y que no sean susceptibles de recurso alguno, ordinario o extraordinario."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué reforma relevante sobre el nombramiento de jueces se encuentra en tramitación?","o":["Una reforma constitucional que crea un Consejo de Nombramientos Judiciales.","Una reforma que suprime la Corte Suprema y crea un Tribunal de Casación.","Una reforma que establece la elección popular de los jueces de letras.","Una reforma que traspasa los jueces de garantía al Ministerio Público."],"e":"La reforma busca reemplazar las propuestas de la Corte Suprema y las Cortes de Apelaciones por concursos a cargo de un órgano autónomo. A noviembre de 2026 no ha sido publicada, por lo que rige el sistema actual de ternas y quinas."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué es la jurisdicción voluntaria o acto judicial no contencioso?","o":["El que, según la ley, requiere la intervención del juez y en que no se promueve contienda entre partes.","El que las partes someten voluntariamente a la decisión de un árbitro arbitrador, renunciando a la justicia ordinaria.","El que se tramita ante el juez sin patrocinio de abogado, por su escasa cuantía.","El juicio en que el demandado se allana a la demanda y no se rinde prueba."],"e":"Art. 817 CPC. Los tribunales conocen de estos asuntos solo cuando una ley expresa requiere su intervención (art. 2 COT)."},{"a":"P","u":"Procesal Orgánico","q":"¿Qué es la autotutela?","o":["Un medio de solución en que una parte impone su pretensión a la otra por la fuerza.","Un medio autocompositivo en que ambas partes ceden en sus pretensiones.","La resolución del conflicto por un tercero imparcial elegido por las partes.","La renuncia unilateral de la acción por parte del demandante."],"e":"Por regla general está prohibida. Se admite excepcionalmente, por ejemplo en la legítima defensa o en el derecho de retención."},{"a":"P","u":"Normas Comunes","q":"¿Cuál es el término de emplazamiento para contestar la demanda en el juicio ordinario si el demandado es notificado en el territorio jurisdiccional del tribunal?","o":["Dieciocho días.","Quince días.","Veintiún días.","Diez días."],"e":"Art. 258 CPC vigente: dieciocho días si el demandado es notificado en el territorio jurisdiccional del tribunal en que se haya presentado la demanda. Si se encuentra en otro territorio o fuera del país, se aumenta según la tabla de emplazamiento (art. 259 CPC)."},{"a":"P","u":"Normas Comunes","q":"¿Qué es la notificación?","o":["La actuación por la cual se pone en conocimiento de las partes una resolución judicial.","El escrito con que el demandante inicia el juicio ante el tribunal competente.","La certificación del ministro de fe sobre una actuación realizada en el proceso.","El acto por el cual el tribunal cita a las partes a una audiencia de conciliación."],"e":"Sus formas están reguladas en los arts. 38 a 58 CPC. Las resoluciones solo producen efecto en virtud de notificación hecha con arreglo a la ley (art. 38 CPC)."},{"a":"P","u":"Normas Comunes","q":"¿Cómo se notifica la primera resolución judicial recaída en la demanda al demandado?","o":["Personalmente.","Por cédula.","Por el estado diario.","Por correo electrónico al abogado."],"e":"Art. 40 CPC: en toda gestión judicial, la primera notificación a las partes o personas a quienes hayan de afectar sus resultados deberá hacérseles personalmente."},{"a":"P","u":"Normas Comunes","q":"Tras la Ley 21.394, si el receptor busca al demandado en dos días distintos en su domicilio y no lo encuentra, cumpliéndose los requisitos legales:","o":["Procede la notificación del art. 44 en la misma diligencia, sin nueva orden del tribunal.","Debe pedirse al tribunal que autorice expresamente, por resolución, la notificación del art. 44.","Debe solicitarse la notificación por avisos en un diario de circulación local.","Se entiende notificado por el estado diario desde la segunda búsqueda."],"e":"La Ley 21.394 modificó el art. 44 CPC: el receptor, establecidas las circunstancias exigidas, procede a notificar en la misma diligencia, sin necesidad de nueva orden del tribunal."},{"a":"P","u":"Normas Comunes","q":"¿Qué deben designar los abogados en su primera presentación según el art. 49 CPC, modificado por la Ley 21.394?","o":["Un medio de notificación electrónico expedito y eficaz.","Un domicilio dentro de la comuna asiento del tribunal.","Un procurador del número que los represente.","Una casilla de correo postal para recibir cédulas."],"e":"Art. 49 CPC: bajo apercibimiento de serles notificadas por estado diario todas las resoluciones que se dicten en lo sucesivo. La notificación electrónica se entiende practicada desde el momento de su envío."},{"a":"P","u":"Normas Comunes","q":"¿Qué resoluciones deben notificarse por cédula según el art. 48 CPC?","o":["Las sentencias definitivas, la que recibe a prueba la causa y la que ordena la comparecencia personal de las partes.","Las sentencias interlocutorias, la que cita a oír sentencia y la que ordena la comparecencia personal de las partes.","Las sentencias definitivas, la que llama a conciliación y la que provee la demanda reconvencional.","Las sentencias definitivas, los autos que fijan audiencia y los decretos que confieren traslado."],"e":"Art. 48 CPC. El tribunal puede también ordenar que se notifique por cédula alguna otra resolución."},{"a":"P","u":"Normas Comunes","q":"¿Qué es la notificación tácita?","o":["La que se produce cuando la parte, sin estar notificada o estándolo mal, hace una gestión que supone conocer la resolución.","La que se produce cuando el receptor deja la copia en la puerta del domicilio por no encontrar a ninguna persona adulta.","La que se produce cuando la resolución se incluye en el estado diario publicado en la página web del Poder Judicial.","La que se produce cuando la parte alega la nulidad de una notificación y luego el tribunal acoge su incidente."],"e":"Art. 55 inc. 1 CPC. La notificación ficta, en cambio, es la del inc. 2: la parte que alegue la nulidad de una notificación se tiene por notificada desde que se notifique la resolución que declare la nulidad."},{"a":"P","u":"Normas Comunes","q":"¿Cómo se clasifican las resoluciones judiciales según el art. 158 CPC?","o":["Sentencias definitivas, sentencias interlocutorias, autos y decretos.","Sentencias, autos, providencias, proveídos y actas de audiencia.","Sentencias de primera instancia y de segunda instancia.","Fallos, decretos, actas, certificados y resoluciones de mero trámite."],"e":"Art. 158 CPC."},{"a":"P","u":"Normas Comunes","q":"La resolución que recibe la causa a prueba es, según la doctrina mayoritaria:","o":["Una sentencia interlocutoria de segunda clase.","Una sentencia interlocutoria de primera clase.","Un auto.","Un decreto."],"e":"Art. 158 inc. 3 CPC. Interlocutorias de primera clase son las que fallan un incidente estableciendo derechos permanentes a favor de las partes."},{"a":"P","u":"Normas Comunes","q":"¿Cuándo queda firme o ejecutoriada una resolución contra la que no procede recurso alguno?","o":["Desde que se notifica a las partes.","Desde que el tribunal la dicta.","Desde que se cumple lo ordenado.","Cinco días después de notificada."],"e":"Art. 174 CPC. Si proceden recursos: desde que se notifica el decreto que la mande cumplir, una vez terminados los recursos deducidos, o desde que transcurran todos los plazos sin que se hayan interpuesto."},{"a":"P","u":"Recursos","q":"¿Cuál es el plazo para apelar de una sentencia definitiva?","o":["Diez días desde la notificación.","Cinco días desde la notificación.","Quince días desde la notificación.","Tres días desde la notificación."],"e":"Art. 189 CPC: la apelación se interpone en el término de cinco días; tratándose de sentencias definitivas, el término es de diez días."},{"a":"P","u":"Recursos","q":"¿Cuál es el plazo para interponer el recurso de reposición contra un auto o decreto, por regla general?","o":["Cinco días fatales.","Tres días fatales.","Diez días fatales.","Veinticuatro horas."],"e":"Art. 181 CPC."},{"a":"P","u":"Normas Comunes","q":"Los plazos de días que establece el Código de Procedimiento Civil:","o":["Se suspenden durante los feriados, salvo que el tribunal disponga lo contrario.","Son de días corridos e incluyen los feriados, salvo que la ley diga otra cosa.","Se suspenden solo durante el feriado judicial de febrero.","No son fatales, salvo que la ley les dé expresamente ese carácter."],"e":"Art. 66 CPC: plazos de días hábiles. Además, son fatales cualquiera sea la forma en que se expresen, salvo los establecidos para actuaciones propias del tribunal (art. 64 CPC)."},{"a":"P","u":"Normas Comunes","q":"¿Qué es el patrocinio?","o":["Contrato solemne por el que la parte encomienda a un abogado habilitado la defensa de sus pretensiones.","Contrato por el que la parte confiere a otra persona poder para representarla en las actuaciones del juicio.","Facultad de las partes de comparecer personalmente ante el tribunal sin intervención de abogado.","Beneficio que permite litigar sin pagar derechos a los auxiliares de la administración de justicia."],"e":"Art. 1 Ley 18.120: la primera presentación de cada parte o interesado debe ser patrocinada por un abogado habilitado, so pena de tenerse por no presentada para todos los efectos legales."},{"a":"P","u":"Normas Comunes","q":"¿Qué facultades del mandato judicial requieren mención expresa (facultades especiales del art. 7 inc. 2 CPC)?","o":["Desistirse de la acción, aceptar la demanda contraria, absolver posiciones, renunciar recursos, transigir, comprometer y percibir.","Presentar escritos, asistir a audiencias, contestar la demanda, apelar, delegar el poder y notificarse de resoluciones.","Contestar la demanda, deducir reconvención, oponer excepciones, rendir prueba y apelar de la sentencia definitiva.","Notificarse de la demanda, designar domicilio, delegar el poder, recusar al juez y solicitar medidas precautorias."],"e":"Art. 7 inc. 2 CPC. Las facultades del inc. 1 (ordinarias) se entienden conferidas por el solo ministerio de la ley."},{"a":"P","u":"Normas Comunes","q":"¿En qué consiste el litisconsorcio?","o":["En la pluralidad de demandantes, demandados o ambos en un mismo proceso.","En la intervención de un tercero coadyuvante en apoyo de una de las partes.","En la reunión de dos o más procesos que deben terminar por una sola sentencia.","En la representación de varias personas por un mismo abogado patrocinante."],"e":"Puede ser activo, pasivo o mixto (art. 18 CPC)."},{"a":"P","u":"Normas Comunes","q":"¿Qué es la Ley 20.886?","o":["La ley de tramitación electrónica de los procedimientos judiciales.","La ley que creó los tribunales de familia y la mediación previa.","La ley de matrimonio igualitario y de filiación homoparental.","La ley que reformó la notificación por avisos y por cédula."],"e":"La Ley 20.886 (2015) estableció la tramitación digital de los procedimientos judiciales y la carpeta electrónica."},{"a":"P","u":"Juicio Ejecutivo","q":"En el juicio ejecutivo, ¿qué plazo tiene el ejecutado requerido de pago dentro del territorio jurisdiccional del tribunal para oponer excepciones?","o":["Ocho días.","Cuatro días.","Diez días.","Quince días."],"e":"Art. 459 CPC, modificado por la Ley 21.394. Antes el plazo era de cuatro días si el requerimiento se hacía en la comuna asiento del tribunal."},{"a":"P","u":"Procedimiento Incidental","q":"¿Qué es un incidente según el art. 82 CPC?","o":["Toda cuestión accesoria de un juicio que requiera pronunciamiento especial con audiencia de las partes.","Toda cuestión principal del juicio que el tribunal debe resolver en la sentencia definitiva.","Todo recurso que se interpone contra una resolución interlocutoria dictada en el juicio.","Toda excepción perentoria que el demandado opone al contestar la demanda."],"e":"Art. 82 CPC. Se tramita conforme a las reglas del Título IX del Libro I si no tiene señalada por la ley una tramitación especial."},{"a":"P","u":"Procedimiento Incidental","q":"¿Qué ocurre si una parte promueve un incidente después de haber realizado gestiones en el juicio, cuando el incidente nace de un hecho anterior al juicio o coexistente con su principio?","o":["Se rechaza de oficio, salvo vicio que anule el proceso o circunstancia esencial para la marcha del juicio.","Se acoge siempre, porque la parte puede promover incidentes en cualquier estado del juicio.","Se tramita en cuaderno separado, sin suspender el curso de la causa principal ni el término probatorio.","Se reserva para resolverlo en la sentencia definitiva junto con la cuestión principal."],"e":"Art. 84 inc. 1 CPC: debe promoverse antes de hacer cualquiera gestión principal en el pleito."},{"a":"P","u":"Procedimiento Incidental","q":"¿Cuál es el plazo para responder un incidente?","o":["Tres días.","Cinco días.","Seis días.","Ocho días."],"e":"Art. 89 CPC: se concede traslado y, con su respuesta o sin ella, el tribunal resuelve la cuestión, si a su juicio no hay necesidad de prueba."},{"a":"P","u":"Procedimiento Incidental","q":"¿Cuál es el término probatorio en los incidentes?","o":["Ocho días.","Veinte días.","Diez días.","Tres días."],"e":"Art. 90 CPC: término de ocho días. Dentro de los dos primeros días deben las partes acompañar una nómina de los testigos de que piensan valerse."},{"a":"P","u":"Procedimiento Incidental","q":"¿Cuál es el plazo para alegar la nulidad procesal por un vicio que no sea la falta de emplazamiento?","o":["Cinco días desde que se conoció el vicio.","Tres días desde la notificación de la sentencia.","En cualquier momento, mientras no haya sentencia.","Un año desde la dictación de la sentencia."],"e":"Art. 83 inc. 2 CPC, salvo que se trate de la incompetencia absoluta del tribunal. La nulidad por falta de emplazamiento puede alegarse dentro de cinco días desde que se tuvo conocimiento personal del juicio (art. 80 CPC)."},{"a":"P","u":"Procedimiento Incidental","q":"¿Cuándo procede el abandono del procedimiento?","o":["Cuando todas las partes han cesado en su prosecución durante seis meses desde la última resolución útil.","Cuando el demandante no ha hecho gestiones durante tres meses desde la última resolución útil.","Cuando todas las partes han cesado en su prosecución durante un año desde la última resolución útil.","Cuando el tribunal no ha dictado resolución alguna durante seis meses desde la última presentación."],"e":"Art. 152 CPC. Puede alegarse por el demandado durante todo el juicio y hasta que se haya dictado sentencia ejecutoriada (art. 153)."},{"a":"P","u":"Procedimiento Incidental","q":"¿En qué juicios NO procede el abandono del procedimiento según el art. 157 CPC vigente?","o":["En los procedimientos concursales de liquidación y en los de división o liquidación de herencias, sociedades o comunidades.","En los juicios ejecutivos de obligaciones de dar y en los de división o liquidación de herencias, sociedades o comunidades.","En los juicios sumarios, en los de arrendamiento de predios urbanos y en los de cobro de rentas impagas.","En los juicios ordinarios de mayor cuantía y en los procedimientos concursales de reorganización."],"e":"Art. 157 CPC, modificado por la Ley 20.720. En el juicio ejecutivo, el abandono procede con reglas especiales (art. 153 inc. 2)."},{"a":"P","u":"Procedimiento Incidental","q":"¿Qué efecto produce el desistimiento de la demanda aceptado por el tribunal?","o":["Extingue las acciones a que se refiere respecto de las partes y de quienes habría afectado la sentencia.","Pone término solo al procedimiento, de modo que el demandante puede renovar la acción después.","Suspende el procedimiento durante seis meses, al cabo de los cuales el juicio continúa.","Produce el abandono del procedimiento, que puede alegar el demandado en cualquier momento."],"e":"Art. 150 CPC. El desistimiento produce cosa juzgada."},{"a":"P","u":"Procedimiento Incidental","q":"¿Qué incidente tiene por objeto reunir en un solo proceso dos o más procesos que deban constituir un solo juicio y terminar por una sola sentencia?","o":["La acumulación de autos.","La conexión de causas.","La reconvención.","La radicación."],"e":"Art. 92 CPC. Procede cuando se cumplen las causales de esa norma, y siempre que los juicios estén sometidos a una misma clase de procedimiento."},{"a":"P","u":"Procedimiento Incidental","q":"¿Qué es el privilegio de pobreza?","o":["Beneficio que permite litigar sin pagar derechos ni costas a los auxiliares de la administración de justicia.","Derecho de las personas de escasos recursos a no ser demandadas por deudas de menor cuantía.","Exención del impuesto de timbres y estampillas en las actuaciones judiciales de menor cuantía.","Derecho de la parte de escasos recursos a elegir libremente el tribunal ante el cual litigará su causa."],"e":"Arts. 129 y siguientes CPC y 591 y siguientes COT. Gozan de él por el solo ministerio de la ley los patrocinados por las Corporaciones de Asistencia Judicial (art. 600 COT)."},{"a":"P","u":"Procedimiento Incidental","q":"En el incidente de nulidad procesal, ¿qué principio exige que el vicio ocasione un perjuicio reparable solo con la declaración de nulidad?","o":["El principio de trascendencia.","El principio de especificidad.","El principio de convalidación.","El principio de protección."],"e":"Art. 83 inc. 1 CPC: la nulidad procesal podrá ser declarada siempre que exista un vicio que irrogue a alguna de las partes un perjuicio reparable solo con la declaración de nulidad."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Cuáles son las medidas precautorias que enumera el art. 290 CPC?","o":["Secuestro, nombramiento de interventores, retención de bienes y prohibición de celebrar actos o contratos.","Embargo, retención de bienes, arraigo del demandado y prohibición de celebrar actos o contratos.","Secuestro, arraigo, caución de resultas y prohibición de enajenar bienes futuros.","Secuestro, exhibición de documentos, inspección personal y retención de bienes."],"e":"Art. 290 CPC. El art. 298 permite además otras medidas no expresamente autorizadas, con caución."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"Las medidas precautorias pueden pedirse por el demandante:","o":["En cualquier estado del juicio, aun antes de contestada la demanda.","Solo antes de presentar la demanda, como medida prejudicial.","Solo después de la resolución que recibe la causa a prueba.","Solo en segunda instancia, si la sentencia fue favorable."],"e":"Art. 290 CPC: para asegurar el resultado de la acción. Pueden solicitarse también como prejudiciales precautorias (art. 279 CPC)."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué requisito general exige el art. 298 CPC para conceder medidas precautorias?","o":["Comprobantes que constituyan a lo menos presunción grave del derecho que se reclama.","Caución suficiente en todos los casos, fijada por el tribunal según la cuantía.","Contestación de la demanda y recepción de la causa a prueba.","Constitución en mora del demandado mediante requerimiento judicial."],"e":"Art. 298 CPC. El tribunal puede además exigir caución para responder de los perjuicios."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"Concedida una medida prejudicial precautoria, ¿en qué plazo debe presentarse la demanda?","o":["Diez días, ampliable hasta treinta.","Cinco días, ampliable hasta quince.","Treinta días improrrogables.","Sesenta días improrrogables."],"e":"Art. 280 CPC: si no se deduce demanda oportunamente, o no se pide en ella que continúen en vigor las medidas, o el tribunal no mantiene las medidas, el que las solicitó queda responsable de los perjuicios, y se presume dolosa su conducta."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuál es la cuantía del juicio ordinario de mayor cuantía?","o":["Más de 500 UTM.","Más de 10 UTM.","Más de 1.000 UTM.","Más de 200 UTM."],"e":"Art. 698 CPC: el juicio de menor cuantía se aplica a los juicios ordinarios de más de 10 y no más de 500 UTM."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuáles son los escritos del período de discusión en el juicio ordinario de mayor cuantía?","o":["Demanda, contestación, réplica y dúplica.","Demanda, contestación y observaciones a la prueba.","Demanda y contestación solamente.","Demanda, excepciones, réplica y alegato."],"e":"Arts. 253 a 312 CPC. Si hay reconvención, se agregan la contestación, réplica y dúplica de la reconvención."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuál es una de las excepciones dilatorias del art. 303 CPC?","o":["La ineptitud del libelo.","La prescripción de la acción.","El pago de la deuda.","La nulidad del contrato."],"e":"Art. 303 CPC: incompetencia, falta de capacidad o de personería, litis pendencia, ineptitud del libelo, beneficio de excusión, y en general las que se refieran a la corrección del procedimiento sin afectar el fondo de la acción. La cosa juzgada y la transacción pueden oponerse como dilatorias (art. 304 CPC: excepciones mixtas)."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué excepciones perentorias pueden oponerse en cualquier estado de la causa (excepciones anómalas)?","o":["Prescripción, cosa juzgada, transacción y pago efectivo fundado en antecedente escrito.","Prescripción, nulidad, compensación y pago efectivo fundado en antecedente escrito.","Incompetencia, litis pendencia, ineptitud del libelo y falta de capacidad.","Cosa juzgada, beneficio de excusión, novación y remisión de la deuda."],"e":"Art. 310 CPC: pueden oponerse en cualquier estado de la causa, pero no se admitirán si no se alegan por escrito antes de la citación para sentencia en primera instancia, o de la vista de la causa en segunda."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué trámite obligatorio debe realizar el juez en el juicio ordinario después de evacuada la dúplica, salvo excepciones legales?","o":["Llamar a las partes a conciliación.","Citar a las partes a oír sentencia.","Recibir la causa a prueba.","Decretar medidas para mejor resolver."],"e":"Art. 262 CPC: el llamado a conciliación es trámite esencial en primera instancia (art. 795 N° 2 CPC), salvo en los casos que la ley excluye."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuál es el término probatorio ordinario en el juicio ordinario?","o":["Veinte días.","Diez días.","Ocho días.","Treinta días."],"e":"Art. 328 CPC: para rendir prueba dentro del territorio jurisdiccional del tribunal las partes tienen el término de veinte días, que puede reducirse por acuerdo unánime de las partes."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Dentro de qué plazo deben las partes presentar la lista de testigos en el juicio ordinario?","o":["Hasta el quinto día desde la última notificación de la resolución que recibe la causa a prueba.","Hasta el décimo día desde la última notificación de la resolución que recibe la causa a prueba.","Hasta el último día del término probatorio ordinario, en cualquier momento.","Con la demanda o la contestación, según quien ofrezca la prueba."],"e":"Art. 320 CPC: en ese plazo cada parte presenta una minuta de los puntos sobre que piensa rendir prueba de testigos y la nómina de testigos. Si se pidió reposición, el plazo corre dentro de los cinco días siguientes a la notificación por el estado de la resolución que se pronuncie sobre la última reposición."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Cuáles son los medios de prueba que enumera el art. 341 CPC?","o":["Instrumentos, testigos, confesión, inspección personal, peritos y presunciones.","Instrumentos, testigos, confesión, juramento deferido, peritos y presunciones.","Instrumentos, testigos, absolución de posiciones e informes de la policía.","Instrumentos públicos, privados, testigos y declaración jurada del demandante."],"e":"Art. 341 CPC, en concordancia con el art. 1698 inc. 2 CC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué plazo tiene el juez para dictar sentencia definitiva en el juicio ordinario?","o":["Sesenta días.","Treinta días.","Diez días.","No hay plazo legal."],"e":"Art. 162 inc. 3 CPC."},{"a":"P","u":"Juicio Ordinario de Mayor Cuantía","q":"¿Qué es la reconvención?","o":["La demanda que el demandado deduce contra el demandante en el mismo juicio, al contestar.","El escrito en que el demandante responde a las excepciones opuestas por el demandado.","La excepción perentoria con que el demandado alega que el actor también le debe.","La oposición del demandado a una medida precautoria decretada en su contra."],"e":"Art. 314 CPC. El tribunal debe ser competente para conocer de ella estimada como demanda, o admitir prórroga de jurisdicción."},{"a":"P","u":"Medidas Prejudiciales y Precautorias","q":"¿Qué son las medidas prejudiciales preparatorias?","o":["Las que pide el futuro demandante para preparar su entrada al juicio, como la exhibición de documentos.","Las que pide el futuro demandante para asegurar el resultado de la acción, como el secuestro.","Las que pide el futuro demandante para rendir prueba que puede desaparecer, como la inspección.","Las que decreta el tribunal de oficio para mejor resolver, después de citar a oír sentencia."],"e":"Art. 273 CPC. Las prejudiciales probatorias (art. 281 y siguientes) y precautorias (art. 279) tienen otras finalidades."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué deber incorporó el nuevo art. 3 bis del CPC (Ley 21.394)?","o":["Promover métodos autocompositivos, como la conciliación y la mediación.","Fallar las causas civiles en un plazo máximo de treinta días desde la citación a oír sentencia.","Someter todo juicio civil a mediación previa obligatoria.","Comparecer personalmente a todas las audiencias del juicio."],"e":"Art. 3 bis CPC: estos métodos no pueden restringir, sustituir ni impedir la garantía de tutela jurisdiccional."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué cambió la Ley 21.394 en la tabla de emplazamiento?","o":["Se aplica si el demandado está en otro territorio jurisdiccional o fuera del país, sin distinguir comunas.","Se aplica si el demandado está fuera de la comuna asiento del tribunal, aunque sea en su territorio.","Se eliminó la tabla y el término es siempre de dieciocho días, cualquiera sea el lugar.","La tabla la fija ahora cada juez de letras, según la distancia del domicilio del demandado."],"e":"Arts. 258 y 259 CPC vigentes."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿Qué posibilidad incorporó la Ley 21.394 respecto de las audiencias?","o":["Comparecencia remota en ciertos casos, aunque la regla general sigue siendo la presencialidad.","Eliminación de las audiencias presenciales, que pasan a ser todas por videoconferencia.","Grabación obligatoria de todas las audiencias por las partes, bajo sanción de nulidad.","Supresión de las audiencias, que se reemplazan por escritos presentados en la OJV."],"e":"La ley introdujo reglas permanentes sobre audiencias remotas, cuya aplicación se detalla en el COT, el CPC y autos acordados."},{"a":"P","u":"Procesal Penal","q":"En materia procesal penal, tras la Ley 21.694 (posterior a la Ley 21.394), ¿cuál es el plazo para interponer el recurso de nulidad?","o":["Quince días.","Diez días.","Cinco días.","Treinta días."],"e":"Art. 372 CPP vigente: quince días, con un día adicional por cada dos de exceso si el juicio duró más de cinco días, sin superar treinta días."},{"a":"P","u":"Ley 21.394 (reformas a la justicia)","q":"¿A qué delitos extendió la Ley 21.394 los acuerdos reparatorios del art. 241 CPP?","o":["A ciertos delitos del Código Penal, como los de los arts. 146, 161-A y 296, y a los de propiedad industrial e intelectual.","A todos los crímenes y simples delitos, siempre que la víctima consienta y el fiscal no se oponga a su aprobación.","A los delitos de homicidio y lesiones graves, siempre que el imputado repare el daño causado.","A los delitos de la Ley 20.000 sobre drogas, siempre que se trate de microtráfico."],"e":"Art. 241 inc. 3 CPP."},{"a":"C","u":"Sucesorio","q":"¿Quiénes integran el primer orden de sucesión intestada?","o":["Los hijos y el cónyuge sobreviviente.","Los ascendientes y el cónyuge sobreviviente.","Los hermanos y los sobrinos del causante.","Los colaterales hasta el sexto grado."],"e":"Art. 988 CC: orden de los descendientes."},{"a":"C","u":"Sucesorio","q":"¿Quiénes integran el segundo orden de sucesión intestada?","o":["El cónyuge y los ascendientes de grado más próximo.","Los hijos y el cónyuge sobreviviente del causante.","Los hermanos y el cónyuge sobreviviente.","Los colaterales y el Fisco, por partes iguales."],"e":"Art. 989 CC: la herencia se divide en tres partes, dos para el cónyuge y una para los ascendientes."},{"a":"C","u":"Sucesorio","q":"¿Quiénes heredan en el tercer orden de sucesión intestada?","o":["Los hermanos.","Los ascendientes.","Los sobrinos nietos.","El Fisco."],"e":"Art. 990 CC: si no hay descendientes, ascendientes ni cónyuge, suceden los hermanos; el hermano de doble conjunción lleva el doble que el de simple conjunción."},{"a":"C","u":"Sucesorio","q":"¿Hasta qué grado heredan los colaterales en el cuarto orden de sucesión intestada?","o":["Hasta el sexto grado inclusive.","Hasta el cuarto grado inclusive.","Hasta el tercer grado inclusive.","Sin límite de grado."],"e":"Art. 992 CC: los colaterales de grado más próximo, hasta el sexto grado inclusive."},{"a":"C","u":"Sucesorio","q":"¿Quién hereda en el último orden de sucesión intestada?","o":["El Fisco.","La municipalidad del domicilio del causante.","La Corporación de Asistencia Judicial.","Los acreedores del causante."],"e":"Art. 995 CC: a falta de todos los herederos abintestato, sucede el Fisco."},{"a":"C","u":"Sucesorio","q":"¿Cuáles son las formas o títulos de heredar en la sucesión intestada?","o":["Por derecho personal, por representación y por transmisión.","Por testamento, por donación revocable y por contrato.","Por cabeza, por legado y por acrecimiento forzoso.","Por derecho propio, por cesión y por accesión."],"e":"Arts. 984 y 957 CC. En la sucesión testada no opera la representación, salvo en las legítimas."},{"a":"C","u":"Sucesorio","q":"Cuando se sucede por representación, ¿cómo se divide la herencia?","o":["Por estirpes.","Por cabezas.","Por partes iguales entre todos.","Según lo decida el juez."],"e":"Art. 985 CC: los que suceden por representación heredan en todos casos por estirpes."},{"a":"C","u":"Sucesorio","q":"¿Qué es la masa partible o acervo ilíquido?","o":["El conjunto de bienes del causante confundidos con bienes de otras personas, antes de separarlos.","El conjunto de bienes del causante una vez deducidas las bajas generales de la herencia.","La mitad de los bienes del causante que la ley asigna a los legitimarios.","El conjunto de bienes del causante más las donaciones que hizo en vida."],"e":"El acervo bruto o común contiene bienes ajenos (p. ej., gananciales del cónyuge); separados éstos queda el acervo ilíquido; deducidas las bajas generales (art. 959 CC) queda el acervo líquido."},{"a":"C","u":"Sucesorio","q":"¿Cuál de las siguientes es una baja general de la herencia según el art. 959 CC?","o":["Las deudas hereditarias.","Los legados.","Las donaciones revocables.","La cuarta de mejoras."],"e":"Art. 959 CC: costas de publicación del testamento y de apertura de la sucesión, deudas hereditarias, impuestos fiscales que gravan toda la masa y asignaciones alimenticias forzosas."},{"a":"C","u":"Sucesorio","q":"¿Qué son las asignaciones forzosas?","o":["Las que el testador está obligado a hacer, y que se suplen si no las hizo.","Las que el testador hace libremente con la cuarta de libre disposición.","Las que la ley impone a los herederos en favor de los acreedores del causante.","Las que el juez asigna a los herederos cuando el testamento es nulo."],"e":"Art. 1167 CC: los alimentos que se deben por ley a ciertas personas, las legítimas y la cuarta de mejoras."},{"a":"C","u":"Sucesorio","q":"¿A quiénes puede favorecer el testador con la cuarta de mejoras?","o":["A sus descendientes, cónyuge y ascendientes.","A cualquier persona, pariente o extraña.","Solo a sus hijos y nietos legítimos.","Solo a su cónyuge y a sus hermanos."],"e":"Art. 1195 CC. El conviviente civil también puede ser asignatario de la cuarta de mejoras (Ley 20.830)."},{"a":"C","u":"Sucesorio","q":"¿Qué es la legítima efectiva?","o":["La rigorosa aumentada con lo no dispuesto de las cuartas de mejoras y libre disposición.","La mitad legitimaria dividida por partes iguales entre todos los legitimarios presentes.","La legítima que corresponde al cónyuge sobreviviente cuando concurre con hijos.","La legítima que se calcula sobre el acervo imaginario, excluidos los legados."],"e":"Art. 1191 CC."},{"a":"C","u":"Sucesorio","q":"¿Qué clases de testamento solemne existen en Chile?","o":["Abierto y cerrado.","Verbal y escrito.","Militar y marítimo.","Público y privado."],"e":"Art. 1008 CC. Los testamentos privilegiados son el verbal, el militar y el marítimo."},{"a":"C","u":"Sucesorio","q":"¿Cuál de los siguientes es un testamento menos solemne o privilegiado?","o":["El testamento verbal.","El testamento cerrado.","El testamento abierto ante notario.","El testamento ante juez de letras."],"e":"Art. 1030 CC: son privilegiados el testamento verbal, el militar y el marítimo."},{"a":"C","u":"Sucesorio","q":"¿Qué es el testamento cerrado?","o":["Aquel en que testigos y escribano no conocen las disposiciones.","Aquel que se otorga ante cinco testigos, sin notario, donde no hay escribano.","Aquel que se otorga verbalmente en caso de peligro inminente de muerte.","Aquel que no puede abrirse sino diez años después de la muerte del testador."],"e":"Art. 1008 inc. 3 CC. Debe otorgarse ante escribano y tres testigos (art. 1021 CC)."},{"a":"C","u":"Sucesorio","q":"¿Cuál es una característica del testamento?","o":["Es esencialmente revocable.","Es un acto bilateral.","Puede otorgarse por mandatario.","Puede ser conjunto entre cónyuges."],"e":"Arts. 999, 1003 y 1004 CC: es un acto unilateral, solemne, personalísimo, indelegable y revocable; el testamento conjunto está prohibido."},{"a":"C","u":"Sucesorio","q":"¿Qué es el albacea?","o":["La persona encargada por el testador de ejecutar sus disposiciones.","La persona que administra los bienes de la herencia yacente.","El heredero que recibe la mayor parte de la herencia del causante.","El partidor nombrado por el juez para dividir la herencia."],"e":"Art. 1270 CC."},{"a":"C","u":"Sucesorio","q":"¿Qué es la herencia yacente?","o":["La no aceptada en quince días, sin albacea con tenencia de bienes que haya aceptado.","La herencia que se encuentra embargada por los acreedores del causante.","La herencia que se defiere al Fisco por falta absoluta de herederos.","La herencia que se encuentra en partición ante un juez árbitro."],"e":"Art. 1240 CC: el juez la declara yacente y le nombra un curador."},{"a":"C","u":"Sucesorio","q":"¿Qué es la acción de petición de herencia?","o":["La de quien prueba su derecho a una herencia ocupada por otro como heredero.","La del legatario para exigir a los herederos la entrega de su legado.","La del legitimario para exigir que se reforme el testamento del causante.","La del acreedor hereditario para pedir la separación de patrimonios."],"e":"Art. 1264 CC."},{"a":"C","u":"Sucesorio","q":"¿Qué acción tiene el legitimario a quien el testador no ha dejado lo que por ley le corresponde?","o":["La acción de reforma del testamento.","La acción de petición de herencia.","La acción de nulidad del testamento.","La acción reivindicatoria."],"e":"Art. 1216 CC: prescribe en cuatro años desde que el legitimario tuvo conocimiento del testamento y de su calidad de tal."},{"a":"C","u":"Sucesorio","q":"¿Cuál es el efecto de la partición?","o":["Declarativo: cada asignatario se reputa sucesor inmediato y exclusivo del difunto.","Constitutivo: cada asignatario adquiere el dominio solo desde la partición.","Traslaticio: los comuneros se transfieren recíprocamente sus cuotas.","Suspensivo: la herencia queda en suspenso hasta la inscripción especial."],"e":"Art. 1344 CC."},{"a":"C","u":"Sucesorio","q":"¿Cuál es el plazo máximo para que se mantenga la indivisión de la herencia por pacto?","o":["Cinco años, renovable.","Diez años, no renovable.","Un año, renovable.","No hay plazo; puede ser perpetua."],"e":"Art. 1317 CC: la partición puede siempre pedirse; no puede estipularse proindivisión por más de cinco años, pero cumplido el término puede renovarse."},{"a":"C","u":"Sucesorio","q":"¿Qué es el derecho de acrecimiento?","o":["El de un coasignatario para llevar la porción de otro que falta, si no se designaron cuotas.","El del heredero de quien murió sin aceptar ni repudiar, para aceptar o repudiar por él.","El del nieto para ocupar el lugar de su padre premuerto en la sucesión del abuelo.","El del cónyuge para aumentar su porción con la cuarta de mejoras no asignada."],"e":"Art. 1147 CC."},{"a":"C","u":"Sucesorio","q":"¿Dentro de qué plazo puede el heredero requerido declarar si acepta o repudia?","o":["Cuarenta días desde que se le requiere.","Quince días desde que se le requiere.","Un año desde la apertura de la sucesión.","Seis meses desde la muerte del causante."],"e":"Art. 1232 CC: todo asignatario puede ser obligado, a instancia de un interesado, a declarar si acepta o repudia dentro de cuarenta días."},{"a":"C","u":"Sucesorio","q":"¿Cuál es una causal de indignidad para suceder según el art. 968 CC?","o":["Haber cometido homicidio o femicidio en la persona del difunto.","Haber contraído matrimonio sin el consentimiento del causante.","Haber demandado al causante en un juicio civil de cobro.","Haber vivido separado del causante durante más de un año."],"e":"Art. 968 N° 1 CC."},{"a":"C","u":"Familia","q":"¿Qué es el parentesco por consanguinidad?","o":["El que existe entre personas que descienden una de otra o de un mismo progenitor.","El que existe entre una persona casada y los consanguíneos de su cónyuge.","El que nace de la adopción entre el adoptante y el adoptado.","El que existe entre dos personas que viven juntas en forma estable."],"e":"Art. 28 CC."},{"a":"C","u":"Familia","q":"¿Qué es el parentesco por afinidad?","o":["El que existe entre una persona casada o que lo estuvo y los consanguíneos de su cónyuge.","El que existe entre dos personas que descienden de un mismo progenitor común.","El que existe entre los convivientes de hecho y los padres de cada uno de ellos.","El que existe entre el adoptante y los hijos biológicos del adoptado."],"e":"Art. 31 CC. La Ley 20.830 hace aplicable el parentesco por afinidad a los convivientes civiles."},{"a":"C","u":"Familia","q":"¿En qué grado son parientes dos hermanos?","o":["Colaterales en segundo grado.","Colaterales en primer grado.","En línea recta en segundo grado.","Colaterales en tercer grado."],"e":"Art. 27 CC: los grados se cuentan por el número de generaciones; en la colateral se sube al tronco común y se baja al otro pariente."},{"a":"C","u":"Familia","q":"¿Cuál de los siguientes es un impedimento dirimente absoluto para contraer matrimonio?","o":["Tener un vínculo matrimonial no disuelto.","Ser pariente colateral en cuarto grado.","No haber pedido el asenso de los padres.","Ser viuda con menos de 270 días desde la muerte del marido."],"e":"Art. 5 LMC: no pueden contraer matrimonio los que se hallaren ligados por vínculo matrimonial no disuelto o por un acuerdo de unión civil vigente, salvo que se celebre entre los mismos convivientes."},{"a":"C","u":"Familia","q":"¿Qué es la separación judicial?","o":["La que suspende la vida en común sin disolver el vínculo matrimonial.","Una forma de terminación del matrimonio que permite volver a casarse.","Una medida cautelar que se decreta dentro del juicio de divorcio.","La disolución de la sociedad conyugal decretada por sentencia judicial."],"e":"Arts. 26 y siguientes LMC: los cónyuges siguen casados; no pueden contraer nuevo matrimonio."},{"a":"C","u":"Familia","q":"¿Cuáles son las causales de terminación del matrimonio según el art. 42 LMC?","o":["Muerte de un cónyuge, muerte presunta, nulidad y divorcio.","Muerte de un cónyuge, separación judicial, nulidad y divorcio.","Muerte, divorcio, separación de hecho y abandono del hogar.","Nulidad, divorcio y separación judicial solamente."],"e":"Art. 42 LMC. La separación judicial no pone término al matrimonio."},{"a":"C","u":"Familia","q":"¿Qué es la compensación económica?","o":["El derecho del cónyuge que no pudo trabajar o lo hizo en menor medida por dedicarse al hogar y los hijos.","La pensión de alimentos que se debe al cónyuge más débil mientras dure el matrimonio.","El derecho del cónyuge a la mitad de los gananciales al término del régimen patrimonial.","La indemnización por daño moral que se debe al cónyuge inocente en el divorcio culpable."],"e":"Art. 61 LMC."},{"a":"C","u":"Familia","q":"¿Cuáles son los regímenes patrimoniales del matrimonio en Chile?","o":["Sociedad conyugal, separación de bienes y participación en los gananciales.","Sociedad conyugal, comunidad de bienes y patrimonio reservado.","Separación de bienes, comunidad de gananciales y bienes familiares.","Sociedad conyugal, sociedad de hecho y separación total."],"e":"Arts. 135, 152 y 1792-1 CC."},{"a":"C","u":"Familia","q":"¿Cuáles son los tres patrimonios que pueden existir en la sociedad conyugal?","o":["El social, el propio del marido y el de la mujer.","El social, el familiar y el de los hijos menores.","El común, el reservado y el de la herencia futura.","El del marido, el de la mujer y el de los terceros."],"e":"Además puede existir el patrimonio reservado de la mujer (art. 150 CC)."},{"a":"C","u":"Familia","q":"¿Qué es el patrimonio reservado de la mujer casada en sociedad conyugal?","o":["El que forma con lo ganado en su trabajo separado del marido y lo que adquiere con ello.","El que forma con los bienes que recibe por herencia o donación durante el matrimonio.","El que forma con los bienes que tenía antes del matrimonio y que el marido no administra.","El que forma con los bienes que el juez declaró familiares en un juicio de familia."],"e":"Art. 150 CC."},{"a":"C","u":"Familia","q":"¿Cómo ingresan a la sociedad conyugal los bienes muebles que los cónyuges aportan o adquieren a título gratuito?","o":["Al haber relativo, con cargo de recompensa.","Al haber absoluto, sin cargo de recompensa.","Al patrimonio propio del cónyuge, sin ingresar a la sociedad.","Al patrimonio reservado de la mujer."],"e":"Art. 1725 N° 3 y 4 CC."},{"a":"C","u":"Familia","q":"¿A qué haber ingresan los bienes raíces adquiridos a título oneroso durante la sociedad conyugal?","o":["Al haber absoluto de la sociedad.","Al haber relativo de la sociedad.","Al patrimonio propio del adquirente.","Al patrimonio reservado de la mujer."],"e":"Art. 1725 N° 5 CC."},{"a":"C","u":"Familia","q":"¿Qué régimen se caracteriza porque los patrimonios se mantienen separados durante el matrimonio y al terminar se compensan las ganancias?","o":["La participación en los gananciales.","La sociedad conyugal con capitulaciones.","La separación total de bienes pactada.","La comunidad de bienes entre los cónyuges."],"e":"Art. 1792-2 CC: a su término, el cónyuge que obtuvo menores gananciales tiene derecho a participar por mitad en el excedente."},{"a":"C","u":"Familia","q":"¿Cómo se determina la filiación matrimonial respecto del padre?","o":["Por la presunción de paternidad del marido.","Por el reconocimiento del padre ante el Registro Civil.","Por sentencia judicial dictada en juicio de filiación.","Por la sola declaración de la madre al inscribir el nacimiento."],"e":"Art. 184 CC: se presumen hijos del marido los nacidos después de la celebración del matrimonio y dentro de los 300 días siguientes a su disolución o a la separación judicial."},{"a":"C","u":"Familia","q":"¿Qué derechos y deberes regula la patria potestad?","o":["Los que corresponden a los padres sobre los bienes de sus hijos no emancipados.","Los que corresponden a los padres sobre la persona de sus hijos menores.","Los que corresponden a los hijos sobre los bienes de sus padres.","Los que corresponden al tutor sobre los bienes del pupilo."],"e":"Art. 243 CC. Los derechos y deberes sobre la persona del hijo son la autoridad parental (cuidado personal, relación directa y regular, etc.)."},{"a":"C","u":"Familia","q":"¿Qué principio rector rige las decisiones sobre niños, niñas y adolescentes?","o":["El interés superior del niño.","El interés de la familia.","La autoridad del padre.","La voluntad de los progenitores."],"e":"Arts. 222 y 242 CC; Ley 21.430 sobre garantías y protección integral de los derechos de la niñez y adolescencia."},{"a":"C","u":"Familia","q":"¿Qué es la relación directa y regular?","o":["La que mantiene con su hijo el padre o madre que no tiene su cuidado personal.","El régimen de cuidado personal compartido entre ambos progenitores separados.","La obligación del hijo mayor de edad de visitar periódicamente a sus padres.","El derecho de los abuelos a tener el cuidado personal del nieto menor."],"e":"Art. 229 CC."},{"a":"C","u":"Familia","q":"¿Hasta qué edad se deben alimentos a los descendientes, por regla general?","o":["Hasta los 21, o los 28 si estudian una profesión u oficio.","Hasta los 18 años, sin excepción alguna por estudios.","Hasta los 25 años en todo caso, estudien o no.","Hasta que obtengan su primer contrato de trabajo."],"e":"Art. 332 CC."},{"a":"C","u":"Familia","q":"¿Qué tribunal conoce de los juicios de alimentos?","o":["El juzgado de familia.","El juzgado de letras en lo civil.","El juzgado de policía local.","La Corte de Apelaciones."],"e":"Art. 8 Ley 19.968, que crea los tribunales de familia."},{"a":"C","u":"Familia","q":"¿Qué es el acuerdo de unión civil?","o":["Un contrato entre dos personas que comparten un hogar, para regular los efectos de su vida afectiva en común.","Un contrato de matrimonio entre personas del mismo sexo, celebrado ante el Registro Civil y dos testigos.","Una convivencia de hecho que la ley reconoce de pleno derecho después de dos años de vida en común.","Un pacto de separación de bienes que los novios celebran ante notario antes del matrimonio."],"e":"Art. 1 Ley 20.830."},{"a":"C","u":"Familia","q":"¿Qué régimen patrimonial rige supletoriamente en el acuerdo de unión civil?","o":["La separación de bienes.","La sociedad conyugal supletoria.","La participación en los gananciales.","La comunidad de bienes por mitades."],"e":"Art. 15 Ley 20.830."},{"a":"C","u":"Familia","q":"¿Cuál es el plazo para pedir el divorcio de común acuerdo?","o":["Un año de cese efectivo de la convivencia.","Tres años de cese efectivo de la convivencia.","Seis meses de cese efectivo de la convivencia.","Cinco años de cese efectivo de la convivencia."],"e":"Art. 55 inc. 1 LMC, con un acuerdo completo y suficiente que regule sus relaciones mutuas y con los hijos."},{"a":"C","u":"Familia","q":"¿Qué es la nulidad de matrimonio?","o":["La sanción por celebrarse sin cumplir los requisitos de validez.","La terminación de un matrimonio válido por voluntad de uno o ambos cónyuges.","La suspensión de la vida en común de los cónyuges por resolución judicial.","La sanción al cónyuge que incumple gravemente los deberes del matrimonio."],"e":"Arts. 44 y siguientes LMC."},{"a":"C","u":"Familia","q":"¿Qué efecto tiene el matrimonio nulo putativo?","o":["Produce los efectos del válido respecto del cónyuge de buena fe, mientras dure la justa causa de error.","No produce efecto alguno respecto de ninguno de los cónyuges ni de los hijos comunes.","Produce todos sus efectos en forma indefinida, como si se tratara de un matrimonio válido.","Solo produce efectos respecto de los hijos nacidos antes de la presentación de la demanda."],"e":"Art. 51 LMC: se requiere que se haya celebrado o ratificado ante oficial del Registro Civil y buena fe y justa causa de error de a lo menos uno de los cónyuges."},{"a":"C","u":"Familia","q":"Entre los cónyuges, ¿existe obligación de alimentos?","o":["Los cónyuges se deben alimentos recíprocamente.","Solo el marido debe alimentos a la mujer.","Solo se deben alimentos si hay hijos comunes.","Los cónyuges no se deben alimentos entre sí."],"e":"Arts. 131 y 321 N° 1 CC."},{"a":"C","u":"Teoría de la Ley","q":"¿Desde cuándo es obligatoria la ley, por regla general?","o":["Desde su publicación en el Diario Oficial.","Desde su promulgación por el Presidente.","Desde su aprobación por el Congreso.","Treinta días después de su publicación."],"e":"Art. 7 CC: desde la fecha de publicación se entiende conocida de todos y es obligatoria, salvo que la propia ley establezca otra cosa."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué establece el art. 8 CC?","o":["Nadie puede alegar ignorancia de la ley una vez que ha entrado en vigencia.","La ley solo puede disponer para lo futuro y no tiene efecto retroactivo.","La costumbre no constituye derecho sino cuando la ley se remite a ella.","Los jueces no pueden excusarse de fallar por falta de ley que resuelva."],"e":"Art. 8 CC: presunción de conocimiento de la ley."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué sanción tienen, por regla general, los actos que prohíbe la ley?","o":["Son nulos, salvo que la ley designe otro efecto.","Son inexistentes en todo caso, sin excepción.","Son anulables relativamente a petición de parte.","Son válidos, pero obligan a indemnizar perjuicios."],"e":"Art. 10 CC."},{"a":"C","u":"Teoría de la Ley","q":"¿Pueden renunciarse los derechos conferidos por las leyes?","o":["Sí, si solo miran al interés individual y no está prohibida su renuncia.","No, nunca, porque todas las leyes son de orden público.","Sí, siempre, por el principio de la autonomía de la voluntad.","Solo con autorización judicial previa y por escritura pública."],"e":"Art. 12 CC."},{"a":"C","u":"Teoría de la Ley","q":"Según el principio de especialidad (art. 13 CC):","o":["Las normas particulares de una ley prevalecen sobre las generales de la misma ley.","Las normas generales de una ley prevalecen siempre sobre las particulares.","La ley posterior prevalece siempre sobre la anterior, aunque sea general.","Las leyes especiales solo se aplican si lo pide expresamente una de las partes."],"e":"Art. 13 CC."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué es la interpretación auténtica de la ley?","o":["La que hace el propio legislador por medio de una ley interpretativa.","La que hacen los tribunales al aplicar la ley a un caso concreto.","La que hacen los profesores de derecho en sus obras.","La que hace la Contraloría General de la República."],"e":"Art. 3 inc. 1 CC: solo toca al legislador explicar o interpretar la ley de un modo generalmente obligatorio."},{"a":"C","u":"Teoría de la Ley","q":"¿Cómo se entienden las palabras de la ley, por regla general?","o":["En su sentido natural y obvio, según el uso general.","En su sentido técnico, según la ciencia jurídica.","En el sentido que les asigne el juez del caso.","En el sentido que les dé el diccionario jurídico."],"e":"Art. 20 CC: pero cuando el legislador las haya definido expresamente, se les dará su significado legal."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué prescribe el art. 23 CC sobre lo favorable u odioso de una disposición?","o":["No se toma en cuenta para ampliar o restringir su interpretación.","Lo favorable debe ampliarse y lo odioso restringirse siempre.","Lo odioso debe interpretarse siempre a favor del deudor.","Lo favorable debe interpretarse siempre a favor del Estado."],"e":"Art. 23 CC."},{"a":"C","u":"Teoría de la Ley","q":"¿Qué son las leyes de orden público?","o":["Las que miran al interés general y no pueden ser alteradas por los particulares.","Las que regulan exclusivamente la organización del Estado y de sus órganos.","Las que establecen delitos y sus penas, y se aplican por los tribunales penales.","Las que solo pueden ser aprobadas por quórum calificado en el Congreso."],"e":"Se vinculan con los arts. 12 y 1462 CC (objeto ilícito en lo que contraviene el derecho público chileno)."},{"a":"C","u":"Teoría de la Ley","q":"¿Cuáles son las formas de derogación de la ley?","o":["Expresa, tácita y orgánica.","Expresa, tácita y por desuso.","Total, parcial y por costumbre.","Judicial, legal y administrativa."],"e":"Art. 52 CC distingue expresa y tácita; la doctrina agrega la orgánica, cuando una ley regula íntegramente una materia."},{"a":"C","u":"Persona","q":"¿Qué es la capacidad de goce?","o":["La aptitud para adquirir derechos, que tienen todas las personas.","La aptitud para ejercer derechos por sí mismo, sin el ministerio de otro.","La aptitud para comparecer en juicio sin abogado.","La aptitud para contraer matrimonio y otorgar testamento."],"e":"Es un atributo de la personalidad; la capacidad de ejercicio, en cambio, puede faltar."},{"a":"C","u":"Persona","q":"¿Qué es el estado civil según el Código Civil?","o":["La calidad de un individuo en cuanto le habilita para ejercer ciertos derechos o contraer ciertas obligaciones civiles.","La situación de una persona en relación con su nacionalidad, su domicilio y su lugar de nacimiento.","La condición de casado, soltero o viudo que consta en el certificado del Registro Civil.","La calidad de una persona en cuanto es mayor o menor de edad, y capaz o incapaz."],"e":"Art. 304 CC."},{"a":"C","u":"Persona","q":"¿Cuál es una característica del nombre?","o":["Es inmutable, salvo los casos legales.","Es transferible por acto entre vivos.","Es prescriptible por el no uso prolongado.","Es embargable por los acreedores del titular."],"e":"La Ley 17.344 regula el cambio de nombre y apellidos, y la Ley 21.120 la rectificación de nombre y sexo registral."},{"a":"C","u":"Persona","q":"¿Qué es el patrimonio según la doctrina clásica?","o":["Un atributo de la personalidad: el conjunto de derechos y obligaciones avaluables en dinero.","El conjunto de bienes inmuebles inscritos a nombre de una persona en el Conservador.","La suma de todos los ingresos que una persona obtiene durante su vida laboral.","El conjunto de bienes que una persona recibe por herencia de sus padres."],"e":"Teoría del patrimonio-personalidad (Aubry y Rau): toda persona tiene un patrimonio, y solo uno."},{"a":"C","u":"Persona","q":"¿Qué es el domicilio político?","o":["El relativo al territorio del Estado en general.","El relativo a una parte determinada del territorio.","El que se fija para el cumplimiento de un contrato.","El que tiene una persona por su cargo público."],"e":"Art. 60 CC. El civil es relativo a una parte determinada del territorio del Estado (art. 61 CC)."},{"a":"C","u":"Persona","q":"¿Qué es el domicilio convencional o especial?","o":["El que las partes fijan en un contrato para los actos a que dé lugar.","El que corresponde a quienes ejercen funciones públicas en un lugar determinado.","El que tienen los menores de edad, que es el de sus padres o guardadores.","El que se presume por el solo hecho de residir en un lugar durante un año."],"e":"Art. 69 CC."},{"a":"C","u":"Persona","q":"¿Cuáles son las etapas de la muerte presunta?","o":["Mera ausencia, posesión provisoria y posesión definitiva.","Desaparición, declaración judicial y sucesión testada.","Citación, publicación en el Diario Oficial e inscripción.","Ausencia, búsqueda policial y fallecimiento presunto."],"e":"Arts. 80 a 94 CC. En ciertos casos especiales se concede directamente la posesión definitiva."},{"a":"C","u":"Persona","q":"¿Qué fecha se fija como día presuntivo de la muerte, por regla general?","o":["El último día del primer bienio desde las últimas noticias.","La fecha de las últimas noticias que se tuvieron del desaparecido.","La fecha en que se dicta la sentencia que declara la muerte presunta.","El último día del quinto año contado desde las últimas noticias."],"e":"Art. 81 N° 6 CC."},{"a":"C","u":"Persona","q":"¿Qué es una fundación?","o":["Un conjunto de bienes destinados a un fin de interés general.","Una agrupación de personas que persigue fines de lucro.","Una sociedad que carece de personalidad jurídica propia.","Un órgano del Estado funcional y territorialmente descentralizado."],"e":"Arts. 545 y siguientes CC; Ley 20.500."},{"a":"C","u":"Persona","q":"¿Qué ley regula la constitución de asociaciones y fundaciones sin fines de lucro?","o":["La Ley 20.500, que modificó el Título XXXIII del Libro I del Código Civil.","La Ley 18.046, sobre sociedades anónimas.","La Ley 19.857, sobre empresas individuales de responsabilidad limitada.","La Ley 20.659, sobre constitución de empresas en un día."],"e":"La Ley 20.500 (2011) simplificó la constitución de corporaciones y fundaciones, que hoy se inscriben en el Registro Nacional de Personas Jurídicas sin Fines de Lucro."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es el acto jurídico?","o":["Una manifestación de voluntad hecha con el propósito de crear, modificar o extinguir derechos.","Un hecho de la naturaleza que produce efectos jurídicos previstos por la ley sin intervención humana.","Un hecho del hombre que produce efectos jurídicos con independencia de la voluntad de su autor.","Una resolución de la autoridad que crea, modifica o extingue derechos de los particulares."],"e":"Concepto doctrinario."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es un acto jurídico unilateral?","o":["El que para nacer requiere la voluntad de una sola parte.","El que genera obligaciones para una sola de las partes.","El que se celebra sin cumplir solemnidades legales.","El que produce efectos solo para su autor y sus herederos."],"e":"Ej.: el testamento. No debe confundirse con el contrato unilateral, que es un acto bilateral (art. 1439 CC)."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es la capacidad de ejercicio?","o":["La aptitud para ejercer derechos por sí mismo, sin el ministerio de otro.","La aptitud de una persona para adquirir derechos y ser titular de obligaciones.","La aptitud de una persona para representar a otra en la celebración de un acto.","La aptitud de una persona para celebrar actos ante notario y otorgar escrituras."],"e":"Art. 1445 inc. 2 CC."},{"a":"C","u":"Acto Jurídico","q":"¿Cuál es la regla general en materia de capacidad?","o":["Toda persona es capaz, salvo las que la ley declara incapaces.","Toda persona es incapaz, salvo las que la ley declara capaces.","Solo son capaces los mayores de veintiún años no interdictos.","Solo son capaces las personas inscritas en el Registro Civil."],"e":"Art. 1446 CC."},{"a":"C","u":"Acto Jurídico","q":"¿Cuáles son los requisitos del objeto en los actos jurídicos?","o":["Real, comerciable, determinado o determinable y, si es un hecho, física y moralmente posible.","Corporal, de valor superior a dos UTM, ubicado en Chile e inscrito a nombre de una parte.","Existente al contratar, de dinero o fungible, y libre de todo gravamen o embargo.","Lícito, de propiedad del deudor, divisible y susceptible de tradición por inscripción."],"e":"Arts. 1461 y 1462 CC."},{"a":"C","u":"Acto Jurídico","q":"¿Qué es la inoponibilidad?","o":["La ineficacia de un acto válido respecto de ciertos terceros.","La nulidad de un acto por la falta de un requisito de validez.","La terminación de un contrato por incumplimiento de una de las partes.","La caducidad de un derecho por no ejercerse dentro del plazo legal."],"e":"Ejemplos: art. 1707 CC (contraescrituras) y art. 2160 CC (mandatario que excede sus facultades)."},{"a":"C","u":"Acto Jurídico","q":"¿Qué son las modalidades del acto jurídico?","o":["Elementos accidentales que alteran sus efectos normales, como la condición y el plazo.","Requisitos de existencia del acto, como la voluntad, el objeto, la causa y las solemnidades.","Las distintas formas de manifestar la voluntad, sea en forma expresa o en forma tácita.","Las sanciones de ineficacia del acto, como la nulidad absoluta y la inoponibilidad."],"e":"Son eleme
